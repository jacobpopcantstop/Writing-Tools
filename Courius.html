<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Courius Screenwriter</title>
    <script src="shared-toast.js"></script>
    <script src="shared-courius.js"></script>
    <script src="courius-format.js"></script>
    <script src="shared-pwa.js"></script>
    <script src="shared-tool-manifest.js"></script>
    <script src="shared-recent-sessions.js"></script>
    <script src="shared-commands.js"></script>
    <script src="shared-command-palette.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%225%22 y=%2230%22 width=%2290%22 height=%2265%22 rx=%225%22 fill=%22%23000000%22/><rect x=%225%22 y=%2210%22 width=%2290%22 height=%2225%22 fill=%22%23000000%22/><rect x=%225%22 y=%2210%22 width=%2218%22 height=%2225%22 fill=%22%23fd19c8%22 transform=%22skewX(-15)%22/><rect x=%2228%22 y=%2210%22 width=%2218%22 height=%2225%22 fill=%22%23fd19c8%22 transform=%22skewX(-15)%22/><rect x=%2251%22 y=%2210%22 width=%2218%22 height=%2225%22 fill=%22%23fd19c8%22 transform=%22skewX(-15)%22/><rect x=%2274%22 y=%2210%22 width=%2218%22 height=%2225%22 fill=%22%23fd19c8%22 transform=%22skewX(-15)%22/><line x1=%2215%22 y1=%2250%22 x2=%2285%22 y2=%2250%22 stroke=%22%23fd19c8%22 stroke-width=%223%22/><line x1=%2215%22 y1=%2265%22 x2=%2270%22 y2=%2265%22 stroke=%22%23fd19c8%22 stroke-width=%222%22/><line x1=%2215%22 y1=%2280%22 x2=%2255%22 y2=%2280%22 stroke=%22%23fd19c8%22 stroke-width=%222%22/></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            /* DEFAULT THEME (Dark Mode) */
            --bg-color: #0a0a0a;
            --paper-color: #121212;
            --text-color: #ffffff;
            --ui-bg: rgba(10, 10, 10, 0.95);
            --ui-text: #ffffff;
            --shadow: 0 12px 40px rgba(253, 25, 200, 0.15);
            --caret: #fd19c8;
            --suggestion: rgba(253, 25, 200, 0.4);
            --accent: #fd19c8; 
            --accent-gold: #fae84f; 
            --guide-color: rgba(253, 25, 200, 0.15);
            
            /* Font Settings */
            --courier: "Courier New", Courier, monospace;
            --line-height: 1.15;
            --font-size: 12pt;
        }

        /* LIGHT MODE OVERRIDES */
        body.day-mode {
            --bg-color: #e5e5e5;      /* Light Grey Desk */
            --paper-color: #ffffff;   /* White Paper */
            --text-color: #000000;    /* Black Text */
            --ui-bg: rgba(255, 255, 255, 0.95);
            --ui-text: #000000;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            --caret: #d600a4;         /* Darker pink for contrast */
            --suggestion: rgba(0, 0, 0, 0.4);
            --guide-color: rgba(0, 0, 0, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--courier);
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column; 
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            transition: background 0.4s ease;
        }

        /* --- Floating UI --- */
        .floating-controls {
            position: fixed;
            z-index: 1000;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            box-shadow: var(--shadow);
            transition: opacity 0.3s ease;
        }

        .actions-bar {
            top: 20px;
            right: 20px;
            flex-direction: column;
            gap: 8px;
        }

        .element-bar {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: row;
            gap: 4px;
        }

        .side-btn {
            background: transparent;
            border: none;
            color: var(--ui-text);
            width: 44px;
            height: 44px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
        }

        .element-bar .side-btn {
            width: auto;
            padding: 0 12px;
        }

        .side-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--ui-text);
        }

        .side-btn.active {
            background: var(--accent-gold);
            color: #000;
            text-shadow: none;
        }

        /* Tooltips */
        .side-btn::after {
            content: attr(data-label);
            position: absolute;
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .actions-bar .side-btn::after { right: 55px; top: 50%; transform: translateY(-50%); }
        .element-bar .side-btn::after { bottom: 55px; left: 50%; transform: translateX(-50%); }
        .side-btn:hover::after { opacity: 1; }
        .side-btn:not([data-label])::after { display: none; }

        /* --- Main Workspace --- */
        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto; 
            display: block; 
            padding: 60px 20px 100px 20px;
            scroll-behavior: smooth;
        }

        #page {
            background-color: var(--paper-color);
            color: var(--text-color);
            width: 8.5in;
            min-height: 11in; 
            padding: 1in 1in 1in 1.5in; 
            box-shadow: var(--shadow);
            outline: none;
            caret-color: var(--caret);
            transition: background 0.4s, color 0.4s;
            position: relative;
            margin: 0 auto; 
            
            /* Visual Page Breaks */
            background-image: linear-gradient(to bottom, transparent calc(11in - 1px), var(--guide-color) calc(11in - 1px), var(--guide-color) 11in);
            background-size: 100% 11in;
            background-repeat: repeat-y;
        }

        #save-bar {
            position: fixed;
            bottom: 25px;
            right: 80px;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--suggestion);
            opacity: 0.8;
            pointer-events: auto;
            background: var(--ui-bg);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--ui-text);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1400;
        }

        #writing-timer-btn {
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 2px 7px;
            font-family: var(--courier);
            font-size: 11px;
            letter-spacing: 0.04em;
            transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        #writing-timer-btn:hover {
            background: var(--button-hover);
            border-color: var(--guide-color);
        }

        #writing-timer-btn.timer-armed {
            border-color: var(--accent);
        }

        #writing-timer-btn.timer-triggered {
            color: #fca5a5;
            border-color: #fca5a5;
            box-shadow: 0 0 0 1px rgba(252, 165, 165, 0.35), 0 0 14px rgba(252, 165, 165, 0.18);
            animation: couriusTimerAlarm 1s ease-in-out infinite;
        }

        #writing-timer-label,
        #writing-timer {
            transition: max-width 0.22s ease, opacity 0.2s ease;
            white-space: nowrap;
        }

        @media (hover: hover) {
            #writing-timer-btn.timer-running {
                opacity: 0.35 !important;
                border-color: transparent;
                padding: 3px 6px;
                gap: 0;
            }

            #writing-timer-btn.timer-running::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 999px;
                background: var(--accent);
                box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
            }

            #writing-timer-btn.timer-running #writing-timer-label,
            #writing-timer-btn.timer-running #writing-timer {
                max-width: 0;
                opacity: 0;
                overflow: hidden;
            }

            #save-bar:hover #writing-timer-btn.timer-running,
            #save-bar:focus-within #writing-timer-btn.timer-running {
                opacity: 1 !important;
                border-color: var(--guide-color);
                padding: 2px 7px;
                gap: 4px;
            }

            #save-bar:hover #writing-timer-btn.timer-running::before,
            #save-bar:focus-within #writing-timer-btn.timer-running::before {
                display: none;
            }

            #save-bar:hover #writing-timer-btn.timer-running #writing-timer-label,
            #save-bar:hover #writing-timer-btn.timer-running #writing-timer,
            #save-bar:focus-within #writing-timer-btn.timer-running #writing-timer-label,
            #save-bar:focus-within #writing-timer-btn.timer-running #writing-timer {
                max-width: 90px;
                opacity: 1;
            }
        }

        @keyframes couriusTimerAlarm {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.72; transform: translateY(-1px); }
        }

        /* --- Screenplay Elements --- */
        #page div { 
            min-height: 1.1em; 
            position: relative; 
            overflow-wrap: break-word; 
        }

        #page .scene-heading { 
            margin-top: 2.3em; 
            margin-bottom: 1.15em; 
            font-weight: bold; 
            text-transform: uppercase; 
            width: 100%;
        }
        
        #page .action { 
            margin-bottom: 1.15em; 
            width: 100%;
        }
        
        #page .character { 
            margin-top: 1.15em; 
            margin-left: 2.2in; 
            width: 3.8in; 
            text-transform: uppercase; 
        }
        
        #page .parenthetical { 
            margin-left: 1.6in; 
            width: 2.5in; 
        }
        
        #page .dialogue { 
            margin-left: 1.1in; 
            width: 3.3in; 
            margin-bottom: 1.15em; 
        }
        
        #page .transition { 
            margin-top: 1.15em; 
            margin-bottom: 1.15em; 
            text-align: right; 
            text-transform: uppercase; 
            width: 100%;
        }

        #page div:empty::before {
            content: attr(data-placeholder);
            color: var(--suggestion);
            pointer-events: none;
            position: absolute;
            left: -160px;
            width: 140px;
            text-align: right;
            font-size: 8px;
            font-weight: 800;
            opacity: 0.4;
            text-transform: uppercase;
        }

        span.suggestion { color: var(--suggestion); opacity: 0.5; pointer-events: none; }

        /* --- Title Page Styles --- */
        .title-page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 9in; 
            width: 100%;
            text-align: center;
            page-break-after: always;
            position: relative;
            margin-bottom: 1in;
            border-bottom: 1px dashed var(--guide-color);
        }

        .tp-title { font-weight: bold; text-decoration: underline; margin-bottom: 2rem; font-size: 14pt; width: 80%; text-align: center; outline: none; }
        .tp-by { margin-bottom: 2rem; }
        .tp-author { margin-bottom: 4rem; width: 80%; text-align: center; outline: none; }
        .tp-contact { position: absolute; bottom: 0; left: 0; text-align: left; font-size: 10pt; width: 50%; outline: none; }

        @page {
            @top-left { content: none; }
            @top-center { content: none; }
            @top-right { content: none; }
            @bottom-left { content: none; }
            @bottom-center { content: none; }
            @bottom-right {
                content: counter(page);
                font-family: 'Courier Prime', 'Courier New', Courier, monospace;
                font-size: 12pt;
                color: #000000;
            }
        }

        @media print {
            html, body { height: auto; overflow: visible; }
            body { background: none; }
            .floating-controls, #save-bar, .scene-nav, .help-modal { display: none !important; }
            a[href="index.html"] { display: none !important; }
            .courius-import-marker, .snapshot-marker { display: none !important; }
            main { padding: 0; display: block; overflow: visible; height: auto; }
            #page { box-shadow: none; margin: 0; padding: 1in 1in 1in 1.5in !important; width: 100%; background-image: none; height: auto; overflow: visible; color: #000000 !important; caret-color: transparent !important; }
            #page div { opacity: 1 !important; }
            #page div[data-placeholder]::before { content: none !important; display: none !important; }
            .title-page-container { height: auto; min-height: 9in; margin-bottom: 0; border: none; }
            ::selection { background: transparent !important; }
        }

        /* Scene Navigator */
        .scene-nav {
            position: fixed;
            left: 20px;
            top: 80px;
            width: 200px;
            max-height: 60vh;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
            transition: all 0.3s ease;
        }
        .scene-nav.open {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0);
        }
        .scene-nav-header {
            padding: 12px 16px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ui-text);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scene-nav-list {
            max-height: calc(60vh - 50px);
            overflow-y: auto;
            padding: 8px;
        }
        .scene-nav-item {
            padding: 10px 12px;
            font-size: 0.65rem;
            color: var(--ui-text);
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scene-nav-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .scene-nav-item.active {
            background: var(--accent-gold);
            color: #fff;
        }

        /* Help Modal */
        .help-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .help-modal.open {
            opacity: 1;
            pointer-events: all;
        }
        .help-content {
            background: var(--paper-color);
            color: var(--text-color);
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
        }
        .help-content h3 {
            margin: 0 0 20px 0;
            font-size: 1rem;
        }
        .shortcut-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            font-size: 0.75rem;
        }
        .shortcut-key {
            background: rgba(0,0,0,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
        }

        /* Autocomplete Dropdown */
        .autocomplete-dropdown {
            position: fixed;
            z-index: 1500;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 25, 200, 0.25);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(253,25,200,0.08);
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            min-width: 220px;
            max-width: 400px;
        }
        .autocomplete-dropdown.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }
        .autocomplete-item {
            padding: 9px 14px;
            font-size: 0.7rem;
            font-family: var(--courier);
            color: var(--ui-text);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(253, 25, 200, 0.15);
        }
        .autocomplete-item.active {
            background: rgba(253, 25, 200, 0.2);
        }
        .autocomplete-item-hint {
            font-size: 0.55rem;
            opacity: 0.4;
            flex-shrink: 0;
        }
        .autocomplete-footer {
            padding: 5px 14px;
            font-size: 0.55rem;
            opacity: 0.35;
            border-top: 1px solid rgba(255,255,255,0.07);
            color: var(--ui-text);
            font-family: var(--courier);
        }

        .courius-import-marker {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .context-source-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(253, 25, 200, 0.45);
            background: rgba(253, 25, 200, 0.15);
            font-size: 0.52rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .context-source-meta {
            opacity: 0.72;
            font-size: 0.58rem;
        }
        .imports-panel {
            position: fixed;
            top: 20px;
            right: 88px;
            width: min(420px, calc(100vw - 24px));
            max-height: min(70vh, 560px);
            background: var(--ui-bg);
            color: var(--ui-text);
            border: 1px solid rgba(253, 25, 200, 0.25);
            border-radius: 10px;
            z-index: 1400;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .imports-panel.open { display: flex; }
        .imports-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(253, 25, 200, 0.18);
            font-size: 0.62rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }
        .imports-header button {
            border: 1px solid rgba(253, 25, 200, 0.4);
            background: transparent;
            color: inherit;
            border-radius: 6px;
            font-size: 0.52rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 7px;
            cursor: pointer;
        }
        .imports-header button:hover { background: rgba(253, 25, 200, 0.12); }
        .imports-list {
            overflow: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .imports-item {
            border: 1px solid rgba(253, 25, 200, 0.18);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.62rem;
            line-height: 1.35;
        }
        .imports-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .imports-item-actions {
            display: flex;
            gap: 6px;
            margin-top: 7px;
        }
        .imports-item button {
            border: 1px solid rgba(253, 25, 200, 0.4);
            background: transparent;
            color: inherit;
            border-radius: 6px;
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 7px;
            cursor: pointer;
        }
        .imports-item button:hover {
            background: rgba(253, 25, 200, 0.12);
        }
        .imports-empty {
            opacity: 0.65;
            font-size: 0.6rem;
            padding: 10px 6px;
        }
        .imports-section-title {
            padding: 2px 4px 0;
            opacity: 0.55;
            font-size: 0.54rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 1024px) {
            main { padding: 14px 10px 126px 10px; }
            #page {
                width: 100%;
                min-height: auto;
                padding: 0.75in 0.55in 0.9in 0.75in;
            }
            .actions-bar {
                top: auto;
                right: 10px;
                bottom: calc(74px + env(safe-area-inset-bottom));
                flex-direction: row;
                max-width: calc(100vw - 20px);
                overflow-x: auto;
            }
            .element-bar {
                left: 10px;
                right: 10px;
                bottom: calc(12px + env(safe-area-inset-bottom));
                transform: none;
                justify-content: flex-start;
                max-width: calc(100vw - 20px);
                overflow-x: auto;
            }
            .side-btn { min-height: 44px; min-width: 44px; }
            #save-bar { right: 12px; bottom: calc(62px + env(safe-area-inset-bottom)); }
            .imports-panel {
                right: 10px;
                top: calc(56px + env(safe-area-inset-top));
                width: calc(100vw - 20px);
                max-height: calc(66vh - env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>
<div id="imports-panel" class="imports-panel">
    <div class="imports-header">
        <span>Courius Imports</span>
        <button onclick="toggleImportsPanel(false)">Close</button>
    </div>
    <div id="imports-list" class="imports-list"></div>
</div>

<div class="floating-controls actions-bar">
    <div style="font-weight: 900; font-size: 0.5rem; text-align: center; margin-bottom: 4px; opacity: 0.5; color: var(--ui-text);">COURIUS</div>
    <button class="side-btn" data-label="Scenes (N)" onclick="toggleSceneNav()">📑</button>
    <button class="side-btn" data-label="Title Page" onclick="toggleTitlePage()">Title</button>
    <button class="side-btn" data-label="Import FDX" onclick="document.getElementById('file-input').click()">Imp</button>
    <button class="side-btn" data-label="Theme (D)" onclick="toggleTheme()">🌓</button>
    <button class="side-btn" data-label="Help (?)" onclick="toggleHelp()">❓</button>
    <button class="side-btn" data-label="Import History" onclick="toggleImportsPanel()">↺</button>
    <button class="side-btn" data-label="Export FDX" onclick="downloadFDX()">FDX</button>
    <button class="side-btn" data-label="Export RTF" onclick="downloadRTF()">RTF</button>
    <button class="side-btn" data-label="Print/PDF" onclick="window.print()">PDF</button>

        <div style="margin-top:12px; padding-top:12px; border-top: 1px solid rgba(0,0,0,0.1); font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; opacity:0.5;">Autocomplete</div>

<div class="floating-controls element-bar">
