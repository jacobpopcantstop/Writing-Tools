    | <button id="writing-timer-btn" type="button" title="Click to start or pause the alarm. Double-click to set minutes."><span id="writing-timer-label">Alarm</span> <span id="writing-timer">25:00</span></button>
</div>

<a href="index.html" style="position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.15; color: var(--text-color); text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.5'" onmouseout="this.style.opacity='0.15'">Writing Tools Suite</a>

<script>
    const EDITOR = document.getElementById('page');
    const STATUS = document.getElementById('save-status');
    const PAGE_COUNT = document.getElementById('page-count');
    const STORAGE_KEY = 'writingtools_courius_storage';
    const STORAGE_REV_KEY = 'writingtools_courius_revision_v1';
    const STORAGE_SNAPSHOTS_KEY = 'writingtools_courius_snapshots_v1';
    const IMPORTS_KEY = 'writingtools_courius_imports_v1';
    // NEW KEY to avoid conflict with previous Light Mode settings
    const THEME_STORAGE_KEY = 'courius_theme_v2'; 
    
    const ELEMENT_CYCLE = ['scene-heading', 'action', 'character', 'parenthetical', 'dialogue', 'transition'];
    const NEXT_ELEMENT = {
        'scene-heading': 'action',
        'action': 'action',
        'character': 'dialogue',
        'parenthetical': 'dialogue',
        'dialogue': 'action',
        'transition': 'scene-heading'
    };
    const DISPLAY_NAMES = {
        'scene-heading': 'Scene Heading',
        'action': 'Action',
        'character': 'Character',
        'dialogue': 'Dialogue',
        'parenthetical': 'Parenthetical',
        'transition': 'Transition'
    };
    const SCENE_TIME_HINTS = ['DAY.', 'NIGHT.', 'DUSK.', 'DAWN.', 'CONTINUOUS.', 'LATER.'];

    let characterSet = new Set();
    let locationSet = new Set();
    let sceneLocationCoreSet = new Set();
    let sceneTimeSet = new Set(SCENE_TIME_HINTS);
    let characterTurnPairs = new Map();
    let saveTimeout;
    let importHistory = [];
    let writingTimerDuration = 25 * 60;
    let writingTimerLastStart = null;
    let writingTimerInterval = null;
    let writingTimerTriggered = false;
    const WRITING_TIMER_KEY = 'writingtools_courius_timer_v1';

    // --- Autocomplete state ---
    const DROPDOWN = document.getElementById('autocomplete-dropdown');
    let dropdownBlock = null;
    let dropdownMatches = [];
    let dropdownActiveIndex = 0;
    let localKnownRevision = 0;
    const COURIUS_TAB_ID = 'courius-' + Math.random().toString(36).slice(2, 10);

    function getImportHistory() {
        if (window.WTCourius && typeof window.WTCourius.getImportHistory === 'function') {
            return window.WTCourius.getImportHistory();
        }
        try {
            const raw = localStorage.getItem(IMPORTS_KEY);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
            return [];
        }
    }

    function sanitizeImportedHtml(html) {
        const raw = String(html || '');
        if (!raw.trim()) return '';
        const container = document.createElement('div');
        container.innerHTML = raw;
        container.querySelectorAll('script,iframe,object,embed,link,meta').forEach((node) => node.remove());
        container.querySelectorAll('*').forEach((el) => {
            Array.from(el.attributes).forEach((attr) => {
                const name = String(attr.name || '').toLowerCase();
                const value = String(attr.value || '');
                if (!name) return;
                if (name.startsWith('on')) {
                    el.removeAttribute(attr.name);
                    return;
                }
                if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(value)) {
                    el.removeAttribute(attr.name);
                }
            });
        });
        return container.innerHTML;
    }

    function makeImportMarker(source, createdAt) {
        const safeSource = escapeHtml(String(source || 'tool'));
        const stampText = createdAt ? new Date(createdAt).toLocaleString() : '';
        return `<div class="action courius-import-marker"><span class="context-source-badge">${safeSource.toUpperCase()}</span><span class="context-source-meta">${stampText ? `imported ${escapeHtml(stampText)}` : 'imported'}</span></div>`;
    }

    function normalizeLegacyImportMarkers() {
        const blocks = Array.from(EDITOR.querySelectorAll('.action'));
        blocks.forEach((node) => {
            const text = getPureText(node).trim();
            const legacy = text.match(/^---\s+(.+?)\s+·\s+(.+?)\s+---$/);
            if (!legacy) return;
            node.classList.add('courius-import-marker');
            node.innerHTML = `<span class="context-source-badge">${escapeHtml(legacy[1])}</span><span class="context-source-meta">imported ${escapeHtml(legacy[2])}</span>`;
        });
    }

    function renderImportHistory() {
        const list = document.getElementById('imports-list');
        if (!list) return;
        importHistory = getImportHistory();
        const snapshots = getSnapshotList();
        const importItemsHtml = importHistory.slice(0, 24).map((item) => {
            const source = escapeHtml(String(item.source || 'tool').toUpperCase());
            const stamp = item.createdAt ? new Date(item.createdAt).toLocaleString() : '';
            const previewText = String(item.payload || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const preview = escapeHtml(previewText.slice(0, 110) || '(no preview)');
            const id = escapeHtml(String(item.id || ''));
            return `<div class="imports-item">
                <div class="imports-item-header">
                    <span class="context-source-badge">${source}</span>
                    <span class="context-source-meta">${escapeHtml(stamp)}</span>
                </div>
                <div>${preview}${previewText.length > 110 ? '...' : ''}</div>
                <div class="imports-item-actions">
                    <button onclick="restoreImport('${id}', 'append')">Append</button>
                    <button onclick="restoreImport('${id}', 'overwrite')">Replace</button>
                </div>
            </div>`;
        }).join('');

        const snapshotItemsHtml = snapshots.slice(0, 12).map((snap) => {
            const id = escapeHtml(String(snap.id || ''));
            const stamp = snap.at ? new Date(snap.at).toLocaleString() : '';
            const reason = escapeHtml(String(snap.reason || 'snapshot').replace(/-/g, ' '));
            const previewText = String(snap.payload || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const preview = escapeHtml(previewText.slice(0, 110) || '(no preview)');
            return `<div class="imports-item">
                <div class="imports-item-header">
                    <span class="context-source-badge">SNAPSHOT</span>
                    <span class="context-source-meta">${escapeHtml(stamp)}</span>
                </div>
                <div class="context-source-meta" style="margin-bottom:6px;">${reason}</div>
                <div>${preview}${previewText.length > 110 ? '...' : ''}</div>
                <div class="imports-item-actions">
                    <button onclick="restoreSnapshot('${id}', 'append')">Append</button>
                    <button onclick="restoreSnapshot('${id}', 'overwrite')">Replace</button>
                </div>
            </div>`;
        }).join('');

        if (!importItemsHtml && !snapshotItemsHtml) {
            list.innerHTML = '<div class="imports-empty">No imports or snapshots yet.</div>';
            return;
        }
        const clearSnapshotsBtn = snapshots.length
            ? '<button onclick="clearRecoverySnapshots()">Clear Snapshots</button>'
            : '';
        list.innerHTML = `
            <div class="imports-section-title">Courius Imports</div>
            ${importItemsHtml || '<div class="imports-empty">No imports yet.</div>'}
            <div class="imports-section-title" style="margin-top:4px; display:flex; align-items:center; justify-content:space-between;">
                <span>Recovery Snapshots</span>${clearSnapshotsBtn}
            </div>
            ${snapshotItemsHtml || '<div class="imports-empty">No recovery snapshots.</div>'}
        `;
    }

    function toggleImportsPanel(forceOpen) {
        const panel = document.getElementById('imports-panel');
        if (!panel) return;
        const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !panel.classList.contains('open');
        if (shouldOpen) {
            renderImportHistory();
            panel.classList.add('open');
        } else {
            panel.classList.remove('open');
        }
    }

    function restoreImport(importId, mode) {
        const found = importHistory.find((item) => String(item.id) === String(importId));
        if (!found || !found.payload) return;
        const marker = makeImportMarker(found.source, found.createdAt);
        const sanitizedPayload = sanitizeImportedHtml(found.payload);
        if (!sanitizedPayload) return;
        const payload = `${marker}${sanitizedPayload}`;
        const shouldOverwrite = String(mode || '').toLowerCase() === 'overwrite';
        if (shouldOverwrite) {
            if (!confirm('Replace current draft with this import snapshot?')) return;
            EDITOR.innerHTML = payload;
        } else {
            const divider = EDITOR.innerHTML.trim() ? '<div class="action"><br></div>' : '';
            EDITOR.insertAdjacentHTML('beforeend', `${divider}${payload}`);
        }
        triggerSave();
        toggleImportsPanel(false);
    }

    function restoreSnapshot(snapshotId, mode) {
        const snapshots = getSnapshotList();
        const found = snapshots.find((item) => String(item.id) === String(snapshotId));
        if (!found || !found.payload) return;
        const marker = makeImportMarker('Snapshot', found.at);
        const sanitizedPayload = sanitizeImportedHtml(found.payload);
        if (!sanitizedPayload) return;
        const payload = `${marker}${sanitizedPayload}`;
        const shouldOverwrite = String(mode || '').toLowerCase() === 'overwrite';
        if (shouldOverwrite) {
            if (!confirm('Replace current draft with this recovery snapshot?')) return;
            EDITOR.innerHTML = payload;
        } else {
            const divider = EDITOR.innerHTML.trim() ? '<div class="action"><br></div>' : '';
            EDITOR.insertAdjacentHTML('beforeend', `${divider}${payload}`);
        }
        triggerSave();
        toggleImportsPanel(false);
    }

    function clearRecoverySnapshots() {
        if (!confirm('Clear all Courius recovery snapshots?')) return;
        try {
            localStorage.removeItem(STORAGE_SNAPSHOTS_KEY);
        } catch (_) {}
        renderImportHistory();
    }

    function getStorageComparableHtml(rawHtml) {
        return String(rawHtml || '')
            .replace(/<span class="suggestion">[\s\S]*?<\/span>/gi, '')
            .trim();
    }

    function getEditorHtmlForStorage() {
        const clone = EDITOR.cloneNode(true);
        clone.querySelectorAll('.suggestion').forEach((s) => s.remove());
        return clone.innerHTML;
    }

    function getSnapshotList() {
        try {
            const raw = localStorage.getItem(STORAGE_SNAPSHOTS_KEY);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
            return [];
        }
    }

    function saveRecoverySnapshot(html, reason, meta) {
        const payload = String(html || '').trim();
        if (!payload) return;
        try {
            const snapshots = getSnapshotList();
            snapshots.unshift({
                id: 'snap_' + Date.now() + '_' + Math.floor(Math.random() * 100000),
                at: new Date().toISOString(),
                reason: String(reason || 'autosave'),
                sourceTab: COURIUS_TAB_ID,
                meta: meta && typeof meta === 'object' ? meta : {},
                payload: payload
            });
            localStorage.setItem(STORAGE_SNAPSHOTS_KEY, JSON.stringify(snapshots.slice(0, 20)));
        } catch (_) {}
    }

    function persistCouriusDocument(nextHtml, reason) {
        const candidate = String(nextHtml || '');
        const comparableNext = getStorageComparableHtml(candidate);
        if (!comparableNext) return true;

        const currentRev = parseInt(localStorage.getItem(STORAGE_REV_KEY) || '0', 10) || 0;
        const currentStored = String(localStorage.getItem(STORAGE_KEY) || '');
        const comparableStored = getStorageComparableHtml(currentStored);

        if (currentRev > localKnownRevision && comparableStored !== comparableNext) {
            saveRecoverySnapshot(candidate, 'save-conflict', {
                reason: String(reason || 'autosave'),
                baseRevision: localKnownRevision,
                remoteRevision: currentRev
            });
            STATUS.innerText = 'Conflict detected; local snapshot saved';
            return false;
        }

        const nextRev = Math.max(currentRev, localKnownRevision) + 1;
        localStorage.setItem(STORAGE_KEY, candidate);
        localStorage.setItem(STORAGE_REV_KEY, String(nextRev));
        localStorage.setItem('writingtools_courius_updated_at', String(Date.now()));
        localKnownRevision = nextRev;
        return true;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const content = localStorage.getItem(STORAGE_KEY);
        localKnownRevision = parseInt(localStorage.getItem(STORAGE_REV_KEY) || '0', 10) || 0;
        if (content) EDITOR.innerHTML = sanitizeImportedHtml(content);
        loadWritingTimer();
        normalizeLegacyImportMarkers();
        if (!EDITOR.innerHTML.trim() || (EDITOR.children.length === 0)) {
            // Ensure at least one line if empty
            if (EDITOR.innerHTML.trim() === "") createLine('scene-heading');
        }
        updateSuggestions();
        
        // Theme Logic: Default is Dark (no class). Check local key first, then suite-wide key.
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        const suiteTheme = localStorage.getItem('writingtools_theme');
        if (savedTheme === 'light' || (!savedTheme && suiteTheme === 'light')) {
            document.body.classList.add('day-mode');
        }
        
        updateSelectorUI();
        updatePageCount();
        if (writingTimerLastStart && !writingTimerInterval) {
            writingTimerInterval = setInterval(tickWritingTimer, 250);
        }
        renderWritingTimer();
        renderImportHistory();
    });

    window.addEventListener('storage', (e) => {
        if (!e || e.key !== STORAGE_REV_KEY) return;
        const incomingRev = parseInt(e.newValue || '0', 10) || 0;
        if (incomingRev <= localKnownRevision) return;
        const remoteRaw = String(localStorage.getItem(STORAGE_KEY) || '');
        const remoteHtml = sanitizeImportedHtml(remoteRaw);
        const localHtml = getEditorHtmlForStorage();
        const sameContent = getStorageComparableHtml(localHtml) === getStorageComparableHtml(remoteHtml);
        if (!sameContent) {
            saveRecoverySnapshot(localHtml, 'remote-sync', {
                previousRevision: localKnownRevision,
                incomingRevision: incomingRev
            });
            EDITOR.innerHTML = remoteHtml;
            updateSuggestions();
            updateSelectorUI();
            updatePageCount();
            STATUS.innerText = 'Synced from another tab; snapshot saved';
        }
        localKnownRevision = incomingRev;
    });

    function focusEditor(e) {
        if (e.target.id === 'editor-container' && document.activeElement !== EDITOR) {
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(EDITOR.lastElementChild || EDITOR);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            EDITOR.focus();
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('day-mode');
        const isLight = document.body.classList.contains('day-mode');
        localStorage.setItem(THEME_STORAGE_KEY, isLight ? 'light' : 'dark');
        localStorage.setItem('writingtools_theme', isLight ? 'light' : 'dark');
    }

    // --- Title Page Logic ---
    function toggleTitlePage() {
        const firstChild = EDITOR.firstElementChild;
        if (firstChild && firstChild.classList.contains('title-page-container')) {
            firstChild.remove();
        } else {
            const tp = document.createElement('div');
            tp.className = 'title-page-container';
            tp.contentEditable = "false"; 
            tp.innerHTML = `
                <div class="tp-title" contenteditable="true" data-placeholder="TITLE">TITLE</div>
                <div class="tp-by">by</div>
                <div class="tp-author" contenteditable="true" data-placeholder="Author Name">Author Name</div>
                <div class="tp-contact" contenteditable="true" data-placeholder="Contact Info">Contact Info</div>
            `;
            EDITOR.prepend(tp);
        }
        triggerSave();
    }

    // --- Core Editor Logic ---

    EDITOR.addEventListener('beforeinput', (e) => {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        
        const rawNode = sel.anchorNode;
        const el = rawNode.nodeType === 3 ? rawNode.parentNode : rawNode;

        // Explicitly Allow title page editing
        if (el.classList.contains('tp-title') || el.classList.contains('tp-author') || el.classList.contains('tp-contact')) {
            return;
        }

        const block = getBlock(rawNode);
        if (!block) return;
        
        // Prevent typing in title page container itself
        if (block.classList.contains('title-page-container')) {
             e.preventDefault();
             return;
        }

        const type = block.className;
        
        if ((type === 'scene-heading' || type === 'character') && e.data) {
            e.preventDefault();
            document.execCommand('insertText', false, e.data.toUpperCase());
        }

        if (type === 'action') {
            const text = getPureText(block);
            if ((text.length === 0 || text.match(/[.!?]\s*$/)) && e.data && e.data.match(/[a-z]/)) {
                e.preventDefault();
                document.execCommand('insertText', false, e.data.toUpperCase());
            }
        }

        if (type === 'dialogue') {
            const text = getPureText(block);
            if (text.length === 0 && e.data && e.data.match(/[a-z]/)) {
                e.preventDefault();
                document.execCommand('insertText', false, e.data.toUpperCase());
            }
        }
    });

    EDITOR.addEventListener('keydown', (e) => {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const currentBlock = getBlock(range.startContainer);
        if (!currentBlock) return;
        
        const el = sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentNode : sel.anchorNode;

        // Skip script shortcuts if inside title page fields
        if (el.classList.contains('tp-title') || el.classList.contains('tp-author') || el.classList.contains('tp-contact')) {
             return;
        }
        
        // Block Enter on the container wrapper
        if (currentBlock.parentElement.classList.contains('title-page-container')) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                return;
            }
            return; 
        }

        const type = currentBlock.className;

        if (e.key === 'ArrowDown' && DROPDOWN.classList.contains('visible')) {
            e.preventDefault();
            dropdownActiveIndex = Math.min(dropdownActiveIndex + 1, dropdownMatches.length - 1);
            renderDropdownItems();
            return;
        }

        if (e.key === 'ArrowUp' && DROPDOWN.classList.contains('visible')) {
            e.preventDefault();
            dropdownActiveIndex = Math.max(dropdownActiveIndex - 1, 0);
            renderDropdownItems();
            return;
        }

        if (e.key === 'Escape' && DROPDOWN.classList.contains('visible')) {
            e.preventDefault();
            hideDropdown();
            return;
        }

        if (e.key === 'Tab') {
            e.preventDefault();
            if (DROPDOWN.classList.contains('visible')) {
                acceptFromDropdown(dropdownBlock, dropdownMatches[dropdownActiveIndex]);
            } else {
                const sugg = currentBlock.querySelector('.suggestion');
                if (sugg) {
                    acceptSuggestion(currentBlock, sugg);
                } else {
                    const currentIndex = ELEMENT_CYCLE.indexOf(type);
                    const nextIndex = e.shiftKey ?
                        (currentIndex - 1 + ELEMENT_CYCLE.length) % ELEMENT_CYCLE.length :
                        (currentIndex + 1) % ELEMENT_CYCLE.length;
                    setBlockType(currentBlock, ELEMENT_CYCLE[nextIndex]);
                }
            }
            updateSelectorUI();
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            if (DROPDOWN.classList.contains('visible')) {
                acceptFromDropdown(dropdownBlock, dropdownMatches[dropdownActiveIndex]);
                createLine(NEXT_ELEMENT[type] || 'action', currentBlock);
                updateSelectorUI();
                return;
            }
            const sugg = currentBlock.querySelector('.suggestion');
            if (sugg) acceptSuggestion(currentBlock, sugg);
            if (type === 'parenthetical') {
                const text = getPureText(currentBlock).trim();
                if (text === '()' || text === '(' || text === ')') currentBlock.innerHTML = '<br>';
            }
            createLine(NEXT_ELEMENT[type] || 'action', currentBlock);
            updateSelectorUI();
        }
    });

    EDITOR.addEventListener('keyup', (e) => {
        // Eagerly refresh suggestion sets so newly typed chars/headings are immediately available
        updateSuggestions();
        const block = getBlock(window.getSelection().anchorNode);
        if (block && (block.className === 'character' || block.className === 'scene-heading')) {
            handleAutofill(block, block.className, e.key);
        } else {
            hideDropdown();
        }
        updateSelectorUI();
        triggerSave();
        updatePageCount();
    });

    // Add mouse interactions for UI sync
    EDITOR.addEventListener('mouseup', updateSelectorUI);
    EDITOR.addEventListener('click', updateSelectorUI);

    // Dismiss dropdown when clicking outside editor or dropdown
    document.addEventListener('mousedown', (e) => {
        if (!DROPDOWN.contains(e.target) && !EDITOR.contains(e.target)) {
            hideDropdown();
        }
    });

    function getBlock(node) {
        if (!node) return null;
        if (node.nodeType === 3) node = node.parentNode; // Text node -> Element
        
        // Walk up until we find a direct child of #page or stop at title page parts
        while (node && node.parentElement && node.parentElement.id !== 'page' && !node.classList?.contains('title-page-container')) {
             node = node.parentElement;
        }
        return node;
    }

    function setBlockType(div, type) {
        const oldType = div.className;
        if (oldType === 'parenthetical' && type !== 'parenthetical') {
            // Parenthetical wrappers should never leak when cycling to another element type.
            let text = getPureText(div)
                .replace(/\u00a0/g, ' ')
                .replace(/^\s*\(+\s*/, '')
                .replace(/\s*\)+\s*$/, '')
                .replace(/\s+/g, ' ')
                .trim();
            div.innerText = text || '\n';
        }
        div.className = type;
        div.setAttribute('data-placeholder', DISPLAY_NAMES[type]);
        if (type === 'parenthetical') {
            const text = getPureText(div).trim();
            if (!text.startsWith('(')) {
                div.innerHTML = '(' + text + ')';
                const range = document.createRange();
                const sel = window.getSelection();
                if (div.firstChild) {
                    range.setStart(div.firstChild, 1);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
        }
    }

    function previousBlockOfType(fromBlock, type) {
        let node = fromBlock ? fromBlock.previousElementSibling : null;
        while (node) {
            if (node.classList && node.classList.contains(type)) return node;
            node = node.previousElementSibling;
        }
        return null;
    }

    function previousDifferentCharacterName(fromBlock, currentName) {
        let node = fromBlock ? fromBlock.previousElementSibling : null;
        while (node) {
            if (node.classList && node.classList.contains('character')) {
                const name = getPureText(node).trim().toUpperCase();
                if (name && name !== currentName) return name;
            }
            node = node.previousElementSibling;
        }
        return '';
    }

    function setBootstrapSuggestion(block, suggestionText) {
        if (!block || !suggestionText) return;
        block.innerHTML = `<span class="suggestion">${escapeHtml(String(suggestionText).toUpperCase())}</span>`;
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(block);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function applyLineBootstrapSuggestion(block, type, afterBlock) {
        if (!block || !type) return;
        if (getPureText(block).trim()) return;

        if (type === 'character') {
            const lastCharBlock = previousBlockOfType(block, 'character');
            if (!lastCharBlock) return;
            const lastName = getPureText(lastCharBlock).trim().toUpperCase();
            if (!lastName) return;
            const altName = previousDifferentCharacterName(lastCharBlock, lastName);
            if (altName) {
                setBootstrapSuggestion(block, altName);
            }
            return;
        }

        if (type === 'scene-heading') {
            const source = afterBlock || previousBlockOfType(block, 'scene-heading');
            const sourceText = source ? getPureText(source).trim().toUpperCase() : '';
            if (!sourceText) return;
            const hasDash = /\s-\s/.test(sourceText);
            if (hasDash) {
                const timePart = sourceText.split(/\s-\s/).slice(1).join(' - ').trim();
                if (timePart) {
                    setBootstrapSuggestion(block, timePart);
                    return;
                }
            }
            setBootstrapSuggestion(block, SCENE_TIME_HINTS[0]);
        }
    }

    function createLine(type, afterBlock = null) {
        const div = document.createElement('div');
        setBlockType(div, type);
        if (type !== 'parenthetical') div.innerHTML = '<br>';
        afterBlock ? afterBlock.after(div) : EDITOR.appendChild(div);
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(div);
        range.collapse(type !== 'parenthetical');
        if (type === 'parenthetical' && div.firstChild) range.setStart(div.firstChild, 1);
        sel.removeAllRanges();
        sel.addRange(range);
        applyLineBootstrapSuggestion(div, type, afterBlock);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function changeElementType(type) {
        const sel = window.getSelection();
        const currentBlock = getBlock(sel.anchorNode);
        if (currentBlock && !currentBlock.classList.contains('title-page-container')) {
            setBlockType(currentBlock, type);
            updateSelectorUI();
            EDITOR.focus();
            triggerSave();
        }
    }

    function updateSelectorUI() {
        const sel = window.getSelection();
        const block = getBlock(sel.anchorNode);
        const type = block ? block.className : null;
        document.querySelectorAll('.element-bar .side-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === type);
        });
    }

    function getPureText(div) {
        if (!div.firstChild) return "";
        let text = div.firstChild.nodeType === 3 ? div.firstChild.textContent : div.innerText;
        const sugg = div.querySelector('.suggestion');
        if (sugg) text = text.replace(sugg.textContent, '');
        return text.replace(/\n$/, '');
    }

    function parseSceneHeadingParts(text) {
        const value = String(text || '').toUpperCase().trim();
        if (!value) return { prefix: '', location: '', time: '', hasDash: false, raw: '' };
        const match = value.match(/^(INT\/EXT|INT|EXT)\.\s*(.*)$/);
        const prefix = match ? match[1] + '.' : '';
        const remainder = match ? match[2] : value;
        const dashIdx = remainder.indexOf(' - ');
        if (dashIdx >= 0) {
            const location = remainder.slice(0, dashIdx).trim();
            const time = remainder.slice(dashIdx + 3).trim();
            return { prefix, location, time, hasDash: true, raw: value };
        }
        if (/\s-\s*$/.test(value)) {
            const location = remainder.replace(/\s-\s*$/, '').trim();
            return { prefix, location, time: '', hasDash: true, raw: value };
        }
        return { prefix, location: remainder.trim(), time: '', hasDash: false, raw: value };
    }

    function normalizeSceneHeading(value) {
        const parts = parseSceneHeadingParts(value);
        if (!parts.location) return '';
        const prefix = parts.prefix || 'INT.';
        if (!parts.hasDash) return `${prefix} ${parts.location}`.trim();
        const time = parts.time || 'DAY.';
        return `${prefix} ${parts.location} - ${time}`.trim();
    }

    function getPreviousCharacterName(block) {
        const prev = previousBlockOfType(block, 'character');
        return prev ? getPureText(prev).trim().toUpperCase() : '';
    }

    function rankCharacterMatches(matches, block) {
        const previousName = getPreviousCharacterName(block);
        if (!previousName) return matches;
        const preferred = characterTurnPairs.get(previousName) || new Set();
        if (!preferred.size) return matches;
        return matches.slice().sort((a, b) => {
            const aPreferred = preferred.has(a) ? 0 : 1;
            const bPreferred = preferred.has(b) ? 0 : 1;
            return aPreferred - bPreferred || a.localeCompare(b);
        });
    }

    function getMatches(text, targetSet, type, block) {
        const results = [];
        for (let entry of targetSet) {
            if (entry === text) continue;
            if (type === 'scene-heading') {
                const parsedText = parseSceneHeadingParts(text);
                if (/\s-\s*$/.test(text)) {
                    // Typing "... -" should suggest time tokens immediately.
                    sceneTimeSet.forEach((token) => {
                        results.push(`${text} ${token}`.replace(/\s+/g, ' ').trim());
                    });
                    break;
                }
                const normalizedEntry = normalizeSceneHeading(entry);
                const entryParts = parseSceneHeadingParts(normalizedEntry);
                const fullStarts = normalizedEntry.startsWith(text);
                const locStarts = entryParts.location && entryParts.location.startsWith(parsedText.location || text);
                const timeStarts = parsedText.hasDash && parsedText.time
                    ? (entryParts.time && entryParts.time.startsWith(parsedText.time))
                    : false;
                if (fullStarts || locStarts || timeStarts) {
                    results.push(normalizedEntry);
                }
            } else {
                if (entry.startsWith(text)) {
                    results.push(entry);
                }
            }
        }
        if (type === 'scene-heading') {
            const parsedText = parseSceneHeadingParts(text);
            if (parsedText.location) {
                sceneLocationCoreSet.forEach((loc) => {
                    if (!loc.startsWith(parsedText.location)) return;
                    const heading = `${parsedText.prefix || 'INT.'} ${loc}${parsedText.hasDash ? ` - ${parsedText.time || SCENE_TIME_HINTS[0]}` : ''}`.trim();
                    results.push(heading);
                });
            }
            if (parsedText.hasDash) {
                sceneTimeSet.forEach((token) => {
                    if (parsedText.time && !token.startsWith(parsedText.time)) return;
                    const heading = `${parsedText.prefix || 'INT.'} ${parsedText.location || 'LOCATION'} - ${token}`.trim();
                    results.push(heading);
                });
            }
        }

        // Sort: exact prefix first, then broader matches
        results.sort((a, b) => {
            const aPrefix = a.startsWith(text) ? 0 : 1;
            const bPrefix = b.startsWith(text) ? 0 : 1;
            return aPrefix - bPrefix || a.localeCompare(b);
        });
        const deduped = Array.from(new Set(results)).slice(0, 20);
        if (type === 'character') {
            return rankCharacterMatches(deduped, block).slice(0, 8);
        }
        return deduped.slice(0, 8);
    }

    function handleAutofill(block, type, key) {
        const existingSugg = block.querySelector('.suggestion');
        if (existingSugg) existingSugg.remove();
        const text = getPureText(block).toUpperCase().trim();
        if (text.length < 1 || ['Backspace', 'Delete', 'Enter', 'ArrowUp', 'ArrowDown', 'Escape', 'Tab'].includes(key)) {
            if (!['ArrowUp', 'ArrowDown'].includes(key)) hideDropdown();
            return;
        }

        const targetSet = (type === 'character') ? characterSet : locationSet;
        const matches = getMatches(text, targetSet, type, block);

        if (matches.length === 0) { hideDropdown(); return; }

        // Inline ghost for top match if it's a prefix match
        const top = matches[0];
        if (top.startsWith(text) && top !== text) {
            const span = document.createElement('span');
            span.className = 'suggestion';
            span.textContent = top.substring(text.length);
            block.appendChild(span);
        }

        // Show dropdown for all matches
        dropdownMatches = matches;
        dropdownActiveIndex = 0;
        dropdownBlock = block;
        showDropdown(block);
    }

    function showDropdown(block) {
        const rect = block.getBoundingClientRect();
        // Smart positioning: flip up if near bottom of viewport
        const spaceBelow = window.innerHeight - rect.bottom;
        const dropHeight = Math.min(dropdownMatches.length * 34 + 30, 300);
        const showAbove = spaceBelow < dropHeight + 8 && rect.top > dropHeight;

        DROPDOWN.style.left = rect.left + 'px';
        DROPDOWN.style.maxWidth = Math.max(rect.width, 220) + 'px';
        if (showAbove) {
            DROPDOWN.style.top = '';
            DROPDOWN.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
        } else {
            DROPDOWN.style.bottom = '';
            DROPDOWN.style.top = (rect.bottom + 4) + 'px';
        }
        renderDropdownItems();
        DROPDOWN.classList.add('visible');
    }

    function renderDropdownItems() {
        DROPDOWN.innerHTML = '';
        dropdownMatches.forEach((match, i) => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item' + (i === dropdownActiveIndex ? ' active' : '');
            const label = document.createElement('span');
            label.textContent = match;
            item.appendChild(label);
            if (i === 0) {
                const hint = document.createElement('span');
                hint.className = 'autocomplete-item-hint';
                hint.textContent = 'Tab ↵';
                item.appendChild(hint);
            }
            item.onmousedown = (e) => {
                e.preventDefault(); // don't blur editor
                dropdownActiveIndex = i;
                acceptFromDropdown(dropdownBlock, match);
            };
            DROPDOWN.appendChild(item);
        });
        if (dropdownMatches.length > 1) {
            const footer = document.createElement('div');
            footer.className = 'autocomplete-footer';
            footer.textContent = '↑↓ navigate · Tab/↵ accept · Esc dismiss';
            DROPDOWN.appendChild(footer);
        }
        // Scroll active item into view
        const activeEl = DROPDOWN.querySelector('.active');
        if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    function hideDropdown() {
        DROPDOWN.classList.remove('visible');
        dropdownMatches = [];
        dropdownBlock = null;
        dropdownActiveIndex = 0;
    }

    function acceptFromDropdown(block, value) {
        if (!block || !value) return;
        const existingSugg = block.querySelector('.suggestion');
        if (existingSugg) existingSugg.remove();
        // Replace entire block text with selected value
        const textNode = block.firstChild && block.firstChild.nodeType === 3 ? block.firstChild : null;
        if (textNode) {
            textNode.textContent = value;
        } else {
            block.innerText = value;
        }
        // Move cursor to end
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(block);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
        hideDropdown();
        triggerSave();
    }

    function acceptSuggestion(block, span) {
        const text = span.textContent;
        span.remove();
        hideDropdown();
        document.execCommand('insertText', false, text);
    }

    function triggerSave() {
        STATUS.innerText = 'Syncing...';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const html = getEditorHtmlForStorage();
            const ok = persistCouriusDocument(html, 'autosave');
            if (ok) STATUS.innerText = 'Saved';
            updateSuggestions();
        }, 1000);
    }

    function formatWritingTimer(seconds) {
        const safeSeconds = Math.max(0, Math.floor(seconds));
        const mins = Math.floor(safeSeconds / 60);
        const secs = safeSeconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function getWritingTimerRemainingSeconds() {
        if (!writingTimerLastStart) return writingTimerDuration;
        return Math.max(0, writingTimerDuration - Math.floor((Date.now() - writingTimerLastStart) / 1000));
    }

    function renderWritingTimer() {
        const timer = document.getElementById('writing-timer');
        const button = document.getElementById('writing-timer-btn');
        if (!timer || !button) return;
        const remaining = getWritingTimerRemainingSeconds();
        timer.textContent = formatWritingTimer(remaining);
        button.style.opacity = writingTimerTriggered || writingTimerLastStart ? '1' : '0.75';
        button.classList.toggle('timer-armed', !!writingTimerLastStart && !writingTimerTriggered);
        button.classList.toggle('timer-running', !!writingTimerLastStart && !writingTimerTriggered);
        button.classList.toggle('timer-triggered', writingTimerTriggered);
    }

    function persistWritingTimer() {
        localStorage.setItem(WRITING_TIMER_KEY, JSON.stringify({
            duration: getWritingTimerRemainingSeconds(),
            isRunning: !!writingTimerLastStart,
            triggered: writingTimerTriggered,
            updatedAt: Date.now()
        }));
    }

    function startWritingTimer() {
        if (writingTimerLastStart || writingTimerDuration <= 0) return;
        writingTimerTriggered = false;
        writingTimerLastStart = Date.now();
        if (!writingTimerInterval) {
            writingTimerInterval = setInterval(tickWritingTimer, 250);
        }
        persistWritingTimer();
        renderWritingTimer();
    }

    function pauseWritingTimer() {
        if (!writingTimerLastStart) return;
        writingTimerDuration = getWritingTimerRemainingSeconds();
        writingTimerLastStart = null;
        persistWritingTimer();
        renderWritingTimer();
    }

    function triggerWritingAlarm() {
        writingTimerLastStart = null;
        writingTimerDuration = 0;
        writingTimerTriggered = true;
        persistWritingTimer();
        renderWritingTimer();
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                [0, 0.22, 0.44].forEach((offset, index) => {
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.value = index === 1 ? 880 : 660;
                    gain.gain.value = 0.0001;
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);
                    const startAt = ctx.currentTime + offset;
                    gain.gain.exponentialRampToValueAtTime(0.08, startAt + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.18);
                    oscillator.start(startAt);
                    oscillator.stop(startAt + 0.2);
                });
            }
        } catch (_) {}
        if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
        window.setTimeout(() => {
            if (document.visibilityState === 'visible') {
                window.alert('Courius alarm complete.');
            }
        }, 60);
    }

    function tickWritingTimer() {
        if (!writingTimerLastStart) {
            renderWritingTimer();
            return;
        }
        if (getWritingTimerRemainingSeconds() <= 0) {
            triggerWritingAlarm();
            return;
        }
        renderWritingTimer();
    }

    function loadWritingTimer() {
        try {
            const raw = localStorage.getItem(WRITING_TIMER_KEY);
            const parsed = raw ? JSON.parse(raw) : null;
            writingTimerDuration = Number.isFinite(parsed?.duration) ? Math.max(0, parsed.duration) : 25 * 60;
            writingTimerTriggered = !!parsed?.triggered;
            if (parsed?.isRunning && writingTimerDuration > 0) {
                writingTimerLastStart = Date.now();
            }
        } catch (_) {
            writingTimerDuration = 25 * 60;
            writingTimerTriggered = false;
        }
    }

    function updateSuggestions() {
        characterSet.clear();
        locationSet.clear();
        sceneLocationCoreSet.clear();
        sceneTimeSet = new Set(SCENE_TIME_HINTS);
        characterTurnPairs.clear();

        const blocks = Array.from(EDITOR.children || []);
        let previousCharacter = '';
        blocks.forEach((node) => {
            if (!node || !node.classList || node.classList.contains('title-page-container')) return;
            if (node.classList.contains('character')) {
                const name = getPureText(node).trim().toUpperCase();
                if (!name) return;
                characterSet.add(name);
                if (previousCharacter && previousCharacter !== name) {
                    const pairSet = characterTurnPairs.get(previousCharacter) || new Set();
                    pairSet.add(name);
                    characterTurnPairs.set(previousCharacter, pairSet);
                }
                previousCharacter = name;
                return;
            }
            if (node.classList.contains('scene-heading')) {
                const heading = normalizeSceneHeading(getPureText(node));
                if (!heading) return;
                locationSet.add(heading);
                const parts = parseSceneHeadingParts(heading);
                if (parts.location) sceneLocationCoreSet.add(parts.location);
                if (parts.time) sceneTimeSet.add(parts.time);
                previousCharacter = '';
                return;
            }
            if (node.classList.contains('action') || node.classList.contains('transition')) {
                previousCharacter = '';
            }
        });
    }

    function resetScript() {
        if (confirm("Reset current script?")) {
            EDITOR.innerHTML = '';
            createLine('scene-heading');
            triggerSave();
        }
    }

    function updatePageCount() {
        // Approximate: 11in page height = 1056px @ 96dpi
        const pageHeight = 1056; 
        const scrollTop = document.getElementById('editor-container').scrollTop;
        const pageNum = Math.floor(scrollTop / pageHeight) + 1;
        PAGE_COUNT.innerText = "Pg " + pageNum;
    }

    // --- FDX Import ---
    function importFDX(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(e.target.result, "text/xml");

            EDITOR.innerHTML = ''; // Clear existing

            const titlePageTypes = new Set(['Title', 'Credit', 'Author', 'Contact']);
            const ensureTitlePage = (titleText, authorText, contactText, creditText) => {
                const hasMeaningfulTitle = !!String(titleText || '').trim();
                const hasMeaningfulAuthor = !!String(authorText || '').trim();
                const hasMeaningfulContact = !!String(contactText || '').trim();
                const hasMeaningfulCredit = !!String(creditText || '').trim();
                if (!hasMeaningfulTitle && !hasMeaningfulAuthor && !hasMeaningfulContact && !hasMeaningfulCredit) return;

                const tp = document.createElement('div');
                tp.className = 'title-page-container';
                tp.contentEditable = "false";
                tp.innerHTML = `
                    <div class="tp-title" contenteditable="true" data-placeholder="TITLE">${escapeHtml(hasMeaningfulTitle ? titleText : 'TITLE')}</div>
                    <div class="tp-by">${escapeHtml(hasMeaningfulCredit ? creditText : 'by')}</div>
                    <div class="tp-author" contenteditable="true" data-placeholder="Author Name">${escapeHtml(hasMeaningfulAuthor ? authorText : 'Author Name')}</div>
                    <div class="tp-contact" contenteditable="true" data-placeholder="Contact Info">${escapeHtml(hasMeaningfulContact ? contactText : 'Contact Info')}</div>
                `;
                EDITOR.prepend(tp);
            };

            // Handle Title Page FIRST (must be prepended before content)
            const titlePage = xmlDoc.getElementsByTagName('TitlePage')[0];
            const allParagraphs = Array.from(xmlDoc.getElementsByTagName('Paragraph'));
            const skipParagraphs = new Set();
            let titleText = '';
            let authorText = '';
            let contactText = '';
            let creditText = '';

            if (titlePage) {
                const titleEl = titlePage.getElementsByTagName('Title')[0];
                const authorEl = titlePage.getElementsByTagName('Author')[0];
                const contactEl = titlePage.getElementsByTagName('Contact')[0];
                const creditEl = titlePage.getElementsByTagName('Credit')[0];

                titleText = titleEl ? titleEl.textContent : '';
                authorText = authorEl ? authorEl.textContent : '';
                contactText = contactEl ? contactEl.textContent : '';
                creditText = creditEl ? creditEl.textContent : '';

                Array.from(titlePage.getElementsByTagName('Paragraph')).forEach((paragraph) => {
                    skipParagraphs.add(paragraph);
                    const paraType = String(paragraph.getAttribute('Type') || '').trim();
                    const paraText = Array.from(paragraph.getElementsByTagName('Text')).map((node) => node.textContent || '').join('').trim();
                    if (!paraText) return;
                    if (paraType === 'Title' && !titleText) titleText = paraText;
                    else if (paraType === 'Author' && !authorText) authorText = paraText;
                    else if (paraType === 'Contact' && !contactText) contactText = paraText;
                    else if (paraType === 'Credit' && !creditText) creditText = paraText;
                });

            }

            // Some FDX files store title-page fields as normal content paragraphs.
            allParagraphs.forEach((paragraph) => {
                const paraType = String(paragraph.getAttribute('Type') || '').trim();
                if (!titlePageTypes.has(paraType)) return;
                const paraText = Array.from(paragraph.getElementsByTagName('Text')).map((node) => node.textContent || '').join('').trim();
                skipParagraphs.add(paragraph);
                if (!paraText) return;
                if (paraType === 'Title' && !titleText) titleText = paraText;
                else if (paraType === 'Author' && !authorText) authorText = paraText;
                else if (paraType === 'Contact' && !contactText) contactText = paraText;
                else if (paraType === 'Credit' && !creditText) creditText = paraText;
            });

            ensureTitlePage(titleText, authorText, contactText, creditText);

            // Handle Content paragraphs
            const paragraphs = allParagraphs;
            for (let i = 0; i < paragraphs.length; i++) {
                if (skipParagraphs.has(paragraphs[i])) continue;
                const fdxType = (paragraphs[i].getAttribute('Type') || '').trim();
                if (titlePageTypes.has(fdxType)) continue;
                let type = 'action';

                // Map FDX types to Courius types
                if (fdxType === 'Scene Heading') type = 'scene-heading';
                else if (fdxType === 'Character') type = 'character';
                else if (fdxType === 'Dialogue') type = 'dialogue';
                else if (fdxType === 'Parenthetical') type = 'parenthetical';
                else if (fdxType === 'Transition') type = 'transition';

                let text = '';
                const textNodes = paragraphs[i].getElementsByTagName('Text');
                for (let j = 0; j < textNodes.length; j++) {
                    text += textNodes[j].textContent;
                }

                const div = document.createElement('div');
                setBlockType(div, type);
                div.innerText = text || '\n'; // Preserve empty lines
                EDITOR.appendChild(div);
            }

            // Ensure something is there
            if (EDITOR.children.length === 0) createLine('scene-heading');

            triggerSave();
            updateSuggestions();
        };
        reader.readAsText(file);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function collectScriptElements() {
        return Array.from(EDITOR.children).map(function (div) {
            return { className: div.className || '', text: getPureText(div).trim() };
        });
    }
    function collectTitlePage() {
        var tp = EDITOR.querySelector('.title-page-container');
        if (!tp) return {};
        return {
            title: (tp.querySelector('.tp-title') && tp.querySelector('.tp-title').innerText) || '',
            author: (tp.querySelector('.tp-author') && tp.querySelector('.tp-author').innerText) || '',
            contact: (tp.querySelector('.tp-contact') && tp.querySelector('.tp-contact').innerText) || ''
        };
    }

    // --- FDX Export ---
    function downloadFDX() {
        var tp = collectTitlePage();
        var elements = WTScreenplay.extractElements(collectScriptElements());
        var xml = WTScreenplay.buildFdx({ title: tp.title, author: tp.author, elements: elements });
        var blob = new Blob([xml], { type: 'text/xml' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'script.fdx';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function downloadRTF() {
        var tp = collectTitlePage();
        var elements = WTScreenplay.extractElements(collectScriptElements());
        var rtf = WTScreenplay.buildRtf({ title: tp.title, author: tp.author, contact: tp.contact, elements: elements });
        var blob = new Blob([rtf], { type: 'application/rtf' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'script.rtf';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // --- Scene Navigator ---
    const SCENE_NAV = document.getElementById('scene-nav');
    const SCENE_NAV_LIST = document.getElementById('scene-nav-list');
    const SCENE_COUNT = document.getElementById('scene-count');

    function toggleSceneNav() {
        SCENE_NAV.classList.toggle('open');
        if (SCENE_NAV.classList.contains('open')) {
            updateSceneNav();
        }
    }

    function updateSceneNav() {
        const scenes = document.querySelectorAll('.scene-heading');
        SCENE_COUNT.innerText = scenes.length;
        SCENE_NAV_LIST.innerHTML = '';

        scenes.forEach((scene, index) => {
            const text = getPureText(scene).trim() || 'UNTITLED SCENE';
            const item = document.createElement('div');
            item.className = 'scene-nav-item';
            item.innerText = `${index + 1}. ${text.substring(0, 25)}${text.length > 25 ? '...' : ''}`;
            item.onclick = () => {
                scene.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // Set cursor
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(scene);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
                scene.focus();
            };
            SCENE_NAV_LIST.appendChild(item);
        });
    }

    // Update scene nav when content changes
    const originalTriggerSave = triggerSave;
    triggerSave = function() {
        originalTriggerSave();
        if (SCENE_NAV.classList.contains('open')) {
            updateSceneNav();
        }
    };

    document.getElementById('writing-timer-btn').addEventListener('click', () => {
        if (writingTimerLastStart) {
            pauseWritingTimer();
        } else if (writingTimerTriggered) {
            writingTimerTriggered = false;
            writingTimerDuration = writingTimerDuration > 0 ? writingTimerDuration : 25 * 60;
            persistWritingTimer();
            renderWritingTimer();
        } else {
            startWritingTimer();
        }
    });

    document.getElementById('writing-timer-btn').addEventListener('dblclick', () => {
        const current = getWritingTimerRemainingSeconds();
        const input = window.prompt('Set alarm minutes', String(Math.max(1, Math.floor(current / 60) || 25)));
        if (input === null) return;
        const minutes = Number(input);
        if (!Number.isFinite(minutes) || minutes < 0) return;
        writingTimerDuration = Math.round(minutes * 60);
        writingTimerLastStart = null;
        writingTimerTriggered = false;
        persistWritingTimer();
        renderWritingTimer();
    });

    // --- Help Modal ---
    function toggleHelp() {
        document.getElementById('help-modal').classList.toggle('open');
    }

    window.WTToolActions = {
        exportPrimary: downloadFDX
    };

    // --- Keyboard Shortcuts ---
    window.addEventListener('keydown', (e) => {
        // ? for help (when not typing in editor)
        if (e.key === '?' && document.activeElement !== EDITOR) {
            e.preventDefault();
            toggleHelp();
        }
        // Escape to close modals
        if (e.key === 'Escape') {
            document.getElementById('help-modal').classList.remove('open');
            SCENE_NAV.classList.remove('open');
        }
        // Ctrl+D for theme
        if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
            e.preventDefault();
            toggleTheme();
        }
        // Ctrl+N for scene navigator
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault();
            toggleSceneNav();
        }
    });

    window.addEventListener('beforeunload', () => {
        if (writingTimerInterval) clearInterval(writingTimerInterval);
        if (writingTimerLastStart) {
            writingTimerDuration = getWritingTimerRemainingSeconds();
            writingTimerLastStart = null;
        }
        persistWritingTimer();
    });
</script>
</body>
</html>
