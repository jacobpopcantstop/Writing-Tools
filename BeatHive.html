                                    <SpineLine cells={cells} theme={theme} />
                                </g>
                            </svg>
                            {/* Floating Status */}
                            <div className="absolute bottom-8 left-8 flex flex-col gap-2 pointer-events-none animate-in">
                                <div className={`px-5 py-3 rounded-full border text-[10px] font-black uppercase tracking-[0.2em] shadow-2xl ${theme === 'dark' ? 'bg-black/80 border-white/10 text-white/50' : 'bg-white/80 border-black/5 text-black/50'}`}>
                                    {selection.q !== null ? 'Node Selected' : 'Hive Ready'}
                                </div>
                                {mapStats.storyBeats < 1 && (
                                    <div className={`px-4 py-2 rounded-xl text-[10px] font-bold tracking-wider uppercase ${theme === 'dark' ? 'bg-black/70 border border-white/10 text-white/60' : 'bg-white/85 border border-black/10 text-black/60'}`}>
                                        Add a beat to start building
                                    </div>
                                )}
                                {mapStats.storyBeats >= 1 && (
                                    <div className={`px-4 py-2 rounded-xl text-[10px] font-bold tracking-wider uppercase ${theme === 'dark' ? 'bg-black/70 border border-white/10 text-white/60' : 'bg-white/85 border border-black/10 text-black/60'}`}>
                                        {mapStats.storyBeats} story beat{mapStats.storyBeats === 1 ? '' : 's'}
                                    </div>
                                )}
                            </div>

                            {/* Minimap */}
                            {cells.length > 0 && (
                                <div className="minimap" onClick={(e) => {
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const clickX = e.clientX - rect.left;
                                    const clickY = e.clientY - rect.top;

                                    const points = cells.map(c => ({
                                        q: c.q,
                                        r: c.r,
                                        x: c.q * HEX_WIDTH + (c.r % 2 === 0 ? 0 : HEX_WIDTH / 2),
                                        y: c.r * VERT_SPACING
                                    }));
                                    const minX = Math.min(...points.map(p => p.x)) - HEX_WIDTH;
                                    const maxX = Math.max(...points.map(p => p.x)) + HEX_WIDTH;
                                    const minY = Math.min(...points.map(p => p.y)) - HEX_HEIGHT;
                                    const maxY = Math.max(...points.map(p => p.y)) + HEX_HEIGHT;

                                    const worldX = minX + (clickX / 150) * (maxX - minX || 1);
                                    const worldY = minY + (clickY / 120) * (maxY - minY || 1);
                                    const snappedR = Math.round(worldY / VERT_SPACING);
                                    const snappedQ = Math.round((worldX - (snappedR % 2 === 0 ? 0 : HEX_WIDTH / 2)) / HEX_WIDTH);
                                    const snappedX = snappedQ * HEX_WIDTH + (snappedR % 2 === 0 ? 0 : HEX_WIDTH / 2);
                                    const snappedY = snappedR * VERT_SPACING;

                                    setPan({ x: -snappedX * zoom, y: -snappedY * zoom });
                                    panRef.current = { x: -snappedX * zoom, y: -snappedY * zoom };
                                }}>
                                    <svg width="150" height="120" style={{ display: 'block' }}>
                                        {(() => {
                                            const points = cells.map(c => ({
                                                q: c.q,
                                                r: c.r,
                                                x: c.q * HEX_WIDTH + (c.r % 2 === 0 ? 0 : HEX_WIDTH / 2),
                                                y: c.r * VERT_SPACING,
                                                type: c.type
                                            }));
                                            const minX = Math.min(...points.map(p => p.x)) - HEX_WIDTH;
                                            const maxX = Math.max(...points.map(p => p.x)) + HEX_WIDTH;
                                            const minY = Math.min(...points.map(p => p.y)) - HEX_HEIGHT;
                                            const maxY = Math.max(...points.map(p => p.y)) + HEX_HEIGHT;
                                            const rangeX = (maxX - minX) || 1;
                                            const rangeY = (maxY - minY) || 1;

                                            return points.map(p => {
                                                const nx = ((p.x - minX) / rangeX) * 146 + 2;
                                                const ny = ((p.y - minY) / rangeY) * 116 + 2;
                                                const typeData = BEAT_TYPES.find(t => t.id === p.type) || BEAT_TYPES[4];
                                                const fill = theme === 'dark' ? typeData.color.dark : typeData.color.light;
                                                return <circle key={`mm-${p.q}-${p.r}`} cx={nx} cy={ny} r={3.6} fill={fill} />;
                                            });
                                        })()}
                                    </svg>
                                </div>
                            )}
                            
                            {/* Quick Menu */}
                            {quickMenu && (
                                <div className="fixed z-[100] animate-in" style={{ left: quickMenu.x, top: quickMenu.y }}>
                                    <div className={`p-2 rounded-3xl shadow-2xl border w-64 ${theme === 'dark' ? 'bg-zinc-900 border-white/10' : 'bg-[#e6e0d4] border-[#432818]/10'}`}>
                                        <div className="px-4 py-3 text-[10px] font-black uppercase tracking-widest opacity-30">Select Archetype</div>
                                        {BEAT_TYPES.map(t => (
                                            <button key={t.id} onClick={(e) => { e.stopPropagation(); updateCell(quickMenu.q, quickMenu.r, { type: t.id }); setQuickMenu(null); }} className={`w-full text-left px-4 py-3 rounded-2xl text-xs font-bold transition-all flex items-center gap-3 ${theme === 'dark' ? 'hover:bg-white/5' : 'hover:bg-black/5'}`}>
                                                <div className="w-2 h-2 rounded-full ring-2 ring-offset-2 ring-offset-transparent" style={{ backgroundColor: theme === 'dark' ? t.color.dark : t.color.light, '--tw-ring-color': theme === 'dark' ? t.color.dark : t.color.light }}></div>
                                                {t.label}
                                            </button>
                                        ))}
                                        <div className={`border-t my-2 ${theme === 'dark' ? 'border-white/10' : 'border-black/10'}`}></div>
                                        <div className="px-4 py-2 text-[10px] font-black uppercase tracking-widest opacity-30">Story Tags</div>
                                        <div className="px-2 pb-2 flex flex-wrap gap-1">
                                            {STICKERS.map(s => {
                                                const existingCell = cells.find(c => c.q === quickMenu.q && c.r === quickMenu.r);
                                                const isActive = existingCell?.tags?.includes(s.id);
                                                return (
                                                    <button
                                                        key={s.id}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            const currentTags = existingCell?.tags || [];
                                                            const newTags = isActive
                                                                ? currentTags.filter(t => t !== s.id)
                                                                : [...currentTags, s.id];
                                                            updateCell(quickMenu.q, quickMenu.r, { tags: newTags });
                                                        }}
                                                        className={`p-2 rounded-xl transition-all ${isActive ? 'scale-110 shadow-lg' : 'opacity-40 hover:opacity-100'}`}
                                                        style={{ backgroundColor: isActive ? s.color + '30' : 'transparent' }}
                                                        title={s.label}
                                                    >
                                                        <Icon name={s.icon} size={16} style={{ color: s.color }} />
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Floating Editor */}
                            {selectedCell && !sidebarOpen && (
                                <div className="fixed z-50 bottom-16 left-1/2 -translate-x-1/2 w-full max-w-lg px-4 animate-in">
                                    <div className={`p-1 rounded-2xl shadow-2xl backdrop-blur-xl border ${theme === 'dark' ? 'bg-zinc-900/90 border-white/10' : 'bg-[#e6e0d4]/90 border-[#432818]/10'}`}>
                                        <div className="flex items-center justify-between px-4 py-2 border-b border-inherit opacity-50">
                                            <span className="text-[9px] font-black uppercase tracking-widest flex items-center gap-2">
                                                <div className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: theme === 'dark' ? (BEAT_TYPES.find(t => t.id === selectedCell.type) || BEAT_TYPES[4]).color.dark : (BEAT_TYPES.find(t => t.id === selectedCell.type) || BEAT_TYPES[4]).color.light }}></div>
                                                {(BEAT_TYPES.find(t => t.id === selectedCell.type) || BEAT_TYPES[4]).label}
                                            </span>
                                            <span className="text-[9px] font-black uppercase tracking-widest">Quick Edit (Enter to Exit)</span>
                                        </div>
                                        <div className="flex gap-1 px-3 py-2 border-b border-inherit">
                                            {STICKERS.map(s => {
                                                const isActive = selectedCell.tags?.includes(s.id);
                                                return (
                                                    <button
                                                        key={s.id}
                                                        onClick={() => {
                                                            const currentTags = selectedCell.tags || [];
                                                            const newTags = isActive
                                                                ? currentTags.filter(t => t !== s.id)
                                                                : [...currentTags, s.id];
                                                            updateCell(selection.q, selection.r, { tags: newTags });
                                                        }}
                                                        className={`p-1.5 rounded-lg transition-all ${isActive ? 'scale-110' : 'opacity-30 hover:opacity-100'}`}
                                                        style={{ backgroundColor: isActive ? s.color + '30' : 'transparent' }}
                                                        title={s.label}
                                                    >
                                                        <Icon name={s.icon} size={14} style={{ color: s.color }} />
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        <textarea
                                            className={`w-full bg-transparent p-4 resize-none outline-none text-sm font-medium leading-relaxed h-32 ${theme === 'dark' ? 'text-white placeholder-white/20' : 'text-[#432818] placeholder-[#432818]/40'}`}
                                            placeholder="Describe this beat..."
                                            value={selectedCell.content}
                                            onChange={(e) => updateCell(selection.q, selection.r, { content: e.target.value })}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    setSelection({ q: null, r: null });
                                                }
                                                if (e.key === 'Escape') {
                                                    e.preventDefault();
                                                    setSelection({ q: null, r: null });
                                                }
                                            }}
                                            autoFocus
                                        />
                                    </div>
                                </div>
                            )}
                        </div>

                        <aside className={`sidebar-panel border-l backdrop-blur-sm ${sidebarOpen ? 'w-[320px]' : 'w-0'}`}>
                            <div className="sidebar-inner p-8 space-y-8">
                                {selectedCell ? (
                                    <>
                                        <div className="space-y-4">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-[0.2em]">Archetype</label>
                                            <div className="flex flex-col gap-2">
                                                {BEAT_TYPES.map(t => (
                                                    <button key={t.id} onClick={() => updateCell(selection.q, selection.r, { type: t.id })} className={`w-full text-left px-4 py-3 rounded-xl text-[11px] font-bold transition-all border ${selectedCell.type === t.id ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg scale-[1.02]' : 'bg-current/5 border-transparent hover:bg-current/10'}`}>
                                                        {t.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-[0.2em]">Story Tags</label>
                                            <div className="flex flex-wrap gap-2">
                                                {STICKERS.map(s => {
                                                    const isActive = selectedCell.tags?.includes(s.id);
                                                    return (
                                                        <button
                                                            key={s.id}
                                                            onClick={() => {
                                                                const currentTags = selectedCell.tags || [];
                                                                const newTags = isActive
                                                                    ? currentTags.filter(t => t !== s.id)
                                                                    : [...currentTags, s.id];
                                                                updateCell(selection.q, selection.r, { tags: newTags });
                                                            }}
                                                            className={`flex items-center gap-2 px-3 py-2 rounded-lg text-[10px] font-bold transition-all border ${isActive ? 'border-current scale-105 shadow-lg' : 'border-transparent opacity-50 hover:opacity-100'}`}
                                                            style={{ backgroundColor: isActive ? s.color + '30' : 'transparent', borderColor: isActive ? s.color : 'transparent' }}
                                                        >
                                                            <Icon name={s.icon} size={14} style={{ color: s.color }} />
                                                            {s.label}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        <div className="flex-1 flex flex-col space-y-4">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-[0.2em]">Narrative Log</label>
                                            <textarea className={`flex-1 w-full p-5 rounded-2xl resize-none outline-none text-sm leading-relaxed transition-all shadow-inner ${theme === 'dark' ? 'bg-black/40 border border-white/5 focus:border-indigo-500/50' : 'bg-white border border-black/5 focus:border-indigo-500/50'}`}
                                                      value={selectedCell.content}
                                                      placeholder="Describe the moment..."
                                                      onChange={(e) => updateCell(selection.q, selection.r, { content: e.target.value })} />
                                        </div>
                                        <button onClick={() => {
                                            if (!selectedCell.content?.trim() || window.confirm('Delete this beat? This cannot be undone.')) {
                                                const next = cells.filter(c => !(c.q === selection.q && c.r === selection.r));
                                                setCells(next); save(next); setSelection({q:null, r:null});
                                            }
                                        }} className="w-full py-4 bg-red-500/10 text-red-500 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] hover:bg-red-500/20 transition-all">
                                            Purge Node
                                        </button>
                                        <button onClick={sendMapToCourius} className="w-full py-3 bg-indigo-600/15 text-indigo-500 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] hover:bg-indigo-600/25 transition-all">
                                            Send Map To Courius ({couriusMode === 'overwrite' ? 'Replace' : 'Append'})
                                        </button>
                                        <div className={`w-full p-1 rounded-xl border flex items-center gap-1 ${theme === 'dark' ? 'border-white/10 bg-black/30' : 'border-[#432818]/15 bg-white/70'}`}>
                                            <button
                                                onClick={() => setCouriusMode('append')}
                                                className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase tracking-[0.12em] transition-all ${couriusMode === 'append' ? 'bg-indigo-600 text-white shadow' : 'opacity-60 hover:opacity-100'}`}
                                            >
                                                Append
                                            </button>
                                            <button
                                                onClick={() => setCouriusMode('overwrite')}
                                                className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase tracking-[0.12em] transition-all ${couriusMode === 'overwrite' ? 'bg-rose-600 text-white shadow' : 'opacity-60 hover:opacity-100'}`}
                                            >
                                                Replace
                                            </button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-center opacity-30 space-y-6">
                                        <div className="p-6 rounded-full" style={{background: 'rgba(253, 25, 200, 0.08)'}}>
                                            <Icon name="mask" size={40} style={{color: '#fd19c8', opacity: 0.5}}/>
                                        </div>
                                        <div className="space-y-2 max-w-[220px]">
                                            <p className="text-xs font-black uppercase tracking-widest leading-loose">Click a hex to inspect</p>
                                            <p className="text-[10px] opacity-60 leading-relaxed normal-case tracking-normal">Double-click empty space to create new story beats</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </aside>
                    </main>

                    {showImmersionTips && (
                        <div className="absolute inset-0 z-[120] flex items-center justify-center p-6" style={{ background: theme === 'dark' ? 'rgba(0,0,0,0.65)' : 'rgba(26,26,26,0.45)' }}>
                            <div className={`w-full max-w-xl rounded-3xl border shadow-2xl p-7 md:p-8 ${theme === 'dark' ? 'bg-black/90 border-white/10' : 'bg-[#f5efe4]/95 border-[#432818]/15'}`}>
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center"><Icon name="zap" size={16} /></div>
                                    <h2 className="font-display text-xl">Ignite BeatHive</h2>
                                </div>
                                <p className="text-sm opacity-75 leading-relaxed mb-5">
                                    Build the spine fast, keep notes close to the action, and shape the map in whatever order helps you think.
                                </p>
                                <div className={`rounded-2xl p-4 mb-6 text-xs leading-relaxed ${theme === 'dark' ? 'bg-white/5' : 'bg-white/70'}`}>
                                    <div className="font-black uppercase tracking-[0.15em] mb-2 opacity-60">Suggested Start</div>
                                    1. Seed a few beats in the rough order you feel them.
                                    <br />
                                    2. Tag any twist, callback, or hidden info you want to track.
                                    <br />
                                    3. Branch sideways once the core path is visible.
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button
                                        onClick={() => { seedStarterArc(); dismissImmersionTips(); }}
                                        className="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs uppercase tracking-widest transition-all"
                                    >
                                        Start With Arc
                                    </button>
                                    <button
                                        onClick={dismissImmersionTips}
                                        className={`flex-1 py-3 px-4 rounded-xl border font-bold text-xs uppercase tracking-widest transition-all ${theme === 'dark' ? 'border-white/15 hover:bg-white/5' : 'border-[#432818]/20 hover:bg-black/5'}`}
                                    >
                                        Continue Current Map
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className={`h-12 px-8 flex items-center justify-between border-t border-inherit bg-current/5 text-[10px] font-bold opacity-40 uppercase tracking-widest`}>
                        <div className="flex gap-6">
                            <span className="flex items-center gap-2"><span className={`w-1.5 h-1.5 rounded-full animate-pulse ${user?.uid === 'local-user' ? 'bg-amber-500' : 'bg-emerald-500'}`}></span> {user?.uid === 'local-user' ? 'Local Storage' : 'Network Active'}</span>
                            <span className="flex items-center gap-2">
                                {cells.filter(c => c.type !== 'note').length > 0 && (
                                    <span style={{color: '#fd19c8', opacity: 0.8}}>{cells.filter(c => c.type !== 'note').length} beats</span>
                                )}
                            </span>
                            <span className={`transition-opacity duration-300 ${saveStatus === 'saved' ? 'opacity-100' : 'opacity-0'}`} style={{color: '#4ade80'}}>Saved</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-1 border border-current/20 rounded-md p-0.5">
                                <button onClick={() => setCouriusMode('append')} className={`px-2 py-1 rounded text-[9px] ${couriusMode === 'append' ? 'bg-indigo-600 text-white' : 'opacity-70 hover:opacity-100'}`}>Append</button>
                                <button onClick={() => setCouriusMode('overwrite')} className={`px-2 py-1 rounded text-[9px] ${couriusMode === 'overwrite' ? 'bg-rose-600 text-white' : 'opacity-70 hover:opacity-100'}`}>Replace</button>
                            </div>
                            <button onClick={sendMapToCourius} className="hover:opacity-100 transition-opacity">Send To Courius</button>
                            <a href="index.html" className="hover:opacity-100 transition-opacity" style={{textDecoration: 'none', color: 'inherit'}}>Writing Tools Suite</a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
