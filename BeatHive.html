<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BeatHive</title>
    <meta name="description" content="Build sketches rung by rung: a premise inbox feeding game ladders, sent to Courius as a script skeleton.">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2308080a%22/><path d=%22M32 14v72M68 14v72%22 stroke=%22%23fd19c8%22 stroke-width=%228%22 stroke-linecap=%22round%22/><path d=%22M32 72h36M32 50h36M32 28h36%22 stroke=%22%23fae84f%22 stroke-width=%227%22 stroke-linecap=%22round%22/></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="shared-polish.css">
    <script src="shared-toast.js"></script>
    <script src="shared-courius.js"></script>
    <script src="beathive-core.js"></script>
    <script src="shared-pwa.js"></script>
    <script src="shared-tool-manifest.js"></script>
    <script src="shared-recent-sessions.js"></script>
    <script src="shared-commands.js"></script>
    <script src="shared-command-palette.js"></script>
    <style>
        :root {
            --bg: #08080a;
            --panel: #111114;
            --panel-2: #18181c;
            --line: #26262c;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --faint: #6b6b74;
            --pink: #fd19c8;
            --gold: #fae84f;
            --danger: #f87171;
            --ok: #4ade80;
            --field: #0c0c0f;
            --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        [data-theme="light"] {
            --bg: #f5f3ef;
            --panel: #ffffff;
            --panel-2: #f0ede7;
            --line: #ddd8cf;
            --text: #16161a;
            --muted: #55555e;
            --faint: #8a8a94;
            --pink: #c8119d;
            --gold: #9a7d00;
            --danger: #b42318;
            --ok: #15803d;
            --field: #fbfaf8;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 var(--ui);
        }
        button, input, textarea, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

        /* --- Top bar --- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 20;
            height: 57px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(10px);
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
        .brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .brand-mark {
            width: 26px; height: 26px; border-radius: 7px;
            background: var(--panel-2); border: 1px solid var(--line);
            display: grid; place-items: center; flex: none;
        }
        .top-actions { display: flex; gap: 8px; align-items: center; }
        .home-link { color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap; }
        .home-link:hover { color: var(--text); }

        .btn {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: border-color .15s, background .15s;
        }
        .btn:hover { border-color: var(--faint); }
        .btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
        .btn.primary:hover { filter: brightness(1.08); }
        .btn.ghost { background: transparent; }
        .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .icon-btn {
            border: 1px solid transparent;
            background: transparent;
            border-radius: 6px;
            width: 28px; height: 28px;
            display: inline-grid; place-items: center;
            color: var(--muted);
            font-size: 14px;
        }
        .icon-btn:hover { color: var(--text); border-color: var(--line); background: var(--panel-2); }
        .icon-btn:disabled { opacity: .3; cursor: default; background: transparent; border-color: transparent; }

        /* --- Layout --- */
        .layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            min-height: calc(100dvh - 57px);
        }
        .inbox {
            border-right: 1px solid var(--line);
            padding: 18px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 57px;
            height: calc(100dvh - 57px);
            overflow: auto;
        }
        .section-label {
            font: 700 11px/1 var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .inbox-add textarea {
            width: 100%;
            resize: none;
            border: 1px solid var(--line);
            background: var(--field);
            border-radius: 10px;
            padding: 10px 12px;
            min-height: 44px;
            line-height: 1.4;
            overflow: hidden;
        }
        .inbox-add textarea:focus { border-color: var(--pink); outline: none; }
        .inbox-hint { color: var(--faint); font-size: 12px; margin: 4px 2px 0; }
        .inbox-list { display: flex; flex-direction: column; gap: 8px; }
        .premise {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: grab;
            transition: border-color .15s;
        }
        .premise:hover { border-color: var(--faint); }
        .premise.dragging { opacity: .45; }
        .premise-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .premise-detail { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
        .premise-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 8px; gap: 6px; }
        .source-badge {
            font: 700 10px/1 var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 4px 7px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
            white-space: nowrap;
        }
        .source-badge[data-source="Joterie"] { color: var(--pink); border-color: color-mix(in srgb, var(--pink) 45%, transparent); }
        .source-badge[data-source="Synax"] { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
        .source-badge[data-source="ThisButThat"] { color: #a78bfa; border-color: #a78bfa66; }
        .premise-actions { display: flex; gap: 4px; align-items: center; }
        .premise-actions .btn { padding: 4px 8px; font-size: 12px; white-space: nowrap; }
        .empty {
            color: var(--faint);
            font-size: 13px;
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        /* --- Main --- */
        .main { padding: 18px 28px 80px; min-width: 0; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
        .tab {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            max-width: 240px;
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }
        .tab .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tab .tab-progress { color: var(--faint); font: 600 11px var(--mono); flex: none; }
        .tab.active { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink) inset; }
        .tab.new { border-style: dashed; color: var(--muted); background: transparent; }
        .tab.drop-ok { border-color: var(--gold); color: var(--gold); }

        .ladder { max-width: 820px; }
        .ladder-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -.01em;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            padding: 2px 6px;
            margin-left: -7px;
            width: min(100%, 640px);
            text-overflow: ellipsis;
        }
        .ladder-name:hover { border-color: var(--line); }
        .ladder-name:focus { border-color: var(--pink); outline: none; }
        .premise-line textarea {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            padding: 4px 6px;
            margin: 2px 0 0 -7px;
            resize: none;
            color: var(--muted);
            font-size: 14px;
            overflow: hidden;
        }
        .premise-line textarea:hover { border-color: var(--line); }
        .premise-line textarea:focus { border-color: var(--pink); outline: none; color: var(--text); }

        .hints {
            margin: 14px 0 20px;
            border: 1px solid var(--line);
            border-left: 3px solid var(--gold);
            background: var(--panel);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }
        .hints.done { border-left-color: var(--ok); }
        .hints ul { margin: 0; padding-left: 18px; color: var(--muted); }
        .hints span { color: var(--muted); }
        .hints strong { display: block; font: 700 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }

        /* The ladder rail */
        .steps { position: relative; padding-left: 44px; }
        .steps::before {
            content: "";
            position: absolute;
            left: 15px; top: 14px; bottom: 14px;
            width: 2px;
            background: linear-gradient(to bottom, var(--line), color-mix(in srgb, var(--pink) 55%, var(--line)) 60%, var(--gold));
        }
        .step { position: relative; margin-bottom: 14px; }
        .step-dot {
            position: absolute;
            left: -44px; top: 10px;
            width: 32px; height: 32px;
            border-radius: 999px;
            background: var(--bg);
            border: 2px solid var(--line);
            display: grid; place-items: center;
            font: 700 12px var(--mono);
            color: var(--muted);
        }
        .step.filled .step-dot { border-color: var(--pink); color: var(--text); }
        .step.game .step-dot { border-color: var(--gold); color: var(--gold); }
        .card {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 12px;
            padding: 12px 14px;
            transition: border-color .15s, box-shadow .15s;
        }
        .step.game .card { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
        .card.drop-ok { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }
        .card-label { font: 700 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .step.game .card-label { color: var(--gold); }
        .card-prompt { color: var(--faint); font-size: 13px; margin: 2px 0 6px; }
        .field {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--field);
            border-radius: 8px;
            padding: 8px 10px;
            resize: none;
            line-height: 1.45;
            min-height: 40px;
            overflow: hidden;
            display: block;
        }
        .field:focus { outline: none; border-color: var(--pink); }
        .step.game .field { font-weight: 600; }

        .rungs { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .rung {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) auto;
            gap: 8px;
            align-items: start;
        }
        .rung-num {
            width: 30px; height: 30px; margin-top: 5px;
            border-radius: 8px;
            display: grid; place-items: center;
            font: 700 12px var(--mono);
            color: #0b0b0d;
            background: color-mix(in srgb, #fae84f var(--heat, 0%), #fd19c8);
        }
        .rung-tools { display: flex; gap: 2px; align-items: center; margin-top: 5px; }
        .tops {
            border: 1px solid var(--line);
            background: transparent;
            border-radius: 999px;
            padding: 3px 9px;
            font: 700 11px var(--mono);
            color: var(--faint);
            white-space: nowrap;
        }
        .tops[aria-pressed="true"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
        .tops.first { visibility: hidden; }
        .add-rung { margin-top: 10px; }
        .rung-summary { color: var(--faint); font-size: 12px; margin-top: 8px; }

        .ladder-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }
        .ladder-actions .spacer { flex: 1; }
        .mode-select {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 13px;
        }
        .notes-card { margin-top: 18px; }

        .welcome { max-width: 620px; padding-top: 32px; }
        .welcome h2 { font-size: 28px; margin: 0 0 8px; }
        .welcome p { color: var(--muted); }
        .welcome ol { color: var(--muted); padding-left: 20px; }
        .welcome li { margin: 4px 0; }
        .welcome b { color: var(--text); }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .inbox { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
            .main { padding: 16px 16px 80px; }
            .steps { padding-left: 38px; }
            .step-dot { left: -38px; width: 28px; height: 28px; }
            .steps::before { left: 13px; }
            .rung { grid-template-columns: 26px minmax(0, 1fr); }
            .rung-num { width: 26px; height: 26px; }
            .rung-tools { grid-column: 2; margin-top: 0; }
            .brand small, #restore-btn { display: none; }
            .ladder-name { font-size: 20px; }
            .topbar { padding: 12px 16px; }
        }
        @media print {
            .topbar, .inbox, .tabs, .ladder-actions, .hints, .rung-tools, .add-rung { display: none !important; }
            .layout { display: block; }
            body { background: #fff; color: #000; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 100 100"><path d="M32 10v80M68 10v80" stroke="#fd19c8" stroke-width="10" stroke-linecap="round"/><path d="M32 72h36M32 50h36M32 28h36" stroke="#fae84f" stroke-width="9" stroke-linecap="round"/></svg>
        </span>
        <h1>BeatHive</h1>
        <small>premise inbox → game ladder → Courius</small>
    </div>
    <div class="top-actions">
        <a class="home-link" href="index.html">Suite home</a>
        <button class="btn ghost" id="restore-btn" type="button" title="Restore the latest recovery snapshot">Restore</button>
        <button class="btn ghost" id="theme-btn" type="button" aria-label="Toggle theme">◐</button>
    </div>
</header>

<div class="layout">
    <aside class="inbox" aria-label="Premise inbox">
        <div class="section-label"><span>Premise inbox</span><span id="inbox-count">0</span></div>
        <div class="inbox-add">
            <textarea id="inbox-input" rows="1" aria-label="New premise" placeholder="Jot a premise and press Enter"></textarea>
            <p class="inbox-hint">Kept jots from Joterie, twists from ThisButThat, and Synax topics land here too. Drag a premise onto a step to use it.</p>
        </div>
        <div class="inbox-list" id="inbox-list"></div>
    </aside>

    <main class="main">
        <nav class="tabs" id="tabs" aria-label="Ladders"></nav>
        <section id="ladder-root"></section>
    </main>
</div>

<script>
(function () {
    'use strict';

    const BH = window.WTBeatHive;
    const STATE_KEY = 'writingtools_beathive_v2';
    const REV_KEY = 'writingtools_beathive_revision_v1';
    const SNAPSHOTS_KEY = 'writingtools_beathive_snapshots_v1';
    const HANDOFF_KEY = 'writingtools_beathive_handoff_v1';
    const MODE_KEY = 'writingtools_beathive_courius_mode';
    const LEGACY_STATE_KEY = 'writingtools_beathive_state_v1';
    const LEGACY_SKETCHES_KEY = 'writingtools_beathive_sketches';
    const TAB_ID = 'beathive-' + Math.random().toString(36).slice(2, 10);

    const STEPS = [
        { key: 'base', label: 'Base reality', prompt: 'Who are we with, where, and what does normal look like?' },
        { key: 'weird', label: 'First unusual thing', prompt: 'What happens that breaks the normal?' },
        { key: 'game', label: 'The game', prompt: 'One sentence: if this is true, what else is true?' },
        { key: 'rungs', label: 'Heightening', prompt: 'Each rung plays the same game, bigger. Mark the ones that top the last.' },
        { key: 'button', label: 'Button', prompt: 'How does it end? The biggest turn yet, or a snap back to normal.' }
    ];

    let state = BH.emptyState();
    let localRev = 0;
    let saveTimer = null;
    let draggingPremiseId = '';

    const $ = (id) => document.getElementById(id);
    const el = (tag, props, children) => {
        const node = document.createElement(tag);
        Object.entries(props || {}).forEach(([k, v]) => {
            if (k === 'class') node.className = v;
            else if (k === 'text') node.textContent = v;
            else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
            else if (v === true) node.setAttribute(k, '');
            else if (v !== false && v != null) node.setAttribute(k, v);
        });
        (children || []).forEach((c) => c && node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
        return node;
    };
    const notify = (msg, type) => {
        if (window.WTToast && typeof window.WTToast.notify === 'function') window.WTToast.notify(msg, type || 'info');
    };

    // ===== Persistence =====
    function readJson(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (_) {
            return fallback;
        }
    }

    function loadState() {
        const stored = readJson(STATE_KEY, null);
        if (stored) return BH.normalizeState(stored);
        // First run on v2: carry old hex maps over as ladders. The legacy
        // keys are left untouched in case anything needs recovering.
        const legacy = readJson(LEGACY_STATE_KEY, null);
        const sketches = legacy && Array.isArray(legacy.sketches) ? legacy.sketches : readJson(LEGACY_SKETCHES_KEY, []);
        const migrated = BH.normalizeState({ ladders: BH.migrateLegacySketches(sketches) });
        if (migrated.ladders.length) {
            const n = migrated.ladders.length;
            setTimeout(() => notify('Moved ' + n + ' old hex map' + (n === 1 ? '' : 's') + ' into ladders', 'success'), 400);
        }
        return migrated;
    }

    function saveSnapshot(reason) {
        try {
            const snaps = readJson(SNAPSHOTS_KEY, []);
            const list = Array.isArray(snaps) ? snaps : [];
            list.unshift({ id: 'bh_' + Date.now(), at: new Date().toISOString(), reason: reason, sourceTab: TAB_ID, payload: state });
            localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(list.slice(0, 20)));
        } catch (_) {}
    }

    function persistNow() {
        clearTimeout(saveTimer);
        saveTimer = null;
        try {
            const currentRev = parseInt(localStorage.getItem(REV_KEY) || '0', 10) || 0;
            const nextRev = Math.max(currentRev, localRev) + 1;
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
            localStorage.setItem(REV_KEY, String(nextRev));
            localRev = nextRev;
        } catch (_) {
            notify('Could not save (storage may be full)', 'error');
        }
    }

    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(persistNow, 350);
    }

    // Structural change: optional snapshot first, then save and re-render.
    function commit(snapshotReason) {
        if (snapshotReason) saveSnapshot(snapshotReason);
        persistNow();
        renderAll();
    }

    function ingestHandoffs() {
        const raw = readJson(HANDOFF_KEY, null);
        if (!raw) return;
        try { localStorage.removeItem(HANDOFF_KEY); } catch (_) {}
        const items = BH.handoffToInbox(raw);
        if (!items.length) return;
        state.inbox = items.concat(state.inbox);
        persistNow();
        renderInbox();
        const sources = Array.from(new Set(items.map((i) => i.source))).join(', ');
        notify(items.length + ' premise' + (items.length === 1 ? '' : 's') + ' from ' + sources + ' added to the inbox', 'success');
    }

    // ===== Helpers =====
    const activeLadder = () => state.ladders.find((l) => l.id === state.activeId) || null;

    function touch(ladder) {
        ladder.updatedAt = Date.now();
    }

    function autoGrow(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 2 + 'px';
    }

    function takePremise(id) {
        const idx = state.inbox.findIndex((p) => p.id === id);
        return idx >= 0 ? state.inbox.splice(idx, 1)[0] : null;
    }

    function startLadderFromPremise(id) {
        const premise = takePremise(id);
        if (!premise) return;
        const ladder = BH.newLadder({
            name: premise.text.split('\n')[0].slice(0, 60),
            premise: premise.detail && premise.text.toLowerCase().indexOf(premise.detail.toLowerCase()) === -1
                ? premise.text + '\n(' + premise.detail + ')'
                : premise.text,
            source: premise.source
        });
        state.ladders.unshift(ladder);
        state.activeId = ladder.id;
        commit('start-ladder');
        focusField('base');
    }

    function newBlankLadder() {
        const ladder = BH.newLadder({});
        state.ladders.unshift(ladder);
        state.activeId = ladder.id;
        commit();
        const name = document.querySelector('.ladder-name');
        if (name) { name.focus(); name.select(); }
    }

    // Drop a premise onto a step: fills an empty step or adds a line to it;
    // the heightening step gets a new rung.
    function dropPremiseOnStep(premiseId, stepKey) {
        const ladder = activeLadder();
        if (!ladder) return;
        const premise = state.inbox.find((p) => p.id === premiseId);
        if (!premise) return;
        if (stepKey === 'rungs') {
            if (ladder.rungs.length >= BH.MAX_RUNGS) return notify('That ladder is full', 'error');
            ladder.rungs.push({ id: BH.uid('rung'), text: premise.text, tops: false });
        } else {
            const current = String(ladder[stepKey] || '').trim();
            ladder[stepKey] = current ? current + '\n' + premise.text : premise.text;
        }
        takePremise(premiseId);
        touch(ladder);
        commit('use-premise');
    }

    // Rendering is synchronous, so focus right away: deferring it would drop
    // keystrokes typed immediately after Ctrl+Enter.
    function focusField(key, index) {
        const selector = key === 'rungs'
            ? '.rung[data-index="' + index + '"] textarea'
            : '[data-field="' + key + '"]';
        const node = document.querySelector(selector);
        if (node) {
            node.focus();
            node.setSelectionRange(node.value.length, node.value.length);
        }
    }

    function addRung(afterIndex) {
        const ladder = activeLadder();
        if (!ladder) return;
        if (ladder.rungs.length >= BH.MAX_RUNGS) return notify('That ladder is full', 'error');
        const at = typeof afterIndex === 'number' ? afterIndex + 1 : ladder.rungs.length;
        ladder.rungs.splice(at, 0, { id: BH.uid('rung'), text: '', tops: false });
        touch(ladder);
        commit();
        focusField('rungs', at);
    }

    function wireDropTarget(node, onDrop) {
        node.addEventListener('dragover', (e) => {
            if (!draggingPremiseId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            node.classList.add('drop-ok');
        });
        node.addEventListener('dragleave', (e) => {
            if (!node.contains(e.relatedTarget)) node.classList.remove('drop-ok');
        });
        node.addEventListener('drop', (e) => {
            node.classList.remove('drop-ok');
            const id = draggingPremiseId;
            if (!id) return;
            e.preventDefault();
            draggingPremiseId = '';
            onDrop(id);
        });
    }

    // ===== Rendering =====
    function renderInbox() {
        const list = $('inbox-list');
        list.innerHTML = '';
        $('inbox-count').textContent = String(state.inbox.length);
        if (!state.inbox.length) {
            list.appendChild(el('div', { class: 'empty', text: 'No premises yet. Jot one above, or send kept jots from Joterie.' }));
            return;
        }
        const ladder = activeLadder();
        state.inbox.forEach((p) => {
            const card = el('div', { class: 'premise', draggable: 'true', 'data-id': p.id }, [
                el('div', { class: 'premise-text', text: p.text }),
                p.detail ? el('div', { class: 'premise-detail', text: p.detail }) : null,
                el('div', { class: 'premise-meta' }, [
                    el('span', { class: 'source-badge', 'data-source': p.source, text: p.source }),
                    el('div', { class: 'premise-actions' }, [
                        el('button', { class: 'btn primary', type: 'button', title: 'Start a new ladder from this premise', onclick: () => startLadderFromPremise(p.id), text: 'Start ladder' }),
                        ladder ? el('button', { class: 'btn', type: 'button', title: 'Add as a heightening rung on "' + ladder.name + '"', onclick: () => dropPremiseOnStep(p.id, 'rungs'), text: '+ Rung' }) : null,
                        el('button', {
                            class: 'icon-btn', type: 'button', 'aria-label': 'Delete premise', title: 'Delete',
                            onclick: () => { takePremise(p.id); commit('delete-premise'); }
                        }, ['×'])
                    ])
                ])
            ]);
            card.addEventListener('dragstart', (e) => {
                draggingPremiseId = p.id;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'copy';
                e.dataTransfer.setData('text/plain', p.text);
            });
            card.addEventListener('dragend', () => {
                draggingPremiseId = '';
                card.classList.remove('dragging');
                document.querySelectorAll('.drop-ok').forEach((n) => n.classList.remove('drop-ok'));
            });
            list.appendChild(card);
        });
    }

    function renderTabs() {
        const tabs = $('tabs');
        tabs.innerHTML = '';
        state.ladders.forEach((l) => {
            const stats = BH.ladderStats(l);
            tabs.appendChild(el('button', {
                class: 'tab' + (l.id === state.activeId ? ' active' : ''),
                type: 'button',
                title: l.name,
                onclick: () => { state.activeId = l.id; commit(); }
            }, [
                el('span', { class: 'tab-name', text: l.name }),
                el('span', { class: 'tab-progress', text: stats.filled + '/' + stats.total })
            ]));
        });
        const add = el('button', { class: 'tab new', type: 'button', onclick: newBlankLadder, title: 'New ladder (or drop a premise here)' }, ['+ New ladder']);
        wireDropTarget(add, startLadderFromPremise);
        tabs.appendChild(add);
    }

    function renderHints(ladder) {
        const box = document.querySelector('.hints');
        if (!box) return;
        const hints = BH.ladderHints(ladder);
        box.innerHTML = '';
        box.classList.toggle('done', !hints.length);
        if (!hints.length) {
            box.appendChild(el('strong', { text: 'Ladder complete' }));
            box.appendChild(el('span', { text: 'Every step is filled and every rung tops the last. Send it to Courius and write the scene.' }));
            return;
        }
        box.appendChild(el('strong', { text: 'Next' }));
        box.appendChild(el('ul', {}, hints.map((h) => el('li', { text: h }))));
    }

    function rungSummary(ladder) {
        const stats = BH.ladderStats(ladder);
        if (!stats.rungs) return 'No rungs yet.';
        return stats.toppers + ' of ' + stats.rungs + ' escalate. Ctrl+Enter in a rung adds the next one.';
    }

    // Cheap updates while typing: hints, step dots, rung summary, tab label.
    function refreshLiveBits(ladder) {
        renderHints(ladder);
        document.querySelectorAll('.step[data-step]').forEach((node) => {
            const key = node.getAttribute('data-step');
            const filled = key === 'rungs' ? ladder.rungs.some((r) => r.text.trim()) : !!String(ladder[key] || '').trim();
            node.classList.toggle('filled', filled);
        });
        const summary = document.querySelector('.rung-summary');
        if (summary) summary.textContent = rungSummary(ladder);
        const activeTab = document.querySelector('.tab.active');
        if (activeTab) {
            const stats = BH.ladderStats(ladder);
            activeTab.querySelector('.tab-name').textContent = ladder.name;
            activeTab.querySelector('.tab-progress').textContent = stats.filled + '/' + stats.total;
        }
    }

    function textField(ladder, key, placeholder) {
        const ta = el('textarea', { class: 'field', rows: '1', 'data-field': key, placeholder: placeholder || '', 'aria-label': key });
        ta.value = ladder[key] || '';
        ta.addEventListener('input', () => {
            ladder[key] = ta.value;
            touch(ladder);
            autoGrow(ta);
            refreshLiveBits(ladder);
            scheduleSave();
        });
        return ta;
    }

    function renderRungs(ladder) {
        const wrap = el('div', { class: 'rungs' });
        const count = ladder.rungs.length;
        ladder.rungs.forEach((rung, i) => {
            // Rung chips heat from pink to gold as the ladder climbs.
            const heat = count > 1 ? Math.round((i / (count - 1)) * 100) : 0;
            const ta = el('textarea', {
                class: 'field', rows: '1', 'aria-label': 'Rung ' + (i + 1),
                placeholder: i === 0 ? 'The first time the game plays out' : 'Same game, bigger'
            });
            ta.value = rung.text;
            ta.addEventListener('input', () => {
                rung.text = ta.value;
                touch(ladder);
                autoGrow(ta);
                refreshLiveBits(ladder);
                scheduleSave();
            });
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    addRung(i);
                }
            });
            const move = (delta) => {
                const j = i + delta;
                if (j < 0 || j >= ladder.rungs.length) return;
                const [item] = ladder.rungs.splice(i, 1);
                ladder.rungs.splice(j, 0, item);
                touch(ladder);
                commit();
                focusField('rungs', j);
            };
            const topsBtn = el('button', {
                class: 'tops' + (i === 0 ? ' first' : ''),
                type: 'button',
                'aria-pressed': rung.tops ? 'true' : 'false',
                title: 'Does this rung top the one before it?',
                onclick: () => { rung.tops = !rung.tops; touch(ladder); commit(); }
            }, [rung.tops ? '▲ tops it' : 'tops it?']);
            wrap.appendChild(el('div', { class: 'rung', 'data-index': String(i) }, [
                el('span', { class: 'rung-num', style: '--heat:' + heat + '%', text: String(i + 1) }),
                ta,
                el('div', { class: 'rung-tools' }, [
                    topsBtn,
                    el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Move rung up', disabled: i === 0, onclick: () => move(-1) }, ['↑']),
                    el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Move rung down', disabled: i === count - 1, onclick: () => move(1) }, ['↓']),
                    el('button', {
                        class: 'icon-btn', type: 'button', 'aria-label': 'Delete rung',
                        onclick: () => {
                            if (rung.text.trim()) saveSnapshot('delete-rung');
                            ladder.rungs.splice(i, 1);
                            touch(ladder);
                            commit();
                        }
                    }, ['×'])
                ])
            ]));
        });
        return wrap;
    }

    function renderWelcome(root) {
        root.appendChild(el('div', { class: 'welcome' }, [
            el('h2', { text: 'Build a sketch rung by rung' }),
            el('p', { text: 'A sketch finds one funny pattern (the game) and plays it bigger each time. A ladder walks you through it:' }),
            el('ol', {}, [
                el('li', {}, [el('b', { text: 'Base reality' }), ': the normal world.']),
                el('li', {}, [el('b', { text: 'First unusual thing' }), ': what breaks it.']),
                el('li', {}, [el('b', { text: 'The game' }), ': if this is true, what else is true?']),
                el('li', {}, [el('b', { text: 'Heightening' }), ': each rung tops the last.']),
                el('li', {}, [el('b', { text: 'Button' }), ': the ending.'])
            ]),
            el('p', { text: 'Start from a premise in the inbox, or begin blank.' }),
            el('button', { class: 'btn primary', type: 'button', onclick: newBlankLadder, text: '+ New ladder' })
        ]));
    }

    function renderLadder() {
        const root = $('ladder-root');
        root.innerHTML = '';
        const ladder = activeLadder();
        if (!ladder) return renderWelcome(root);

        const name = el('input', { class: 'ladder-name', type: 'text', 'aria-label': 'Sketch name', maxlength: '80' });
        name.value = ladder.name;
        name.addEventListener('input', () => {
            ladder.name = name.value.trim() ? name.value : 'Untitled Sketch';
            touch(ladder);
            refreshLiveBits(ladder);
            scheduleSave();
        });

        const premise = el('textarea', { rows: '1', 'aria-label': 'Premise', placeholder: 'Premise (optional)' });
        premise.value = ladder.premise;
        premise.addEventListener('input', () => {
            ladder.premise = premise.value;
            touch(ladder);
            autoGrow(premise);
            scheduleSave();
        });

        const steps = el('div', { class: 'steps' });
        STEPS.forEach((step, idx) => {
            const card = el('div', { class: 'card' }, [
                el('div', { class: 'card-label', text: step.label }),
                el('div', { class: 'card-prompt', text: step.prompt })
            ]);
            if (step.key === 'rungs') {
                card.appendChild(renderRungs(ladder));
                card.appendChild(el('button', { class: 'btn add-rung', type: 'button', onclick: () => addRung(), text: '+ Add rung' }));
                card.appendChild(el('div', { class: 'rung-summary', text: rungSummary(ladder) }));
            } else {
                card.appendChild(textField(ladder, step.key, step.key === 'game' ? 'If this is true, then…' : ''));
            }
            wireDropTarget(card, (id) => dropPremiseOnStep(id, step.key));
            steps.appendChild(el('div', {
                class: 'step' + (step.key === 'game' ? ' game' : ''),
                'data-step': step.key
            }, [el('span', { class: 'step-dot', text: String(idx + 1) }), card]));
        });

        const modeSelect = el('select', { class: 'mode-select', 'aria-label': 'Courius destination' }, [
            el('option', { value: 'new', text: 'as a new script' }),
            el('option', { value: 'append', text: 'appended to the open script' })
        ]);
        modeSelect.value = localStorage.getItem(MODE_KEY) === 'append' ? 'append' : 'new';
        modeSelect.addEventListener('change', () => {
            try { localStorage.setItem(MODE_KEY, modeSelect.value); } catch (_) {}
        });

        const notes = el('div', { class: 'card notes-card' }, [
            el('div', { class: 'card-label', text: 'Notes' }),
            el('div', { class: 'card-prompt', text: 'Callbacks, alternate buttons, casting thoughts.' }),
            textField(ladder, 'notes', '')
        ]);

        root.appendChild(el('div', { class: 'ladder' }, [
            name,
            el('div', { class: 'premise-line' }, [premise]),
            el('div', { class: 'hints' }),
            steps,
            notes,
            el('div', { class: 'ladder-actions' }, [
                el('button', { class: 'btn primary', type: 'button', id: 'send-courius-btn', onclick: () => sendToCourius(modeSelect.value), text: 'Send to Courius' }),
                modeSelect,
                el('button', { class: 'btn', type: 'button', onclick: copyOutline, text: 'Copy outline' }),
                el('span', { class: 'spacer' }),
                el('button', { class: 'btn ghost', type: 'button', onclick: duplicateLadder, text: 'Duplicate' }),
                el('button', { class: 'btn ghost danger', type: 'button', onclick: deleteLadder, text: 'Delete' })
            ])
        ]));
        refreshLiveBits(ladder);
        requestAnimationFrame(() => root.querySelectorAll('textarea').forEach(autoGrow));
    }

    function renderAll() {
        renderTabs();
        renderInbox();
        renderLadder();
    }

    // ===== Actions =====
    function sendToCourius(mode) {
        const ladder = activeLadder();
        if (!ladder) return;
        if (!window.WTCourius) return notify('Courius handoff unavailable', 'error');
        persistNow();
        const html = BH.ladderToCouriusHtml(ladder);
        const ok = mode === 'append'
            ? window.WTCourius.append(html, 'BeatHive')
            : window.WTCourius.createScript(html, 'BeatHive', ladder.name);
        if (!ok) return notify('Courius transfer failed (storage may be full)', 'error');
        notify(mode === 'append' ? 'Appended to the open Courius script' : 'Sent to Courius as a new script', 'success');
        window.open('Courius.html', '_blank', 'noopener');
    }

    function copyOutline() {
        const ladder = activeLadder();
        if (!ladder) return;
        if (!navigator.clipboard || !navigator.clipboard.writeText) return notify('Clipboard unavailable', 'error');
        navigator.clipboard.writeText(BH.ladderToText(ladder))
            .then(() => notify('Outline copied', 'success'), () => notify('Copy failed', 'error'));
    }

    function duplicateLadder() {
        const ladder = activeLadder();
        if (!ladder) return;
        const copy = BH.newLadder(Object.assign(JSON.parse(JSON.stringify(ladder)), {
            id: '', name: ladder.name.slice(0, 70) + ' copy', createdAt: 0, updatedAt: 0
        }));
        copy.rungs.forEach((r) => { r.id = BH.uid('rung'); });
        state.ladders.splice(state.ladders.indexOf(ladder) + 1, 0, copy);
        state.activeId = copy.id;
        commit();
    }

    function deleteLadder() {
        const ladder = activeLadder();
        if (!ladder) return;
        if (!confirm('Delete "' + ladder.name + '"? A recovery snapshot is saved first.')) return;
        saveSnapshot('delete-ladder');
        const idx = state.ladders.indexOf(ladder);
        state.ladders.splice(idx, 1);
        const next = state.ladders[Math.min(idx, state.ladders.length - 1)];
        state.activeId = next ? next.id : '';
        commit();
    }

    function restoreLatestSnapshot() {
        const snaps = readJson(SNAPSHOTS_KEY, []);
        const latest = Array.isArray(snaps) ? snaps[0] : null;
        if (!latest || !latest.payload) return notify('No recovery snapshots yet', 'info');
        const when = latest.at ? new Date(latest.at).toLocaleString() : 'an earlier save';
        if (!confirm('Restore BeatHive to the snapshot from ' + when + '? Your current state is snapshotted first.')) return;
        const payload = latest.payload;
        // Snapshots from the old hex version hold { sketches }; migrate those.
        const next = Array.isArray(payload.sketches)
            ? BH.normalizeState({ ladders: BH.migrateLegacySketches(payload.sketches), inbox: state.inbox })
            : BH.normalizeState(payload);
        saveSnapshot('pre-restore');
        state = next;
        commit();
        notify('Snapshot restored', 'success');
    }

    function addInboxFromInput() {
        const input = $('inbox-input');
        const item = BH.newInboxItem({ text: input.value, source: 'You' });
        if (!item) return;
        state.inbox.unshift(item);
        input.value = '';
        autoGrow(input);
        persistNow();
        renderInbox();
    }

    // ===== Theme =====
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    }
    function toggleTheme() {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(next);
        try { localStorage.setItem('writingtools_theme', next); } catch (_) {}
    }

    // ===== Boot =====
    function init() {
        applyTheme(localStorage.getItem('writingtools_theme'));
        localRev = parseInt(localStorage.getItem(REV_KEY) || '0', 10) || 0;
        state = loadState();
        if (!localStorage.getItem(STATE_KEY)) persistNow();
        ingestHandoffs();
        renderAll();

        const input = $('inbox-input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addInboxFromInput();
            }
        });
        input.addEventListener('input', () => autoGrow(input));
        $('theme-btn').addEventListener('click', toggleTheme);
        $('restore-btn').addEventListener('click', restoreLatestSnapshot);

        window.addEventListener('storage', (e) => {
            if (!e) return;
            if (e.key === HANDOFF_KEY && e.newValue) return ingestHandoffs();
            if (e.key === 'writingtools_theme' && e.newValue) return applyTheme(e.newValue);
            if (e.key === REV_KEY) {
                const incoming = parseInt(e.newValue || '0', 10) || 0;
                if (incoming <= localRev) return;
                localRev = incoming;
                state = BH.normalizeState(readJson(STATE_KEY, {}));
                renderAll();
            }
        });
        // Text boxes size to their content, which changes with the width.
        let resizeFrame = 0;
        window.addEventListener('resize', () => {
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(() => document.querySelectorAll('textarea').forEach(autoGrow));
        });
        window.addEventListener('beforeunload', () => { if (saveTimer) persistNow(); });
        document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) persistNow(); });
    }

    window.WTToolActions = {
        exportPrimary: () => sendToCourius('new'),
        handoffPrimary: () => sendToCourius('new')
    };
    window.BeatHiveDebug = {
        getState: () => JSON.parse(JSON.stringify(state)),
        restoreLatestSnapshot: restoreLatestSnapshot,
        ingestHandoffs: ingestHandoffs
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
</body>
</html>
