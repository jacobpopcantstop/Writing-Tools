<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="shared-polish.css">
    <title>BeatHive - Story Structure Architect</title>
    <meta name="description" content="A hex-grid canvas for mapping story beats.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5' fill='%23fd19c8'/><polygon points='50,20 80,37.5 80,62.5 50,80 20,62.5 20,37.5' fill='%23da70d6' opacity='0.6'/></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="shared-toast.js"></script>
    <script src="shared-courius.js"></script>
    <script src="shared-pwa.js"></script>
    <script src="shared-tool-manifest.js"></script>
    <script src="shared-recent-sessions.js"></script>
    <script src="shared-commands.js"></script>
    <script src="shared-command-palette.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Grotesk:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        
        :root {
            --bg-dark: #000000;
            --bg-light: #f8f5f0;
            --panel-light: #e6e0d4;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --accent-pink: #fd19c8;
            --accent-purple: #da70d6;
            --accent-yellow: #fae84f;
            --sidebar-width: 320px;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            -webkit-text-size-adjust: 100%;
            transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Typography */
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-serif { font-family: 'Lora', serif; }

        /* Theme Classes */
        .light-theme {
            background-color: var(--bg-light) !important;
            color: var(--text-dark);
        }
        .dark-theme {
            background-color: #05020a !important;
            color: var(--text-light);
        }

        /* Smooth Sidebar Architecture */
        .sidebar-panel {
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .light-theme .sidebar-panel {
            border-color: rgba(253, 25, 200, 0.15);
            background: rgba(230, 224, 212, 0.95);
        }
        .dark-theme .sidebar-panel {
            border-color: rgba(253, 25, 200, 0.12);
            background: rgba(10, 10, 10, 0.95);
        }

        .sidebar-inner {
            min-width: var(--sidebar-width);
            width: var(--sidebar-width);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Hex & Grid */
        .hex-transition { transition: transform 0.1s linear, fill 0.2s ease; }
        .bg-grid-dark { background-image: radial-gradient(rgba(253, 25, 200, 0.08) 1.5px, transparent 1px); background-size: 40px 40px; }
        .bg-grid-light { background-image: radial-gradient(rgba(253, 25, 200, 0.1) 1.5px, transparent 1px); background-size: 40px 40px; }

        .hex-shadow {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            transform-origin: center center;
            transform-box: fill-box;
        }
        .hex-group:hover .hex-shadow {
            transform: scale(1.06);
            filter: drop-shadow(0 10px 20px rgba(253, 25, 200, 0.25)) drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        /* Prevent hover jitter by adding invisible hit area */
        .hex-group { isolation: isolate; }

        .tooltip { visibility: hidden; opacity: 0; transition: opacity 0.2s; position: absolute; z-index: 100; bottom: 120%; left: 50%; transform: translateX(-50%); pointer-events: none; }
        .group:hover .tooltip { visibility: visible; opacity: 1; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        textarea, input { user-select: text !important; -webkit-user-select: text !important; }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -4px; 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: currentColor;
            opacity: 0.2;
            border-radius: 2px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes selectedPulse {
            0%, 100% { stroke-opacity: 1; }
            50% { stroke-opacity: 0.5; }
        }
        .hex-selected-pulse { animation: selectedPulse 2s ease-in-out infinite; }

        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-left { animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-up { animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Empty hex hover hint */
        .hex-empty-hover { cursor: crosshair; }
        .hex-empty-hover:hover polygon { fill-opacity: 0.15 !important; }

        /* Minimap */
        .minimap {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 150px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            z-index: 50;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
        }
        .minimap:hover {
            opacity: 1;
            transform: scale(1.05);
        }
        .dark-theme .minimap { background: rgba(0,0,0,0.8); border: 1px solid rgba(253, 25, 200, 0.2); }
        .light-theme .minimap { background: rgba(26,26,26,0.9); border: 1px solid rgba(253, 25, 200, 0.15); }
        .minimap-viewport {
            position: absolute;
            border: 2px solid #fd19c8;
            border-radius: 3px;
            pointer-events: none;
        }

        @media print {
            body { background: white !important; }
            header, .sidebar-panel, .minimap { display: none !important; }
            main { overflow: visible !important; }
            svg { max-width: 100% !important; height: auto !important; }
        }

        @media (max-width: 1024px) {
            .minimap { display: none !important; }
            button, [role="button"], input[type="range"] { min-height: 44px; }
            input, textarea { font-size: 16px; }
        }
    </style>
</head>
<body class="dark-theme">
    <div id="root"></div>

    <script type="module">
        // The Firebase SDK is only needed in hosted environments that inject
        // __firebase_config. Everywhere else (GitHub Pages, local files, offline)
        // we skip the download entirely and BeatHive runs on localStorage.
        const embeddedConfig = typeof __firebase_config !== 'undefined' && __firebase_config;
        if (embeddedConfig) {
            try {
                const [appMod, authMod, storeMod] = await Promise.all([
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
                ]);
                window.FirebaseLib = {
                    initializeApp: appMod.initializeApp,
                    getAuth: authMod.getAuth,
                    signInAnonymously: authMod.signInAnonymously,
                    signInWithCustomToken: authMod.signInWithCustomToken,
                    onAuthStateChanged: authMod.onAuthStateChanged,
                    getFirestore: storeMod.getFirestore,
                    doc: storeMod.doc,
                    setDoc: storeMod.setDoc,
                    getDoc: storeMod.getDoc,
                    getDocs: storeMod.getDocs,
                    collection: storeMod.collection,
                    query: storeMod.query,
                    onSnapshot: storeMod.onSnapshot,
                    addDoc: storeMod.addDoc,
                    updateDoc: storeMod.updateDoc,
                    deleteDoc: storeMod.deleteDoc,
                    serverTimestamp: storeMod.serverTimestamp
                };
            } catch (_) {
                // SDK unreachable: the app falls back to local-storage mode.
            }
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const HEX_SIZE = 130; 
        const HEX_WIDTH = Math.sqrt(3) * HEX_SIZE;
        const HEX_HEIGHT = 2 * HEX_SIZE;
        const VERT_SPACING = HEX_HEIGHT * 0.75;
        const LOCAL_STORAGE_KEY = 'writingtools_beathive_sketches';
        const BEATHIVE_STATE_KEY = 'writingtools_beathive_state_v1';
        const BEATHIVE_REV_KEY = 'writingtools_beathive_revision_v1';
        const BEATHIVE_SNAPSHOTS_KEY = 'writingtools_beathive_snapshots_v1';
        const BEATHIVE_HANDOFF_KEY = 'writingtools_beathive_handoff_v1';
        const MAX_BEATHIVE_CELLS = 600;

        function normalizeBeatHiveCells(list) {
            if (!Array.isArray(list)) return [];
            return list
                .filter((item) => item && typeof item === 'object')
                .map((item) => {
                    const q = Number(item.q);
                    const r = Number(item.r);
                    if (!Number.isFinite(q) || !Number.isFinite(r)) return null;
                    return {
                        q: Math.round(q),
                        r: Math.round(r),
                        type: typeof item.type === 'string' && item.type.trim() ? item.type.trim() : 'note',
                        content: String(typeof item.content === 'string' ? item.content : (typeof item.text === 'string' ? item.text : '')),
                        tags: Array.isArray(item.tags) ? item.tags.slice(0, 8).map((tag) => String(tag || '').trim()).filter(Boolean) : []
                    };
                })
                .filter(Boolean)
                .slice(0, MAX_BEATHIVE_CELLS);
        }

        function normalizeBeatHiveSketches(list) {
            if (!Array.isArray(list)) return [];
            return list
                .filter((item) => item && typeof item === 'object' && item.id)
                .map((item) => ({
                    ...item,
                    id: String(item.id),
                    name: String(item.name || 'Untitled Hive'),
                    cells: normalizeBeatHiveCells(item.cells),
                    updatedAt: Number(item.updatedAt || Date.now())
                }));
        }

        function parseEmbeddedJson(rawValue) {
            if (!rawValue) return null;
            if (typeof rawValue === 'object') return rawValue;
            if (typeof rawValue !== 'string') return null;
            const trimmed = rawValue.trim();
            if (!trimmed) return null;
            try {
                return JSON.parse(trimmed);
            } catch (_) {
                return null;
            }
        }

        function readBeatHiveStateFromStorage() {
            try {
                const modernRaw = localStorage.getItem(BEATHIVE_STATE_KEY);
                if (modernRaw) {
                    const parsed = JSON.parse(modernRaw);
                    if (parsed && typeof parsed === 'object') {
                        return {
                            sketches: normalizeBeatHiveSketches(parsed.sketches),
                            couriusMode: parsed.couriusMode === 'overwrite' ? 'overwrite' : 'append',
                            immersiveSeen: !!parsed.immersiveSeen
                        };
                    }
                }
            } catch (_) {}
            try {
                return {
                    sketches: normalizeBeatHiveSketches(JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]')),
                    couriusMode: localStorage.getItem('writingtools_beathive_courius_mode') === 'overwrite' ? 'overwrite' : 'append',
                    immersiveSeen: !!localStorage.getItem('writingtools_beathive_immersive_seen')
                };
            } catch (_) {
                return { sketches: [], couriusMode: 'append', immersiveSeen: false };
            }
        }

        const Icon = ({ name, size = 20, className = "", style = {} }) => {
            const icons = {
                mask: <path d="M12 2a10 10 0 0 0-10 10c0 5.5 4.5 10 10 10s10-4.5 10-10A10 10 0 0 0 12 2zm-3 9a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm6 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-6 4s1.5 2 3 2 3-2 3-2"/>,
                plus: <path d="M12 5v14M5 12h14"/>,
                trash: (
                    <React.Fragment>
                        <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </React.Fragment>
                ),
                zoomIn: <g><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></g>,
                zoomOut: <g><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></g>,
                sun: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </React.Fragment>
                ),
                moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
                folder: <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>,
                chevronLeft: <polyline points="15 18 9 12 15 6" />,
                chevronRight: <polyline points="9 18 15 12 9 6" />,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                repeat: (
                    <React.Fragment>
                        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </React.Fragment>
                ),
                alert: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </React.Fragment>
                ),
                ghost: <path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>,
                eyeOff: (
                    <React.Fragment>
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </React.Fragment>
                ),
                more: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </React.Fragment>
                ),
                printer: (
                    <React.Fragment>
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </React.Fragment>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const STICKERS = [
            { id: 'game', icon: 'zap', color: '#eab308', label: 'The Game' },
            { id: 'callback', icon: 'repeat', color: '#3b82f6', label: 'Call-back' },
            { id: 'twist', icon: 'alert', color: '#ef4444', label: 'Subversion' },
            { id: 'weird', icon: 'ghost', color: '#a855f7', label: 'Weird Thing' },
            { id: 'secret', icon: 'eyeOff', color: '#6b7280', label: 'Hidden Info' },
        ];

        // Sticker icon component for use in tags
        const StickerIcon = ({ stickerId, size = 14, theme }) => {
            const sticker = STICKERS.find(s => s.id === stickerId);
            if (!sticker) return null;
            return <Icon name={sticker.icon} size={size} style={{ color: sticker.color }} />;
        };

        const BEAT_TYPES = [
            { id: 'setup', label: 'Normal World', color: { dark: '#1e40af', light: '#4361ee' }, stroke: { dark: '#60a5fa', light: '#2563eb' } },
            { id: 'inciting', label: 'First Weird Thing', color: { dark: '#7e22ce', light: '#7209b7' }, stroke: { dark: '#c084fc', light: '#9333ea' } },
            { id: 'heightening', label: 'Heightening', color: { dark: '#166534', light: '#bbf7d0' }, stroke: { dark: '#4ade80', light: '#16a34a' } },
            { id: 'blowoff', label: 'Ending', color: { dark: '#991b1b', light: '#fca5a5' }, stroke: { dark: '#f87171', light: '#dc2626' } },
            { id: 'note', label: 'Context / Note', color: { dark: '#334155', light: '#6c757d' }, stroke: { dark: '#94a3b8', light: '#9ca3af' } },
        ];

        // --- NEW INTEGRATED GUIDE IN MAP HEXES ---
        const WELCOME_CELLS = [
            { q: 0, r: 0, type: 'setup', content: "WELCOME TO BEATHIVE\n\nThis is your infinite narrative canvas. Beats persist automatically.", tags: ['zap'] },
            { q: 0, r: 1, type: 'inciting', content: "NAVIGATION\n\n• WASD to Pan\n• Scroll to Zoom\n• Drag background to slide", tags: [] },
            { q: 0, r: 2, type: 'heightening', content: "CONSTRUCTION\n\n• Double-click empty space to add beats\n• Drag hexes to move/swap them", tags: ['callback'] },
            { q: 1, r: 0, type: 'note', content: "EDITING\n\n• Click a beat to open the inspector\n• Use the floating bar for quick edits", tags: [] },
            { q: 1, r: 1, type: 'blowoff', content: "WORKFLOW\n\n• Top-Left: Map Library\n• Top-Right: Focus Mode & Theme", tags: ['twist'] }
        ];

        const HexCell = ({ q, r, data, isSelected, theme, zoom, onMouseDown, onDoubleClick }) => {
            const { x, y } = useMemo(() => ({
                x: q * HEX_WIDTH + (r % 2 === 0 ? 0 : HEX_WIDTH / 2),
                y: r * VERT_SPACING
            }), [q, r]);

            const typeData = BEAT_TYPES.find(t => t.id === (data?.type || 'note')) || BEAT_TYPES[4];
            const fill = theme === 'dark' ? typeData.color.dark : typeData.color.light;
            const opacity = data ? 1 : (isSelected ? 0.3 : 0.05);
            const stroke = isSelected
                ? '#fd19c8'
                : (data ? (theme === 'dark' ? typeData.stroke.dark : 'rgba(67, 40, 24, 0.15)')
                : (theme === 'dark' ? 'rgba(255,255,255,0.05)' : 'rgba(67, 40, 24, 0.08)'));
            
            const points = useMemo(() => [30, 90, 150, 210, 270, 330].map(a => {
                const rad = (Math.PI / 180) * a;
                return `${x + (HEX_SIZE - 2) * Math.cos(rad)},${y + (HEX_SIZE - 2) * Math.sin(rad)}`;
            }).join(' '), [x, y]);

            const isFarZoom = zoom < 0.5;
            // Scale text inversely with zoom to maintain readability when zoomed out
            const baseSize = isFarZoom ? 22 : 14;
            const scaledFontSize = baseSize / Math.max(0.25, zoom);
            const titleFontSize = Math.min(80, Math.max(18, scaledFontSize));

            return (
                <g 
                    onMouseDown={(e) => onMouseDown(e, q, r)} 
                    onDoubleClick={(e) => { e.preventDefault(); onDoubleClick(e, q, r); }}
                    className="cursor-pointer hex-group select-none"
                >
                    <polygon 
                        points={points} 
                        className="hex-shadow hex-transition"
                        fill={data ? fill : 'transparent'} 
                        fillOpacity={opacity} 
                        stroke={stroke} 
                        strokeWidth={isSelected ? 6 : (data ? 3 : 2)} 
                    />
                    
                    {/* Tags with icons on the hex edge */}
                    {data?.tags?.length > 0 && !isFarZoom && (
                        <g>
                            {data.tags.map((tagId, idx) => {
                                const s = STICKERS.find(st => st.id === tagId);
                                if (!s) return null;
                                // Position tags along the top-right edge of the hex
                                const angle = (-30 + idx * 30) * (Math.PI / 180);
                                const tagX = x + (HEX_SIZE - 12) * Math.cos(angle);
                                const tagY = y + (HEX_SIZE - 12) * Math.sin(angle);
                                return (
                                    <g key={tagId}>
                                        <circle
                                            cx={tagX}
                                            cy={tagY}
                                            r="14"
                                            fill={theme === 'dark' ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.95)'}
                                            stroke={s.color}
                                            strokeWidth="2"
                                            style={{ filter: 'drop-shadow(0 2px 6px rgba(0,0,0,0.4))' }}
                                        />
                                        <foreignObject x={tagX - 8} y={tagY - 8} width="16" height="16" style={{ pointerEvents: 'none' }}>
                                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%' }}>
                                                <Icon name={s.icon} size={12} style={{ color: s.color }} />
                                            </div>
                                        </foreignObject>
                                    </g>
                                );
                            })}
                        </g>
                    )}

                    {data && (
                        <foreignObject x={x - HEX_WIDTH/2 + 20} y={y - HEX_SIZE + 50} width={HEX_WIDTH - 40} height={HEX_HEIGHT - 100} style={{ pointerEvents: 'none' }}>
                            <div className="w-full h-full flex flex-col items-center justify-center text-center overflow-hidden p-2">
                                {isFarZoom ? (
                                    <h1 className={`font-display font-black leading-tight uppercase tracking-tighter ${theme === 'dark' ? 'text-white' : 'text-[#432818]'}`} 
                                        style={{ 
                                            fontSize: `${titleFontSize}px`, 
                                            textShadow: '0 2px 10px rgba(0,0,0,0.2)',
                                            maxWidth: '100%',
                                            overflow: 'hidden',
                                            textOverflow: 'ellipsis',
                                            display: '-webkit-box',
                                            WebkitLineClamp: 2,
                                            WebkitBoxOrient: 'vertical'
                                        }}>
                                        {data.content.split('\n')[0]}
                                    </h1>
                                ) : (
                                    <span className={`text-[13px] leading-snug line-clamp-5 ${theme === 'dark' ? 'text-gray-100 font-bold' : 'text-gray-800 font-bold'}`}>
                                        {data.content}
                                    </span>
                                )}
                            </div>
                        </foreignObject>
                    )}
                </g>
            );
        };

        const SpineLine = ({ cells, theme }) => {
            const sorted = cells.filter(c => c.type !== 'note').sort((a,b) => a.r - b.r);
            if (sorted.length < 2) return null;

            const pathD = sorted.map((c, i) => {
                // Throughline should pass through the actual center of each adjacent hex.
                const x = c.q * HEX_WIDTH + (c.r % 2 === 0 ? 0 : HEX_WIDTH / 2);
                const y = c.r * VERT_SPACING;
                return (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
            }).join(' ');

            return (
                <path 
                    d={pathD} 
                    fill="none" 
                    stroke={theme === 'dark' ? '#6366f1' : '#432818'} 
                    strokeWidth="12" 
                    strokeLinecap="round" 
                    strokeLinejoin="round"
                    strokeOpacity="0.4"
                    style={{ pointerEvents: 'none' }}
                />
            );
        };

        function App() {
            // State
            const [user, setUser] = useState(null);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [sketches, setSketches] = useState([]);
            const [currentId, setCurrentId] = useState(null);
            const [cells, setCells] = useState([]);
            const [sketchName, setSketchName] = useState("");
            
            const [theme, setTheme] = useState(() => localStorage.getItem('writingtools_theme') || 'dark');
            const [selection, setSelection] = useState({ q: null, r: null });
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [zoom, setZoom] = useState(1.0);
            
            const [dragState, setDragState] = useState({ active: false, startQ: null, startR: null, dropTarget: null });
            const [quickMenu, setQuickMenu] = useState(null);
            const [libOpen, setLibOpen] = useState(true);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [isCreating, setIsCreating] = useState(false);
            const [saveStatus, setSaveStatus] = useState('ready');
            const [showImmersionTips, setShowImmersionTips] = useState(() => !readBeatHiveStateFromStorage().immersiveSeen);
            const [couriusMode, setCouriusMode] = useState(() => readBeatHiveStateFromStorage().couriusMode);

            // Refs
            const keysPressed = useRef({});
            const panRef = useRef({ x: 0, y: 0 });
            const dragOrigin = useRef({ x: 0, y: 0 });
            const requestRef = useRef();
            const saveTimeoutRef = useRef(null);
            const cellsRef = useRef([]);
            const nameRef = useRef("");
            const currentIdRef = useRef(null);
            const sketchesRef = useRef([]);
            const localRevisionRef = useRef(0);
            const beatHiveTabIdRef = useRef('beathive-' + Math.random().toString(36).slice(2, 10));
            const canvasRef = useRef(null);
            const svgRef = useRef(null);
            const [dimensions, setDimensions] = useState({ w: window.innerWidth, h: window.innerHeight });
            const firebase = useRef({
                auth: null,
                db: null,
                appId: (typeof __app_id === 'string' && __app_id.trim()) ? __app_id.trim() : 'beathive-v5'
            });

            useEffect(() => { cellsRef.current = cells; }, [cells]);
            useEffect(() => { nameRef.current = sketchName; }, [sketchName]);
            useEffect(() => { currentIdRef.current = currentId; }, [currentId]);
            useEffect(() => { sketchesRef.current = sketches; }, [sketches]);
            useEffect(() => {
                document.body.className = theme === 'dark' ? 'dark-theme' : 'light-theme';
                localStorage.setItem('writingtools_theme', theme);
            }, [theme]);
            const getLocalPersistedState = useCallback((override = {}) => ({
                sketches: normalizeBeatHiveSketches(override.sketches || sketchesRef.current),
                couriusMode: override.couriusMode || couriusMode,
                immersiveSeen: typeof override.immersiveSeen === 'boolean' ? override.immersiveSeen : !showImmersionTips
            }), [couriusMode, showImmersionTips]);
            const localStateComparable = useCallback((payload) => {
                try { return JSON.stringify(getLocalPersistedState(payload)); } catch (_) { return ''; }
            }, [getLocalPersistedState]);
            const saveLocalSnapshot = useCallback((payload, reason, meta) => {
                try {
                    const raw = localStorage.getItem(BEATHIVE_SNAPSHOTS_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    const snapshots = Array.isArray(parsed) ? parsed : [];
                    snapshots.unshift({
                        id: 'snap_' + Date.now() + '_' + Math.floor(Math.random() * 100000),
                        at: new Date().toISOString(),
                        reason: String(reason || 'autosave'),
                        sourceTab: beatHiveTabIdRef.current,
                        meta: meta && typeof meta === 'object' ? meta : {},
                        payload: getLocalPersistedState(payload)
                    });
                    localStorage.setItem(BEATHIVE_SNAPSHOTS_KEY, JSON.stringify(snapshots.slice(0, 20)));
                } catch (_) {}
            }, [getLocalPersistedState]);
            const getLocalSnapshots = useCallback(() => {
                try {
                    const raw = localStorage.getItem(BEATHIVE_SNAPSHOTS_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (_) {
                    return [];
                }
            }, []);
            const persistLocalState = useCallback((override, reason = 'autosave') => {
                const candidate = getLocalPersistedState(override || {});
                const remoteRev = parseInt(localStorage.getItem(BEATHIVE_REV_KEY) || '0', 10) || 0;
                const remoteState = readBeatHiveStateFromStorage();
                if (
                    remoteRev > localRevisionRef.current &&
                    localStateComparable(remoteState) !== localStateComparable(candidate)
                ) {
                    saveLocalSnapshot(candidate, 'save-conflict', {
                        reason: String(reason || 'autosave'),
                        baseRevision: localRevisionRef.current,
                        remoteRevision: remoteRev
                    });
                    return false;
                }
                const nextRev = Math.max(remoteRev, localRevisionRef.current) + 1;
                localStorage.setItem(BEATHIVE_STATE_KEY, JSON.stringify(candidate));
                localStorage.setItem(BEATHIVE_REV_KEY, String(nextRev));
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(candidate.sketches));
                localStorage.setItem('writingtools_beathive_courius_mode', candidate.couriusMode);
                if (candidate.immersiveSeen) localStorage.setItem('writingtools_beathive_immersive_seen', '1');
                else localStorage.removeItem('writingtools_beathive_immersive_seen');
                localRevisionRef.current = nextRev;
                return true;
            }, [getLocalPersistedState, localStateComparable, saveLocalSnapshot]);
            const applyRemoteLocalState = useCallback((payload) => {
                const normalized = getLocalPersistedState(payload || {});
                setSketches(normalized.sketches);
                setCouriusMode(normalized.couriusMode);
                setShowImmersionTips(!normalized.immersiveSeen);
                const active = normalized.sketches.find((item) => item.id === currentIdRef.current) || normalized.sketches[0];
                if (active) {
                    setCurrentId(active.id);
                    setCells(active.cells || []);
                    setSketchName(active.name || '');
                } else {
                    setCurrentId(null);
                    setCells([]);
                    setSketchName('');
                }
            }, [getLocalPersistedState]);

            useEffect(() => {
                if (user?.uid !== 'local-user') return;
                persistLocalState({ couriusMode }, 'courius-mode');
            }, [couriusMode, persistLocalState, user]);
            useEffect(() => {
                if (user?.uid !== 'local-user') return;
                persistLocalState({ immersiveSeen: !showImmersionTips }, 'immersion-tip');
            }, [showImmersionTips, persistLocalState, user]);

            const restoreLatestBeatHiveSnapshot = useCallback(() => {
                const latest = getLocalSnapshots()[0];
                if (!latest || !latest.payload) return;
                if (!window.confirm('Restore the latest BeatHive snapshot and replace local map state?')) return;
                saveLocalSnapshot(getLocalPersistedState(), 'manual-restore-backup', { snapshotId: latest.id });
                applyRemoteLocalState(latest.payload);
                persistLocalState(latest.payload, 'snapshot-restore');
            }, [applyRemoteLocalState, getLocalPersistedState, getLocalSnapshots, persistLocalState, saveLocalSnapshot]);

            const clearBeatHiveSnapshots = useCallback(() => {
                if (!window.confirm('Clear all BeatHive recovery snapshots?')) return;
                try { localStorage.removeItem(BEATHIVE_SNAPSHOTS_KEY); } catch (_) {}
                setSketches((current) => [...current]);
            }, []);

            const loadLocalSketches = () => readBeatHiveStateFromStorage().sketches;
            const saveLocalSketches = (list) => {
                const normalized = normalizeBeatHiveSketches(list);
                setSketches(normalized);
                persistLocalState({ sketches: normalized }, 'sketch-save');
            };

            useEffect(() => {
                localRevisionRef.current = parseInt(localStorage.getItem(BEATHIVE_REV_KEY) || '0', 10) || 0;
                const handleResize = () => setDimensions({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', handleResize);

                // Hotkey Zoom Handlers
                const handleZoomKeys = (e) => {
                    if (['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) return;
                    if (e.key === '=' || e.key === '+') {
                        setZoom(z => Math.min(3.0, z + 0.1));
                    } else if (e.key === '-') {
                        setZoom(z => Math.max(0.1, z - 0.1));
                    } else if (e.key === '0') {
                        setZoom(1.0);
                        setPan({x:0, y:0});
                    }
                };
                window.addEventListener('keydown', handleZoomKeys);

                const container = canvasRef.current;
                const handleWheel = (e) => {
                    e.preventDefault();
                    if (e.ctrlKey || e.metaKey) {
                        const delta = -e.deltaY * 0.002; 
                        setZoom(z => Math.min(Math.max(0.1, z + delta), 3.0));
                    } else {
                        setPan(p => ({ x: p.x - e.deltaX, y: p.y - e.deltaY }));
                    }
                };

                if (container) container.addEventListener('wheel', handleWheel, { passive: false });
                
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, getDocs, collection, addDoc, serverTimestamp } = window.FirebaseLib || {};
                const config = parseEmbeddedJson(typeof __firebase_config !== 'undefined' ? __firebase_config : null);

                if (config && window.FirebaseLib) {
                    const app = initializeApp(config);
                    firebase.current.auth = getAuth(app);
                    firebase.current.db = getFirestore(app);

                    const initAuthAndSeed = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(firebase.current.auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(firebase.current.auth);
                            }
                        } catch (e) {
                            console.error("Auth", e);
                            setUser({ uid: 'guest-' + Math.random().toString(36).substr(2, 9) }); 
                        }
                    };

                    initAuthAndSeed();
                    
                    const unsub = onAuthStateChanged(firebase.current.auth, async (u) => {
                        if (u) {
                            setUser(u);
                            const sketchesCol = collection(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches');
                            const snap = await getDocs(sketchesCol);
                            if (snap.empty) {
                                await addDoc(sketchesCol, {
                                    name: "Welcome Map",
                                    cells: WELCOME_CELLS,
                                    owner: u.uid,
                                    createdAt: serverTimestamp(),
                                    updatedAt: serverTimestamp()
                                });
                            }
                            setIsInitialLoading(false);
                        }
                    });
                    return () => { 
                        unsub(); 
                        window.removeEventListener('resize', handleResize);
                        window.removeEventListener('keydown', handleZoomKeys);
                        if (container) container.removeEventListener('wheel', handleWheel);
                    };
                } else {
                    setUser({ uid: 'local-user' });
                    const localData = loadLocalSketches();
                    if (localData.length === 0) {
                        const newMap = { id: 'local-1', name: "Local Demo Map", cells: WELCOME_CELLS, updatedAt: Date.now() };
                        saveLocalSketches([newMap]);
                        setSketches([newMap]);
                        setCurrentId('local-1');
                        setCells(WELCOME_CELLS);
                        setSketchName("Local Demo Map");
                    } else {
                        setSketches(localData);
                        setCurrentId(localData[0].id);
                        setCells(localData[0].cells);
                        setSketchName(localData[0].name);
                    }
                    setIsInitialLoading(false);
                    return () => {
                        window.removeEventListener('resize', handleResize);
                        window.removeEventListener('keydown', handleZoomKeys);
                        if (container) container.removeEventListener('wheel', handleWheel);
                    };
                }
            }, []);

            useEffect(() => {
                if (user?.uid !== 'local-user') return;
                const onStorage = (event) => {
                    if (!event || event.key !== BEATHIVE_REV_KEY) return;
                    const incomingRev = parseInt(event.newValue || '0', 10) || 0;
                    if (incomingRev <= localRevisionRef.current) return;
                    const remote = readBeatHiveStateFromStorage();
                    const local = getLocalPersistedState();
                    if (localStateComparable(remote) !== localStateComparable(local)) {
                        saveLocalSnapshot(local, 'remote-sync', {
                            previousRevision: localRevisionRef.current,
                            incomingRevision: incomingRev
                        });
                        applyRemoteLocalState(remote);
                    }
                    localRevisionRef.current = incomingRev;
                };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, [applyRemoteLocalState, getLocalPersistedState, localStateComparable, saveLocalSnapshot, user]);

            useEffect(() => {
                if (user?.uid !== 'local-user' && firebase.current.db && !isInitialLoading) {
                    const { collection, query, onSnapshot } = window.FirebaseLib;
                    const q = query(collection(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches'));
                    return onSnapshot(q, (snap) => {
                        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setSketches(list);
                        if (list.length > 0 && !currentIdRef.current && !isCreating) {
                            setCurrentId(list[0].id);
                        }
                    });
                }
            }, [user, isInitialLoading, isCreating]);

            useEffect(() => {
                if (user?.uid !== 'local-user' && currentId && firebase.current.db) {
                    const { doc, onSnapshot } = window.FirebaseLib;
                    const docRef = doc(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches', currentId);
                    return onSnapshot(docRef, (snap) => {
                        if (snap.exists()) {
                            const d = snap.data();
                            setCells(d.cells || []);
                            setSketchName(d.name || "");
                        }
                    });
                } else if (user?.uid === 'local-user' && currentId) {
                    const localData = loadLocalSketches();
                    const active = localData.find(s => s.id === currentId);
                    if (active) {
                        setCells(active.cells || []);
                        setSketchName(active.name || "");
                    }
                }
            }, [user, currentId]);

            const save = useCallback(async (newCells, newName) => {
                const nameToSave = typeof newName === 'string' ? newName : nameRef.current;
                const cellsToSave = newCells || cellsRef.current;

                setSaveStatus('saving');
                if (user?.uid === 'local-user') {
                    const localData = loadLocalSketches();
                    const updated = localData.map(s => s.id === currentIdRef.current ? { ...s, name: nameToSave, cells: cellsToSave, updatedAt: Date.now() } : s);
                    saveLocalSketches(updated);
                    setSketchName(nameToSave);
                } else if (firebase.current.db && currentIdRef.current) {
                    const { doc, updateDoc, serverTimestamp } = window.FirebaseLib;
                    try {
                        await updateDoc(doc(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches', currentIdRef.current), {
                            cells: cellsToSave,
                            name: nameToSave,
                            updatedAt: serverTimestamp()
                        });
                    } catch (e) { console.error("Save", e); }
                }
                setSaveStatus('saved');
                setTimeout(() => setSaveStatus('ready'), 2000);
            }, [user]);

            useEffect(() => {
                if (isInitialLoading || !user) return;
                let payload = null;
                try {
                    const raw = localStorage.getItem(BEATHIVE_HANDOFF_KEY);
                    payload = raw ? JSON.parse(raw) : null;
                } catch (_) {
                    payload = null;
                }
                if (!payload || typeof payload !== 'object') return;
                try { localStorage.removeItem(BEATHIVE_HANDOFF_KEY); } catch (_) {}

                const nextTopic = String(payload.topic || '').trim();
                const nextConstraints = String(payload.constraints || '').trim();
                const incomingJots = Array.isArray(payload.jots)
                    ? payload.jots.map(j => String(j || '').trim()).filter(Boolean).slice(0, 60)
                    : [];
                if (!nextTopic && !nextConstraints && !incomingJots.length) return;

                const currentName = String(nameRef.current || '').trim();
                const shouldAdoptTopic = !!nextTopic && (
                    !currentName ||
                    currentName === 'Local Demo Map' ||
                    currentName === 'Welcome Map' ||
                    currentName === 'New Beat Map' ||
                    currentName === 'Untitled Hive'
                );

                // Incoming jots (e.g. a Joterie harvest) land as note cells in a
                // fresh column below the existing map, ready to drag into the spine.
                let mergedCells = null;
                if (incomingJots.length) {
                    const existing = cellsRef.current || [];
                    const baseR = existing.length ? Math.max(...existing.map(c => Number(c.r) || 0)) + 1 : 0;
                    const jotCells = incomingJots.map((text, i) => ({ q: 0, r: baseR + i, type: 'note', content: text, tags: [] }));
                    mergedCells = [...existing, ...jotCells];
                    setCells(mergedCells);
                    setSelection({ q: 0, r: baseR });
                    if (window.WTToast && typeof window.WTToast.notify === 'function') {
                        window.WTToast.notify(`Received ${incomingJots.length} idea${incomingJots.length === 1 ? '' : 's'} from ${String(payload.source || 'another tool')}`, 'success');
                    }
                }

                if (currentIdRef.current) {
                    if (mergedCells || shouldAdoptTopic) {
                        save(mergedCells, shouldAdoptTopic ? nextTopic : undefined);
                    }
                } else if (shouldAdoptTopic) {
                    setSketchName(nextTopic);
                }
            }, [isInitialLoading, save, user]);

            const getCellContentText = useCallback((cell) => {
                if (!cell) return '';
                const modern = typeof cell.content === 'string' ? cell.content : '';
                const legacy = typeof cell.text === 'string' ? cell.text : '';
                return (modern || legacy).trim();
            }, []);

            const handlePrint = useCallback(() => {
                const usedCells = cells.filter(c => getCellContentText(c).length > 0 || c.type !== 'setup');
                if (usedCells.length === 0) {
                    alert('No content to print. Add some beats first!');
                    return;
                }

                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    alert('Please allow popups to open the print preview.');
                    return;
                }

                const qValues = usedCells.map(c => c.q);
                const rValues = usedCells.map(c => c.r);
                const minQ = Math.min(...qValues) - 1;
                const maxQ = Math.max(...qValues) + 1;
                const minR = Math.min(...rValues) - 1;
                const maxR = Math.max(...rValues) + 1;

                const qRange = Math.max(1, maxQ - minQ + 1);
                const rRange = Math.max(1, maxR - minR + 1);

                // Dynamically maximize hex size based on content bounds.
                const targetWidth = 1500;
                const targetHeight = 980;
                const maxByWidth = targetWidth / (Math.sqrt(3) * (qRange + 2));
                const maxByHeight = targetHeight / (1.5 * rRange + 2);
                const hexSize = Math.max(42, Math.min(130, Math.floor(Math.min(maxByWidth, maxByHeight))));
                const hexWidth = Math.sqrt(3) * hexSize;
                const hexHeight = 2 * hexSize;
                const vertSpacing = hexHeight * 0.75;

                const getHexPoints = (cx, cy, size) => {
                    const pts = [];
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 6;
                        pts.push(`${cx + size * Math.cos(angle)},${cy + size * Math.sin(angle)}`);
                    }
                    return pts.join(' ');
                };

                const hexToPixel = (q, r) => ({
                    x: (q - minQ) * hexWidth + ((r % 2 === 0) ? 0 : hexWidth / 2) + hexSize + 40,
                    y: (r - minR) * vertSpacing + hexSize + 40
                });

                const width = (qRange + 2) * hexWidth + hexSize * 2;
                const height = (rRange + 2) * vertSpacing + hexSize * 2;

                let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;

                // Draw grid outline for all cells in bounds (dashed for empty)
                for (let q = minQ; q <= maxQ; q++) {
                    for (let r = minR; r <= maxR; r++) {
                        const { x, y } = hexToPixel(q, r);
                        const cell = cells.find(c => c.q === q && c.r === r);
                        const hasContent = cell && (getCellContentText(cell).length > 0 || cell.type !== 'setup');

                        if (!hasContent) {
                            svgContent += `<polygon points="${getHexPoints(x, y, hexSize)}" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>`;
                        }
                    }
                }

                // Draw filled hexes
                usedCells.forEach(cell => {
                    const { x, y } = hexToPixel(cell.q, cell.r);
                    const beatType = BEAT_TYPES.find(t => t.id === cell.type) || BEAT_TYPES[0];
                    const fillColor = beatType.color.light;
                    const strokeColor = beatType.stroke.light;

                    svgContent += `<polygon points="${getHexPoints(x, y, hexSize)}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;

                    // Add text
                    const cellText = getCellContentText(cell);
                    if (cellText) {
                        const lines = cellText.split('\n').slice(0, 4);
                        const lineHeight = Math.max(12, Math.floor(hexSize * 0.17));
                        const startY = y - (lines.length - 1) * lineHeight / 2;
                        lines.forEach((line, i) => {
                            const maxChars = Math.max(14, Math.floor(hexSize / 4));
                            const truncated = line.length > maxChars ? line.substring(0, maxChars - 3) + '...' : line;
                            svgContent += `<text x="${x}" y="${startY + i * lineHeight}" text-anchor="middle" font-size="${Math.max(9, Math.floor(hexSize * 0.14))}" font-family="Inter, sans-serif" fill="#000">${truncated}</text>`;
                        });
                    }

                    // Add beat type label
                    svgContent += `<text x="${x}" y="${y + hexSize - Math.max(14, Math.floor(hexSize * 0.18))}" text-anchor="middle" font-size="${Math.max(8, Math.floor(hexSize * 0.1))}" font-family="Inter, sans-serif" fill="${strokeColor}" font-weight="bold">${beatType.label.toUpperCase()}</text>`;
                });

                svgContent += '</svg>';

                // Replace fixed pixel dimensions with viewBox-only so print scales properly
                const scaledSvg = svgContent
                    .replace(/width="\d+"/, `width="100%"`)
                    .replace(/height="\d+"/, `height="auto"`);

                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5' fill='%23fd19c8'/><polygon points='50,20 80,37.5 80,62.5 50,80 20,62.5 20,37.5' fill='%23da70d6' opacity='0.6'/></svg>">
                        <title>BeatHive - ${sketchName || 'Untitled'}</title>
                        <style>
                            body { margin: 0; padding: 20px; }
                            svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
                            @media print {
                                body { padding: 0; }
                            }
                        </style>
                    </head>
                    <body>
                        <h1 style="text-align: center; font-family: sans-serif; margin-bottom: 20px;">${sketchName || 'Untitled Beat Map'}</h1>
                        ${scaledSvg}
                    </body>
                    </html>
                `);
                printWindow.document.close();
                printWindow.focus();
                printWindow.onload = () => setTimeout(() => printWindow.print(), 150);
            }, [cells, sketchName, getCellContentText]);

            const handleNewMap = async () => {
                setIsCreating(true);
                try {
                    const newId = `map-${Date.now()}`;
                    const newData = { name: "New Beat Map", cells: [], owner: user.uid, createdAt: Date.now(), updatedAt: Date.now() };

                    if (user?.uid === 'local-user') {
                        const localData = loadLocalSketches();
                        const newItem = { id: newId, ...newData };
                        saveLocalSketches([...localData, newItem]);
                        setCurrentId(newId);
                        setCells([]);
                        setSketchName("New Beat Map");
                        setSelection({ q: null, r: null });
                    } else if (firebase.current.db) {
                        const { collection, addDoc, serverTimestamp } = window.FirebaseLib;
                        const docRef = await addDoc(collection(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches'), {
                            ...newData,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        });
                        setCurrentId(docRef.id);
                    }
                } catch(e) { console.error(e); } finally { setIsCreating(false); }
            };

            const handleDeleteMap = async (id, e) => {
                e.stopPropagation();
                const target = sketchesRef.current.find(s => s.id === id);
                const label = (target && target.name) ? `"${target.name}"` : 'this map';
                if (!window.confirm(`Delete ${label}? A recovery snapshot will be saved first.`)) return;
                saveLocalSnapshot({}, 'pre-map-delete', { mapId: id, mapName: target?.name || '' });
                if (user?.uid === 'local-user') {
                    const localData = loadLocalSketches();
                    const filtered = localData.filter(s => s.id !== id);
                    saveLocalSketches(filtered);
                    if (currentId === id) {
                        setCurrentId(filtered.length > 0 ? filtered[0].id : null);
                        setCells(filtered.length > 0 ? filtered[0].cells : []);
                        setSketchName(filtered.length > 0 ? filtered[0].name : "");
                    }
                } else if (firebase.current.db) {
                    const { doc, deleteDoc } = window.FirebaseLib;
                    await deleteDoc(doc(firebase.current.db, 'artifacts', firebase.current.appId, 'public', 'data', 'sketches', id));
                    if (currentId === id) {
                        setCurrentId(null);
                        currentIdRef.current = null;
                        setCells([]);
                        setSketchName("");
                    }
                }
            };

            // -- Interactions --
            const handleDoubleClick = (e, q, r) => {
                e.preventDefault();
                setSelection({ q, r });
                setQuickMenu({ x: e.clientX, y: e.clientY, q, r });
                window.getSelection().removeAllRanges();
            };

            const updateCell = (q, r, updates) => {
                const existing = cellsRef.current.find(c => c.q === q && c.r === r);
                const nextCells = existing 
                    ? cellsRef.current.map(c => (c.q === q && c.r === r) ? { ...c, ...updates } : c)
                    : [...cellsRef.current, { q, r, type: 'setup', content: '', tags: [], ...updates }];
                setCells(nextCells);
                
                // Debounce content updates (Audit Rec 4.3)
                if (updates.content !== undefined && Object.keys(updates).length === 1) {
                    if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                    saveTimeoutRef.current = setTimeout(() => save(nextCells), 800);
                } else {
                    // Immediate save for structural changes
                    if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                    save(nextCells);
                }
            };

            const handleMouseDown = (e, q, r) => {
                if (e.button !== 0) return;
                setQuickMenu(null);
                dragOrigin.current = { x: e.clientX, y: e.clientY };
                
                setDragState({ active: false, startQ: q, startR: r, dropTarget: { q, r } }); 
            };

            const handleMouseMove = (e) => {
                if (dragState.startQ !== null) {
                    const dist = Math.hypot(e.clientX - dragOrigin.current.x, e.clientY - dragOrigin.current.y);
                    if (dist > 5) {
                        const rect = svgRef.current.getBoundingClientRect();
                        // Use same transform calculation as the SVG group
                        const transformX = dimensions.w/2 + pan.x - (libOpen ? 160 : 0) + (sidebarOpen ? -160 : 0);
                        const transformY = dimensions.h/2 + pan.y - 40;
                        const adjX = (e.clientX - rect.left - transformX) / zoom;
                        const adjY = (e.clientY - rect.top - transformY) / zoom;
                        let r = Math.round(adjY / VERT_SPACING);
                        let q = Math.round((adjX - (r % 2 === 0 ? 0 : HEX_WIDTH / 2)) / HEX_WIDTH);
                        setDragState(prev => ({ ...prev, active: true, dropTarget: { q, r } }));
                    }
                } else if (e.buttons === 1) {
                    setPan(p => {
                        const next = { x: p.x + e.movementX, y: p.y + e.movementY };
                        panRef.current = next;
                        return next;
                    });
                }
            };

            const handleMouseUp = () => {
                if (dragState.active && dragState.dropTarget) {
                    const { startQ, startR, dropTarget } = dragState;
                    if (dropTarget.q !== startQ || dropTarget.r !== startR) {
                        const source = cellsRef.current.find(c => c.q === startQ && c.r === startR);
                        let next = cellsRef.current.filter(c => !(c.q === startQ && c.r === startR) && !(c.q === dropTarget.q && c.r === dropTarget.r));
                        if (source) next.push({ ...source, q: dropTarget.q, r: dropTarget.r });
                        setCells(next); save(next); setSelection(dropTarget);
                    }
                } else if (dragState.startQ !== null) {
                    setSelection({ q: dragState.startQ, r: dragState.startR });
                }
                setDragState({ active: false, startQ: null, startR: null, dropTarget: null });
            };

            // WASD Movement
            useEffect(() => {
                const moveLoop = () => {
                    if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') {
                        requestRef.current = requestAnimationFrame(moveLoop);
                        return;
                    }
                    const speed = 12 / zoom; 
                    let dx = 0, dy = 0;
                    if (keysPressed.current['w'] || keysPressed.current['arrowup']) dy += speed;
                    if (keysPressed.current['s'] || keysPressed.current['arrowdown']) dy -= speed;
                    if (keysPressed.current['a'] || keysPressed.current['arrowleft']) dx += speed;
                    if (keysPressed.current['d'] || keysPressed.current['arrowright']) dx -= speed;
                    if (dx !== 0 || dy !== 0) {
                        panRef.current = { x: panRef.current.x + dx, y: panRef.current.y + dy };
                        setPan({ ...panRef.current });
                    }
                    requestRef.current = requestAnimationFrame(moveLoop);
                };

                const handleKeyDown = (e) => {
                    keysPressed.current[e.key.toLowerCase()] = true;
                    if (!['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) {
                        if ((e.key === 'Delete' || e.key === 'Backspace') && selection.q !== null) {
                            const next = cellsRef.current.filter(c => !(c.q === selection.q && c.r === selection.r));
                            setCells(next); save(next); setSelection({ q: null, r: null });
                        }
                    }
                };
                const handleKeyUp = (e) => keysPressed.current[e.key.toLowerCase()] = false;

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                requestRef.current = requestAnimationFrame(moveLoop);
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                    cancelAnimationFrame(requestRef.current);
                };
            }, [zoom, selection, save]);

            const centerX = useMemo(() => {
                let x = dimensions.w / 2;
                if (!libOpen && sidebarOpen) x -= 160;
                if (libOpen && !sidebarOpen) x += 140;
                return x;
            }, [dimensions, libOpen, sidebarOpen]);
            const centerY = dimensions.h / 2.2;

            const selectedCell = cells.find(c => c.q === selection.q && c.r === selection.r);
            const mapStats = useMemo(() => {
                const withContent = cells.filter(c => getCellContentText(c).length > 0);
                return {
                    populatedCells: withContent.length,
                    storyBeats: withContent.filter(c => c.type !== 'note').length
                };
            }, [cells, getCellContentText]);
            const sendMapToCourius = useCallback(() => {
                const storyCells = cells
                    .filter((c) => getCellContentText(c).length > 0)
                    .slice(0, 80);
                if (storyCells.length === 0) return;

                const safe = (text) => String(text || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                let beatNum = 0;
                const html = storyCells.map((cell) => {
                    const content = safe(getCellContentText(cell));
                    if (cell.type === 'note') {
                        // Notes/context become bullet points under the previous beat
                        const bullets = content.split(/\n/).filter(l => l.trim()).map(l => `• ${l.trim()}`).join('<br>');
                        return `<div class="action">${bullets}</div>`;
                    }
                    beatNum++;
                    const beatType = (BEAT_TYPES.find(t => t.id === cell.type) || BEAT_TYPES[4]).label;
                    return `<div class="scene-heading">BEAT ${beatNum} - ${safe(beatType)}</div><div class="action">${content.replace(/\n/g, '<br>')}</div>`;
                }).join('');

                const mode = couriusMode === 'overwrite' ? 'overwrite' : 'append';
                let transferOk = false;
                try {
                    if (window.WTCourius) {
                        if (mode === 'overwrite') {
                            transferOk = !!window.WTCourius.overwrite(html, 'BeatHive');
                        } else {
                            transferOk = !!window.WTCourius.append(html, 'BeatHive');
                        }
                    }
                } catch (_) {}
                if (window.WTToast && typeof window.WTToast.notify === 'function') {
                    window.WTToast.notify(
                        transferOk
                            ? `Sent to Courius (${mode === 'overwrite' ? 'replace' : 'append'})`
                            : 'Courius transfer failed',
                        transferOk ? 'success' : 'error'
                    );
                }
                window.open('Courius.html', '_blank', 'noopener');
            }, [cells, getCellContentText, couriusMode]);
            useEffect(() => {
                window.WTToolActions = {
                    exportPrimary: () => sendMapToCourius(),
                    handoffPrimary: () => sendMapToCourius()
                };
                window.BeatHiveDebug = {
                    restoreLatestSnapshot: restoreLatestBeatHiveSnapshot,
                    clearSnapshots: clearBeatHiveSnapshots
                };
                return () => {
                    try { delete window.WTToolActions; } catch (_) {}
                    try { delete window.BeatHiveDebug; } catch (_) {}
                };
            }, [clearBeatHiveSnapshots, restoreLatestBeatHiveSnapshot, sendMapToCourius]);

            const seedStarterArc = useCallback(() => {
                const base = [
                    { q: 0, r: 0, type: 'setup', content: "ORDINARY WORLD\nWho are we following and what do they want?" },
                    { q: 0, r: 1, type: 'inciting', content: "INCITING INCIDENT\nSomething forces a change of plan." },
                    { q: 0, r: 2, type: 'heightening', content: "MIDPOINT ESCALATION\nRaise the cost and reveal new information." },
                    { q: 0, r: 3, type: 'heightening', content: "CRISIS\nThe worst option becomes the only option." },
                    { q: 0, r: 4, type: 'blowoff', content: "RESOLUTION\nHow are they changed by what happened?" }
                ];
                setCells(base);
                save(base);
                setSelection({ q: 0, r: 0 });
            }, [save]);

            const dismissImmersionTips = useCallback(() => {
                setShowImmersionTips(false);
            }, []);

            // Optimization 4.1: Memoize Grid Generation
            const visibleGrid = useMemo(() => {
                const centerR = Math.round(-pan.y / VERT_SPACING / zoom);
                const centerQ = Math.round(-pan.x / HEX_WIDTH / zoom);
                
                return Array.from({length: 16}).flatMap((_, r_idx) => {
                    const r = r_idx - 8 + centerR;
                    return Array.from({length: 16}).map((__, q_idx) => {
                        const q = q_idx - 8 + centerQ;
                        const cData = cells.find(c => c.q === q && c.r === r);
                        return <HexCell key={`g-${q}-${r}`} q={q} r={r} data={cData} theme={theme} zoom={zoom} isSelected={selection.q === q && selection.r === r} onMouseDown={handleMouseDown} onDoubleClick={handleDoubleClick} />;
                    });
                });
            }, [cells, selection, theme, zoom, Math.round(pan.x / HEX_WIDTH / zoom), Math.round(pan.y / VERT_SPACING / zoom)]);

            if (isInitialLoading) return (
                <div className="w-full h-screen bg-black flex items-center justify-center flex-col gap-6">
                    <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <div className="text-white/30 font-black tracking-[0.4em] uppercase text-xs animate-pulse">Initializing System</div>
                </div>
            );

            return (
                <div className={`w-full h-screen flex flex-col transition-all duration-500 ${theme === 'dark' ? 'dark-theme' : 'light-theme'}`}>
                    <header className={`h-16 flex items-center justify-between px-6 border-b transition-colors ${theme === 'dark' ? 'border-white/5 bg-black/50' : 'border-stone-400/20 bg-[#e6e0d4]/80'} backdrop-blur-xl z-50`}>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setLibOpen(!libOpen)} aria-label="Toggle Library" className={`p-2 rounded-lg transition-all ${libOpen ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-black/10 opacity-60'}`}><Icon name="folder" size={18}/></button>
                            <div className="flex flex-col">
                                <input value={sketchName} onChange={(e) => { setSketchName(e.target.value); save(null, e.target.value); }} aria-label="Project Name" className="bg-transparent font-display font-bold text-lg outline-none w-48 sm:w-64" placeholder="Untitled Hive" />
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 px-2">
                                <button
                                    onClick={() => setZoom(z => Math.max(0.1, z - 0.1))}
                                    aria-label="Zoom out"
                                    className="p-1 rounded hover:bg-current/10 transition-colors"
                                >
                                    <Icon name="zoomOut" size={12} className="opacity-70"/>
                                </button>
                                <input 
                                    type="range" min="0.1" max="3" step="0.1" 
                                    value={zoom} 
                                    onChange={(e) => setZoom(parseFloat(e.target.value))}
                                    aria-label="Zoom Level"
                                    className="w-20 h-1 bg-current opacity-20 rounded-lg appearance-none cursor-pointer"
                                />
                                <button
                                    onClick={() => setZoom(z => Math.min(3.0, z + 0.1))}
                                    aria-label="Zoom in"
                                    className="p-1 rounded hover:bg-current/10 transition-colors"
                                >
                                    <Icon name="zoomIn" size={12} className="opacity-70"/>
                                </button>
                            </div>
                            <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} aria-label="Toggle Theme" className="p-2 opacity-50 hover:opacity-100"><Icon name={theme === 'dark' ? 'sun' : 'moon'} size={20}/></button>
                            <button onClick={handlePrint} aria-label="Print" className="p-2 opacity-50 hover:opacity-100"><Icon name="printer" size={20}/></button>
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} aria-label="Toggle Inspector" className={`p-2 rounded-lg transition-all ${sidebarOpen ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-black/10 opacity-60'}`}><Icon name="mask" size={18}/></button>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-hidden relative">
                        <aside className={`sidebar-panel border-r backdrop-blur-sm ${libOpen ? 'w-[320px]' : 'w-0'}`}>
                            <div className="sidebar-inner p-6 space-y-6">
                                <button onClick={handleNewMap} disabled={isCreating} aria-label="New Map" className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs tracking-widest uppercase flex items-center justify-center gap-3 shadow-xl transition-all active:scale-95 disabled:opacity-50">
                                    <Icon name="plus" size={14}/> New Universe
                                </button>
                                <div className={`rounded-2xl p-4 border ${theme === 'dark' ? 'border-white/10 bg-white/5' : 'border-[#432818]/15 bg-white/50'}`}>
                                    <div className="flex items-center justify-between gap-3">
                                        <div>
                                            <div className="text-[10px] font-black uppercase tracking-[0.2em] opacity-60 mb-1">Recovery</div>
                                            <div className="text-xs font-semibold">{getLocalSnapshots().length} snapshot{getLocalSnapshots().length === 1 ? '' : 's'}</div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button id="beathive-restore-snapshot-btn" onClick={restoreLatestBeatHiveSnapshot} className="px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider bg-current/10 hover:bg-current/15 transition-colors" disabled={getLocalSnapshots().length < 1}>Restore</button>
                                            <button id="beathive-clear-snapshots-btn" onClick={clearBeatHiveSnapshots} className="px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider bg-current/10 hover:bg-current/15 transition-colors" disabled={getLocalSnapshots().length < 1}>Clear</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 no-scrollbar pr-2">
                                    {sketches.map(s => (
                                        <div key={s.id} onClick={() => setCurrentId(s.id)} className={`group flex items-center justify-between p-4 rounded-xl cursor-pointer transition-all ${currentId === s.id ? 'bg-indigo-500/10 border border-indigo-500/30 text-indigo-500 font-bold' : 'opacity-60 hover:opacity-100 hover:bg-current/5'}`}>
                                            <span className="text-xs truncate px-1">{s.name || "Untitled"}</span>
                                            <button onClick={(e) => handleDeleteMap(s.id, e)} aria-label="Delete Map" className="opacity-0 group-hover:opacity-100 p-2 hover:bg-red-500/20 hover:text-red-500 rounded-lg transition-all"><Icon name="trash" size={14}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <div ref={canvasRef} className={`flex-1 relative cursor-grab active:cursor-grabbing overflow-hidden transition-all duration-300 ${theme === 'dark' ? 'bg-grid-dark' : 'bg-grid-light'}`} 
                             onMouseDown={(e) => { if(e.target.tagName === 'svg') setSelection({q:null, r:null}); }}
                             onMouseMove={handleMouseMove}
                             onMouseUp={handleMouseUp}
                             onMouseLeave={() => setDragState({ active: false, startQ: null, startR: null, dropTarget: null })}>
                            <svg ref={svgRef} className="w-full h-full">
                                <g transform={`translate(${window.innerWidth/2 + pan.x - (libOpen ? 160 : 0) + (sidebarOpen ? -160 : 0)}, ${window.innerHeight/2 + pan.y - 40}) scale(${zoom})`}>
                                    
                                    {/* Infinite Grid Simulation (Optimized) */}
                                    {visibleGrid}

                                    {/* Active Hexes (Foreground) */}
                                    {cells.map(c => <HexCell key={`active-${c.q},${c.r}`} q={c.q} r={c.r} data={c} theme={theme} zoom={zoom} isSelected={selection.q === c.q && selection.r === c.r} onMouseDown={handleMouseDown} onDoubleClick={handleDoubleClick} />)}

                                    {/* Drag Ghost */}
                                    {dragState.active && dragState.dropTarget && (
                                         <HexCell q={dragState.dropTarget.q} r={dragState.dropTarget.r} isSelected={true} theme={theme} zoom={zoom} onMouseDown={()=>{}} onDoubleClick={()=>{}} />
                                    )}

                                    {/* Spine Line - Rendered Last */}
