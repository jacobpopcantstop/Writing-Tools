<!DOCTYPE html>
<html lang="en" data-wt-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Character Forge | Writing Tools</title>
  <meta name="description" content="A Q&amp;A-based character builder — answer prompts to develop a character.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2306070b'/><circle cx='50' cy='35' r='14' fill='none' stroke='%23fd19c8' stroke-width='7'/><path d='M24 78c4-16 16-24 26-24s22 8 26 24' fill='none' stroke='%23fd19c8' stroke-width='7' stroke-linecap='round'/><path d='M70 28l10-10' stroke='%23fae84f' stroke-width='5' stroke-linecap='round'/><path d='M76 18l6 6' stroke='%23fae84f' stroke-width='5' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.263.1"></script>
  <script src="shared-toast.js"></script>
  <script src="shared-courius.js"></script>
  <script src="characterforge-questions.js"></script>
  <script src="characterforge-engine.js"></script>
  <script src="shared-pwa.js"></script>
  <script src="shared-tool-manifest.js"></script>
  <script src="shared-recent-sessions.js"></script>
  <script src="shared-commands.js"></script>
  <script src="shared-command-palette.js"></script>
  <style>
    :root {
      --bg: #0d1017;
      --bg-soft: #161a24;
      --panel: rgba(17, 21, 31, 0.9);
      --panel-strong: rgba(12, 16, 24, 0.96);
      --text: #f5f7fb;
      --muted: #9da8ba;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #ff7a59;
      --accent-2: #ffd166;
      --accent-3: #7ae3c3;
      --danger: #ff8d8d;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }

    [data-wt-theme="light"] {
      --bg: #f8f2e8;
      --bg-soft: #efe5d5;
      --panel: rgba(255, 251, 245, 0.92);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --text: #181513;
      --muted: #635d55;
      --line: rgba(72, 50, 32, 0.14);
      --accent: #cf5f42;
      --accent-2: #d7a116;
      --accent-3: #207c66;
      --danger: #bb5656;
      --shadow: 0 24px 80px rgba(83, 60, 35, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      min-height: 100dvh;
      margin: 0;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, #000 12%), var(--bg));
    }

    a { color: inherit; }
    button, input, textarea {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 78%, #fff 22%);
      outline-offset: 2px;
    }

    .shell {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brandline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-family: "IBM Plex Mono", monospace;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost-link,
    .theme-btn {
      border: 1px solid var(--line);
      color: var(--text);
      background: color-mix(in srgb, var(--panel-strong) 88%, transparent);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      min-height: 42px;
      padding: 0 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .theme-btn { width: 42px; padding: 0; }

    .ghost-link:hover,
    .theme-btn:hover {
      transform: translateY(-1px);
      background: color-mix(in srgb, var(--bg-soft) 84%, transparent);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    }

    /* ── CharacterForge Socratic interview ── */

    #cf-app {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .cf-progress {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.6;
      font-family: "IBM Plex Mono", monospace;
    }

    .cf-theme-label {
      font-size: 1rem;
      opacity: 0.7;
      margin: 0.5rem 0;
      font-family: "IBM Plex Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .cf-question {
      font-size: 1.4rem;
      line-height: 1.4;
      margin: 0.5rem 0 1rem;
      font-family: "Fraunces", serif;
      letter-spacing: -0.02em;
    }

    .cf-answer-input {
      width: 100%;
      font: inherit;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel-strong) 92%, transparent);
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color 160ms ease;
    }

    .cf-answer-input:focus {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }

    .cf-answer-input::placeholder {
      color: color-mix(in srgb, var(--muted) 84%, transparent);
    }

    .cf-nav {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .cf-nav button,
    .cf-actions button {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel-strong) 88%, transparent);
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
      padding: 0 1.25rem;
      min-height: 44px;
      font-weight: 600;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .cf-nav button:hover,
    .cf-actions button:hover {
      transform: translateY(-1px);
      background: color-mix(in srgb, var(--bg-soft) 84%, transparent);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    }

    .cf-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    #cf-next {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), color-mix(in srgb, var(--accent-2) 70%, #000 30%));
      color: #140f0d;
      border-color: transparent;
    }

    #cf-next:hover {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 95%, #fff 5%), color-mix(in srgb, var(--accent-2) 75%, #000 25%));
      border-color: transparent;
    }

    .cf-sheet {
      margin-top: 2rem;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(14px);
    }

    .cf-sheet .cf-theme {
      margin-top: 1.5rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .cf-sheet .cf-theme:first-child {
      margin-top: 0;
    }

    .cf-sheet .cf-answer {
      white-space: pre-wrap;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0.4rem 0 0.8rem;
    }

    .cf-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .cf-library {
      margin-top: 2.5rem;
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
    }

    .cf-library h2 {
      font-size: 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin: 0 0 0.75rem;
    }

    #cf-library-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.5rem;
    }

    #cf-library-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 80%, transparent);
    }

    .cf-lib-name {
      flex: 1 1 120px;
      font-weight: 600;
      font-size: 14px;
    }

    #cf-library-list button {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel-strong) 88%, transparent);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      padding: 0 0.6rem;
      min-height: 30px;
      font-size: 11px;
      font-family: "IBM Plex Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: border-color 160ms ease, background 160ms ease;
    }

    #cf-library-list button:hover {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      background: color-mix(in srgb, var(--bg-soft) 80%, transparent);
    }

    #cf-library-list button[data-act="del"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 32%, var(--line));
    }

    @media (max-width: 720px) {
      body {
        padding-bottom: 72px;
      }

      .shell {
        width: min(100% - 20px, 100%);
        padding-top: 18px;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .ghost-link,
      .theme-btn {
        min-height: 44px;
      }

      #wtp-trigger {
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 8px 10px;
        font-size: 10px;
        opacity: 0.88;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brandline">
        <span class="brand-dot"></span>
        Character Forge
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="index.html" target="_blank" rel="noopener">Suite Home</a>
        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch to light theme">
          <i data-lucide="sun-medium" style="width:18px;height:18px"></i>
        </button>
      </div>
    </header>

    <main id="cf-app">
      <div id="cf-progress" class="cf-progress"></div>
      <h1 id="cf-theme-label" class="cf-theme-label"></h1>
      <p id="cf-question" class="cf-question"></p>
      <textarea id="cf-answer" class="cf-answer-input" rows="6" placeholder="Write in your own words…"></textarea>
      <div class="cf-nav">
        <button id="cf-back" type="button">Back</button>
        <button id="cf-next" type="button">Next</button>
      </div>
      <div id="cf-sheet" class="cf-sheet" hidden></div>
      <div class="cf-actions" hidden id="cf-finish-actions">
        <button id="cf-save" type="button">Save character</button>
        <button id="cf-to-courius" type="button">Send to Courius</button>
      </div>
      <aside id="cf-library" class="cf-library">
        <h2>Saved characters</h2>
        <ul id="cf-library-list"></ul>
      </aside>
    </main>
  </div>

  <script>
    (function () {
      'use strict';
      var BANK = window.WTCharacterQuestions;
      var Engine = window.WTCharacterEngine;
      var LIB_KEY = 'writingtools_characterforge_v2';
      var THEME_KEY = 'writingtools_theme';

      var state = { queue: Engine.buildQueue(BANK), index: 0, answers: {}, inserted: {} };

      var els = {
        progress: document.getElementById('cf-progress'),
        themeLabel: document.getElementById('cf-theme-label'),
        question: document.getElementById('cf-question'),
        answer: document.getElementById('cf-answer'),
        back: document.getElementById('cf-back'),
        next: document.getElementById('cf-next'),
        sheet: document.getElementById('cf-sheet'),
        finishActions: document.getElementById('cf-finish-actions'),
        save: document.getElementById('cf-save'),
        toCourius: document.getElementById('cf-to-courius')
      };

      function current() { return state.queue[state.index]; }
      function readLib() { try { return JSON.parse(localStorage.getItem(LIB_KEY) || '{}') || {}; } catch (_) { return {}; } }
      function writeLib(lib) { try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); } catch (_) {} }

      function render() {
        var q = current();
        if (!q) { return finish(); }
        var themeNum = BANK.themes.findIndex(function (t) { return t.id === q.themeId; }) + 1;
        els.progress.textContent = 'Theme ' + themeNum + ' of ' + BANK.themes.length;
        els.themeLabel.textContent = q.themeLabel || '';
        els.question.textContent = q.prompt;
        els.answer.value = state.answers[q.id] || '';
        els.back.disabled = state.index === 0;
        els.next.textContent = state.index === state.queue.length - 1 ? 'Finish' : 'Next';
      }

      function saveAnswer() {
        var q = current();
        if (!q) return;
        state.answers[q.id] = els.answer.value;
        if (!state.inserted[q.id]) {
          var ups = Engine.evalFollowUps(q, els.answer.value);
          if (ups.length) {
            var injected = ups.map(function (f, i) {
              return { themeId: q.themeId, themeLabel: q.themeLabel, id: q.id + '-fu' + i, prompt: f.prompt, followUps: [] };
            });
            state.queue.splice.apply(state.queue, [state.index + 1, 0].concat(injected));
            state.inserted[q.id] = true;
          }
        }
      }

      function finish() {
        var sheet = Engine.buildSheet(BANK, state.answers);
        els.sheet.innerHTML = sheet || '<p>No answers yet.</p>';
        els.sheet.hidden = false;
        els.finishActions.hidden = false;
        els.themeLabel.textContent = 'Your character';
        els.question.textContent = '';
        els.answer.hidden = true;
        els.next.hidden = true;
        els.back.hidden = true;
      }

      els.next.addEventListener('click', function () {
        saveAnswer();
        if (state.index < state.queue.length - 1) { state.index += 1; render(); }
        else finish();
      });
      els.back.addEventListener('click', function () {
        saveAnswer();
        if (state.index > 0) { state.index -= 1; render(); }
      });
      els.save.addEventListener('click', function () {
        var name = prompt('Name this character:');
        if (!name) return;
        var lib = readLib();
        lib[Date.now()] = { name: name, answers: state.answers, createdAt: new Date().toISOString() };
        writeLib(lib);
        window.WTToast && window.WTToast.notify('Character saved.');
        renderLibrary();
      });
      els.toCourius.addEventListener('click', function () {
        var html = Engine.buildSheet(BANK, state.answers);
        var ok = window.WTCourius && window.WTCourius.append(html, 'CharacterForge');
        window.WTToast && window.WTToast.notify(ok ? 'Sent to Courius.' : 'Could not send.', ok ? 'info' : 'error');
      });

      function renderLibrary() {
        var lib = readLib();
        var list = document.getElementById('cf-library-list');
        list.innerHTML = '';
        Object.keys(lib).sort().reverse().forEach(function (key) {
          var entry = lib[key];
          var li = document.createElement('li');
          li.innerHTML =
            '<span class="cf-lib-name"></span> ' +
            '<button data-act="open">Open</button>' +
            '<button data-act="rename">Rename</button>' +
            '<button data-act="dup">Duplicate</button>' +
            '<button data-act="del">Delete</button>';
          li.querySelector('.cf-lib-name').textContent = entry.name;
          li.querySelector('[data-act=open]').onclick = function () {
            state.answers = Object.assign({}, entry.answers); state.index = 0;
            state.queue = Engine.buildQueue(BANK); state.inserted = {};
            els.answer.hidden = false; els.next.hidden = false; els.back.hidden = false;
            els.sheet.hidden = true; els.finishActions.hidden = true; render();
          };
          li.querySelector('[data-act=rename]').onclick = function () {
            var n = prompt('New name:', entry.name); if (!n) return;
            lib[key].name = n; writeLib(lib); renderLibrary();
          };
          li.querySelector('[data-act=dup]').onclick = function () {
            var copy = JSON.parse(JSON.stringify(entry)); copy.name = entry.name + ' (copy)';
            lib[Date.now()] = copy; writeLib(lib); renderLibrary();
          };
          li.querySelector('[data-act=del]').onclick = function () {
            if (!confirm('Delete "' + entry.name + '"?')) return;
            delete lib[key]; writeLib(lib); renderLibrary();
          };
          list.appendChild(li);
        });
      }

      function setTheme(theme) {
        var next = theme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-wt-theme', next);
        var toggle = document.getElementById('theme-toggle');
        if (toggle) toggle.setAttribute('aria-label', next === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
        try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
      }

      function toggleTheme() {
        var current = document.documentElement.getAttribute('data-wt-theme') || 'dark';
        setTheme(current === 'dark' ? 'light' : 'dark');
      }

      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

      try { setTheme(localStorage.getItem(THEME_KEY) || 'dark'); } catch (_) { setTheme('dark'); }

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }

      render();
      renderLibrary();
    })();
  </script>
</body>
</html>
