        function Synax() {
            // --- STATE ---
            const [words, setWords] = useState([]);
            const [mode, setMode] = useState('random'); 
            const [loading, setLoading] = useState(false);
            const [contextInput, setContextInput] = useState('');
            const [definition, setDefinition] = useState(null);

            const [serendipityCount, setSerendipityCount] = useState(4);
            const [contextMeta, setContextMeta] = useState({ updatedAt: '', topic: '' });
            
            // Persistent State
            const [pinned, setPinned] = useState(() => {
                try {
                    const saved = localStorage.getItem('writingtools_synax_pinned');
                    if (!saved) return [];
                    const parsed = JSON.parse(saved);
                    if (!Array.isArray(parsed)) {
                        localStorage.removeItem('writingtools_synax_pinned');
                        return [];
                    }
                    return parsed;
                } catch {
                    try { localStorage.removeItem('writingtools_synax_pinned'); } catch (_) {}
                    return [];
                }
            });
            const [editorContent, setEditorContent] = useState(() => {
                return localStorage.getItem('writingtools_synax_editor') || '';
            });
            const [history, setHistory] = useState([]);
            
            // Settings State
            const [offlineMode, setOfflineMode] = useState(false);
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('writingtools_theme');
                if (saved === 'light') return false;
                if (saved === 'dark') return true;
                return true; // default dark
            });
            const [minimalMode, setMinimalMode] = useState(false);
            const [autoGen, setAutoGen] = useState(false);
            const [autoGenInterval, setAutoGenInterval] = useState(5);

            // Word repetition prevention - tracks recently used words
            const [recentWords, setRecentWords] = useState([]);
            const REPETITION_COOLDOWN = 10; // Number of generations before a word can be reused

            // Refs
            const textareaRef = useRef(null);
            const synaxTabIdRef = useRef('synax-' + Math.random().toString(36).slice(2, 10));
            const localKnownRevisionRef = useRef(0);
            const skipNextPersistRef = useRef(false);
            const stateRef = useRef(null);

            const notifyReliability = useCallback((message, level = 'info') => {
                const bus = window.WTContextBus;
                if (bus && typeof bus.notify === 'function') {
                    bus.notify(String(message || ''), level);
                }
            }, []);

            const normalizeWordSet = useCallback((list) => {
                if (!Array.isArray(list)) return [];
                return list
                    .filter((entry) => entry && typeof entry.word === 'string')
                    .map((entry, idx) => ({
                        id: Number(entry.id) || (Date.now() + idx),
                        word: String(entry.word || '').trim(),
                        type: String(entry.type || 'Word')
                    }))
                    .filter((entry) => entry.word);
            }, []);

            const normalizePinned = useCallback((list) => {
                if (!Array.isArray(list)) return [];
                return list
                    .filter((entry) => entry && typeof entry.word === 'string')
                    .map((entry, idx) => ({
                        id: Number(entry.id) || (Date.now() + idx),
                        word: String(entry.word || '').trim(),
                        type: String(entry.type || 'Word')
                    }))
                    .filter((entry) => entry.word);
            }, []);

            const normalizeHistory = useCallback((list) => {
                if (!Array.isArray(list)) return [];
                return list
                    .map((set) => normalizeWordSet(set))
                    .filter((set) => Array.isArray(set) && set.length > 0)
                    .slice(-20);
            }, [normalizeWordSet]);

            const buildSerializableState = useCallback((source = {}) => {
                const safeMode = ['random', 'triad', 'context', 'rhyme'].includes(source.mode) ? source.mode : 'random';
                const safeInterval = Math.min(30, Math.max(2, Number(source.autoGenInterval) || 5));
                const safeCount = Math.min(12, Math.max(1, Number(source.serendipityCount) || 4));
                return {
                    mode: safeMode,
                    contextInput: String(source.contextInput || ''),
                    words: normalizeWordSet(source.words),
                    history: normalizeHistory(source.history),
                    pinned: normalizePinned(source.pinned),
                    editorContent: String(source.editorContent || ''),
                    settings: {
                        offlineMode: !!source.offlineMode,
                        darkMode: !!source.darkMode,
                        minimalMode: !!source.minimalMode,
                        autoGen: !!source.autoGen,
                        autoGenInterval: safeInterval,
                        serendipityCount: safeCount
                    }
                };
            }, [normalizeHistory, normalizePinned, normalizeWordSet]);

            const getSnapshots = useCallback(() => {
                try {
                    const raw = localStorage.getItem(SYNAX_SNAPSHOTS_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (_) {
                    return [];
                }
            }, []);

            const saveRecoverySnapshot = useCallback((payload, reason, meta) => {
                try {
                    const nextPayload = buildSerializableState(payload);
                    const snapshots = getSnapshots();
                    snapshots.unshift({
                        id: 'snap_' + Date.now() + '_' + Math.floor(Math.random() * 100000),
                        at: new Date().toISOString(),
                        reason: String(reason || 'autosave'),
                        sourceTab: synaxTabIdRef.current,
                        meta: meta && typeof meta === 'object' ? meta : {},
                        payload: nextPayload
                    });
                    localStorage.setItem(SYNAX_SNAPSHOTS_KEY, JSON.stringify(snapshots.slice(0, 20)));
                } catch (_) {}
            }, [buildSerializableState, getSnapshots]);

            const readStateFromStorage = useCallback(() => {
                try {
                    const raw = localStorage.getItem(SYNAX_STATE_KEY);
                    if (!raw) return null;
                    return buildSerializableState(JSON.parse(raw));
                } catch (_) {
                    return null;
                }
            }, [buildSerializableState]);

            const stateComparable = useCallback((payload) => {
                try {
                    return JSON.stringify(buildSerializableState(payload));
                } catch (_) {
                    return '';
                }
            }, [buildSerializableState]);

            const persistSynaxState = useCallback((candidateSource, reason = 'autosave') => {
                const candidate = buildSerializableState(candidateSource);
                const remoteRev = parseInt(localStorage.getItem(SYNAX_REV_KEY) || '0', 10) || 0;
                const remoteState = readStateFromStorage();
                const comparableRemote = remoteState ? stateComparable(remoteState) : '';
                const comparableCandidate = stateComparable(candidate);

                if (remoteRev > localKnownRevisionRef.current && comparableRemote !== comparableCandidate) {
                    saveRecoverySnapshot(candidate, 'save-conflict', {
                        reason: String(reason || 'autosave'),
                        baseRevision: localKnownRevisionRef.current,
                        remoteRevision: remoteRev
                    });
                    notifyReliability('Synax conflict detected; local snapshot saved', 'error');
                    return false;
                }

                const nextRev = Math.max(remoteRev, localKnownRevisionRef.current) + 1;
                localStorage.setItem(SYNAX_STATE_KEY, JSON.stringify(candidate));
                localStorage.setItem(SYNAX_REV_KEY, String(nextRev));
                localStorage.setItem('writingtools_synax_pinned', JSON.stringify(candidate.pinned));
                localStorage.setItem('writingtools_synax_editor', candidate.editorContent);
                localStorage.setItem('writingtools_synax_updated_at', String(Date.now()));
                localKnownRevisionRef.current = nextRev;
                return true;
            }, [buildSerializableState, notifyReliability, readStateFromStorage, saveRecoverySnapshot, stateComparable]);

            const publishContext = useCallback((partial) => {
                const bus = window.WTContextBus;
                if (!bus || !partial || typeof partial !== 'object') return;
                bus.mergeContext({ ...partial, lastTool: 'Synax' });
            }, []);

            useEffect(() => {
                const bus = window.WTContextBus;
                if (!bus) return;
                const ctx = bus.getContext();
                if (ctx.topic && !contextInput.trim()) {
                    setContextInput(ctx.topic);
                }
                setContextMeta({ updatedAt: ctx.updatedAt || '', topic: ctx.topic || '' });
                const unsub = bus.subscribe((next) => {
                    setContextMeta({ updatedAt: next.updatedAt || '', topic: next.topic || '' });
                });
                return () => { if (typeof unsub === 'function') unsub(); };
            }, []);
            const serendipityPoolRef = useRef({ nouns: [], verbs: [], adjectives: [], updatedAt: 0 });

            // --- EFFECTS ---

            useEffect(() => {
                stateRef.current = {
                    mode,
                    contextInput,
                    words,
                    history,
                    pinned,
                    editorContent,
                    offlineMode,
                    darkMode,
                    minimalMode,
                    autoGen,
                    autoGenInterval,
                    serendipityCount
                };
            }, [autoGen, autoGenInterval, contextInput, darkMode, editorContent, history, minimalMode, mode, offlineMode, pinned, serendipityCount, words]);

            useEffect(() => {
                localKnownRevisionRef.current = parseInt(localStorage.getItem(SYNAX_REV_KEY) || '0', 10) || 0;
                const persisted = readStateFromStorage();
                if (!persisted) return;
                skipNextPersistRef.current = true;
                setMode(persisted.mode || 'random');
                setContextInput(String(persisted.contextInput || ''));
                setWords(normalizeWordSet(persisted.words));
                setHistory(normalizeHistory(persisted.history));
                setPinned(normalizePinned(persisted.pinned));
                setEditorContent(String(persisted.editorContent || ''));
                setOfflineMode(!!persisted.settings?.offlineMode);
                setDarkMode(!!persisted.settings?.darkMode);
                setMinimalMode(!!persisted.settings?.minimalMode);
                setAutoGen(!!persisted.settings?.autoGen);
                setAutoGenInterval(Math.min(30, Math.max(2, Number(persisted.settings?.autoGenInterval) || 5)));
                setSerendipityCount(Math.min(12, Math.max(1, Number(persisted.settings?.serendipityCount) || 4)));
            }, [normalizeHistory, normalizePinned, normalizeWordSet, readStateFromStorage]);

            useEffect(() => {
                if (!stateRef.current) return;
                if (skipNextPersistRef.current) {
                    skipNextPersistRef.current = false;
                    return;
                }
                persistSynaxState(stateRef.current, 'state-change');
            }, [autoGen, autoGenInterval, contextInput, darkMode, editorContent, history, minimalMode, mode, offlineMode, persistSynaxState, pinned, serendipityCount, words]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.style.backgroundColor = '#000000';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.style.backgroundColor = '#f8f5f0';
                }
                localStorage.setItem('writingtools_theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            useEffect(() => {
                const onStorage = (event) => {
                    if (!event || event.key !== SYNAX_REV_KEY) return;
                    const incomingRev = parseInt(event.newValue || '0', 10) || 0;
                    if (incomingRev <= localKnownRevisionRef.current) return;
                    const remote = readStateFromStorage();
                    if (!remote) {
                        localKnownRevisionRef.current = incomingRev;
                        return;
                    }
                    const local = stateRef.current ? buildSerializableState(stateRef.current) : buildSerializableState({});
                    if (stateComparable(local) !== stateComparable(remote)) {
                        saveRecoverySnapshot(local, 'remote-sync', {
                            previousRevision: localKnownRevisionRef.current,
                            incomingRevision: incomingRev
                        });
                        skipNextPersistRef.current = true;
                        setMode(remote.mode || 'random');
                        setContextInput(String(remote.contextInput || ''));
                        setWords(normalizeWordSet(remote.words));
                        setHistory(normalizeHistory(remote.history));
                        setPinned(normalizePinned(remote.pinned));
                        setEditorContent(String(remote.editorContent || ''));
                        setOfflineMode(!!remote.settings?.offlineMode);
                        setDarkMode(!!remote.settings?.darkMode);
                        setMinimalMode(!!remote.settings?.minimalMode);
                        setAutoGen(!!remote.settings?.autoGen);
                        setAutoGenInterval(Math.min(30, Math.max(2, Number(remote.settings?.autoGenInterval) || 5)));
                        setSerendipityCount(Math.min(12, Math.max(1, Number(remote.settings?.serendipityCount) || 4)));
                        notifyReliability('Synax synced from another tab; local snapshot saved', 'info');
                    }
                    localKnownRevisionRef.current = incomingRev;
                };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, [buildSerializableState, normalizeHistory, normalizePinned, normalizeWordSet, notifyReliability, readStateFromStorage, saveRecoverySnapshot, stateComparable]);

            // Initial Load
            useEffect(() => {
                loadApiPoolFromStorage();
                if (words.length === 0) generate();
            }, []);

            // Keyboard shortcuts
            useEffect(() => {
                const handleKeyPress = (e) => {
                // Space to generate (when not typing)
                if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    generate();
                }
                // Escape to close canvas
                if (e.code === 'Escape' && showCanvas) {
                    setShowCanvas(false);
                }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [mode, contextInput, offlineMode, serendipityCount, showCanvas]);

            useEffect(() => {
                if (mode === 'random' && !offlineMode) {
                    hydrateSerendipityApiPool().catch(() => {});
                }
            }, [mode, offlineMode]);

            // --- LOGIC ---

            const insertAtCursor = (textToInsert) => {
                if (!textareaRef.current) return;
                
                const textarea = textareaRef.current;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                
                const newText = text.substring(0, start) + textToInsert + text.substring(end);
                setEditorContent(newText);
                
                setTimeout(() => {
                textarea.focus();
                textarea.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
                }, 0);
            };

            const fetchDatamuse = async (params) => {
                if (offlineMode) throw new Error("Offline Mode Enforced");
                const query = new URLSearchParams(params).toString();
                const max = params.max || 40;
                const res = await fetch(`${DATAMUSE_API}?${query}&max=${max}`);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                return data.map(d => d.word);
            };

            const fetchDatamuseRaw = async (params) => {
                if (offlineMode) throw new Error("Offline Mode Enforced");
                const query = new URLSearchParams(params).toString();
                const max = params.max || 250;
                const res = await fetch(`${DATAMUSE_API}?${query}&max=${max}`);
                if (!res.ok) throw new Error('API Error');
                return await res.json();
            };

            const loadApiPoolFromStorage = () => {
                try {
                    const raw = localStorage.getItem(API_POOL_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (!parsed || !parsed.nouns || !parsed.verbs || !parsed.adjectives) {
                        localStorage.removeItem(API_POOL_KEY);
                        return;
                    }
                    serendipityPoolRef.current = {
                        nouns: Array.isArray(parsed.nouns) ? parsed.nouns : [],
                        verbs: Array.isArray(parsed.verbs) ? parsed.verbs : [],
                        adjectives: Array.isArray(parsed.adjectives) ? parsed.adjectives : [],
                        updatedAt: parsed.updatedAt || 0
                    };
                } catch (_) {
                    try { localStorage.removeItem(API_POOL_KEY); } catch (_) {}
                }
            };

            const saveApiPoolToStorage = () => {
                try {
                    localStorage.setItem(API_POOL_KEY, JSON.stringify(serendipityPoolRef.current));
                } catch (_) {}
            };

            const hydrateSerendipityApiPool = async (force = false) => {
                if (offlineMode) return;
                const pool = serendipityPoolRef.current;
                const now = Date.now();
                const freshEnough = (now - (pool.updatedAt || 0)) < 6 * 60 * 60 * 1000;
                const hasDepth = pool.nouns.length > 250 && pool.verbs.length > 200 && pool.adjectives.length > 200;
                if (!force && freshEnough && hasDepth) return;

                const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
                const picks = [];
                while (picks.length < 5) {
                    const letter = letters[Math.floor(Math.random() * letters.length)];
                    if (!picks.includes(letter)) picks.push(letter);
                }

                const requests = picks.map(letter =>
                    fetchDatamuseRaw({ sp: `${letter}*`, md: 'p', max: 350 }).catch(() => [])
                );

                const rawBatches = await Promise.all(requests);
                const buckets = { nouns: new Set(pool.nouns), verbs: new Set(pool.verbs), adjectives: new Set(pool.adjectives) };

                rawBatches.flat().forEach(item => {
                    if (!item || !item.word) return;
                    const word = String(item.word).toLowerCase().trim();
                    if (!/^[a-z][a-z-]{2,}$/.test(word)) return;
                    const tags = Array.isArray(item.tags) ? item.tags : [];
                    if (tags.includes('n')) buckets.nouns.add(word);
                    if (tags.includes('v')) buckets.verbs.add(word);
                    if (tags.includes('adj')) buckets.adjectives.add(word);
                });

                serendipityPoolRef.current = {
                    nouns: [...buckets.nouns].slice(-2500),
                    verbs: [...buckets.verbs].slice(-2000),
                    adjectives: [...buckets.adjectives].slice(-2000),
                    updatedAt: now
                };
                saveApiPoolToStorage();
            };

            const pickSerendipityWord = (category) => {
                const pool = serendipityPoolRef.current[category] || [];
                if (pool.length > 0) {
                    const filtered = pool.filter(w => !recentWords.includes(w.toLowerCase()));
                    return getRandom(filtered.length > 8 ? filtered : pool);
                }
                return '';
            };

            const addToHistory = (newSet) => {
                setHistory(prev => [...prev.slice(-9), newSet]);
                setWords(newSet);
                // Add words to recent list for repetition prevention
                const newWordTexts = newSet.map(w => w.word.toLowerCase());
                setRecentWords(prev => [...prev, ...newWordTexts].slice(-REPETITION_COOLDOWN * 4));
            };

            // Get random word with repetition prevention
            const getRandomAvoidRecent = (arr) => {
                // Filter out recently used words
                const available = arr.filter(w => !recentWords.includes(w.toLowerCase()));
                // If too few available, use full array
                if (available.length < 5) return getRandom(arr);
                return getRandom(available);
            };

            const undoGeneration = useCallback(() => {
                if (history.length > 1) {
                const newHistory = [...history];
                newHistory.pop();
                const previous = newHistory[newHistory.length - 1];
                setHistory(newHistory);
                setWords(previous);
                }
            }, [history]);

            const handleSwap = useCallback((id, type) => {
                let newWord = "";

                // Helper to get random word by type with repetition prevention
                if (type.includes('Noun')) newWord = (!offlineMode ? pickSerendipityWord('nouns') : '') || getRandomAvoidRecent(LOCAL_LIBRARY.nouns);
                else if (type.includes('Verb')) newWord = (!offlineMode ? pickSerendipityWord('verbs') : '') || getRandomAvoidRecent(LOCAL_LIBRARY.verbs);
                else if (type.includes('Adjective')) newWord = (!offlineMode ? pickSerendipityWord('adjectives') : '') || getRandomAvoidRecent(LOCAL_LIBRARY.adjectives);
                else if (type.includes('Actor')) newWord = getRandomAvoidRecent(LOCAL_LIBRARY.actors);
                else if (type.includes('Setting')) newWord = getRandomAvoidRecent(LOCAL_LIBRARY.settings);
                else newWord = (!offlineMode ? pickSerendipityWord('nouns') : '') || getRandomAvoidRecent(LOCAL_LIBRARY.nouns); // Fallback for wildcards/other

                // Track this swapped word to prevent immediate repetition
                setRecentWords(prev => [...prev, newWord.toLowerCase()].slice(-REPETITION_COOLDOWN * 4));

                setWords(prevWords => prevWords.map(w =>
                    w.id === id ? { ...w, word: newWord } : w
                ));
            }, [offlineMode, REPETITION_COOLDOWN]);

            const handleDelete = useCallback((id) => {
                setWords(prevWords => prevWords.filter(w => w.id !== id));
            }, []);

            const generate = useCallback(async () => {
                setLoading(true);
                if ((mode === 'context' || mode === 'rhyme') && contextInput.trim()) {
                    publishContext({ topic: contextInput.trim() });
                }
                let newWords = [];

                try {
                if (mode === 'random') {
                    // API-first serendipity: call Datamuse for full dictionary variety
                    if (!offlineMode) {
                        try {
                            const seed = getRandom(SEED_CONCEPTS);
                            const [mlResults, adjResults, trigResults] = await Promise.all([
                                fetchDatamuse({ ml: seed, md: 'p', max: 50 }),
                                fetchDatamuse({ rel_jjb: seed, max: 30 }),
                                fetchDatamuse({ rel_trg: seed, max: 30 })
                            ]);

                            // fetchDatamuse returns string[] but with md=p we need raw data
                            // Re-fetch with metadata for part-of-speech tagging
                            const rawRes = await fetch(`${DATAMUSE_API}?ml=${encodeURIComponent(seed)}&md=p&max=60`);
                            const rawData = rawRes.ok ? await rawRes.json() : [];

                            const apiNouns = rawData.filter(w => w.tags?.includes('n')).map(w => w.word);
                            const apiVerbs = rawData.filter(w => w.tags?.includes('v')).map(w => w.word);
                            const apiAdjs = adjResults.length > 0 ? adjResults : rawData.filter(w => w.tags?.includes('adj')).map(w => w.word);
                            const apiWild = trigResults.length > 0 ? trigResults : mlResults;

                            for (let i = 0; i < serendipityCount; i++) {
                                let type, word;
                                if (i === 0 && apiNouns.length > 0) {
                                    type = 'Noun'; word = getRandomAvoidRecent(apiNouns);
                                } else if (i === 1 && apiVerbs.length > 0) {
                                    type = 'Verb'; word = getRandomAvoidRecent(apiVerbs);
                                } else if (i === 2 && apiAdjs.length > 0) {
                                    type = 'Adjective'; word = getRandomAvoidRecent(apiAdjs);
                                } else {
                                    const roll = Math.random();
                                    if (roll < 0.25 && apiNouns.length > 0) { type = 'Noun'; word = getRandomAvoidRecent(apiNouns); }
                                    else if (roll < 0.5 && apiAdjs.length > 0) { type = 'Adjective'; word = getRandomAvoidRecent(apiAdjs); }
                                    else if (roll < 0.75 && apiWild.length > 0) { type = 'Association'; word = getRandomAvoidRecent(apiWild); }
                                    else { type = 'Discovery'; word = getRandomAvoidRecent(mlResults.length > 0 ? mlResults : LOCAL_LIBRARY.nouns); }
                                }
                                if (word) newWords.push({ word, type });
                            }
                            // Fill any gaps if API returned too few
                            if (newWords.length < serendipityCount) throw new Error("Insufficient API results");
                        } catch (apiErr) {
                            // Fallback to local library
                            newWords = [];
                            const definitions = [
                                { type: 'Noun', src: LOCAL_LIBRARY.nouns },
                                { type: 'Verb', src: LOCAL_LIBRARY.verbs },
                                { type: 'Adjective', src: LOCAL_LIBRARY.adjectives }
                            ];
                            for (let i = 0; i < serendipityCount; i++) {
                                let type, word;
                                if (i < 3) {
                                    type = definitions[i].type;
                                    word = getRandomAvoidRecent(definitions[i].src);
                                } else {
                                    const roll = Math.random();
                                    if (roll < 0.3) { type = 'Actor'; word = getRandomAvoidRecent(LOCAL_LIBRARY.actors); }
                                    else if (roll < 0.6) { type = 'Adjective'; word = getRandomAvoidRecent(LOCAL_LIBRARY.adjectives); }
                                    else { type = 'Wildcard'; word = getRandomAvoidRecent(LOCAL_LIBRARY.nouns); }
                                }
                                newWords.push({ word, type });
                            }
                        }
                    } else {
                        // Offline mode: use local library
                        const definitions = [
                            { type: 'Noun', src: LOCAL_LIBRARY.nouns },
                            { type: 'Verb', src: LOCAL_LIBRARY.verbs },
                            { type: 'Adjective', src: LOCAL_LIBRARY.adjectives }
                        ];
                        for (let i = 0; i < serendipityCount; i++) {
                            let type, word;
                            if (i < 3) {
                                type = definitions[i].type;
                                word = getRandomAvoidRecent(definitions[i].src);
                            } else {
                                const roll = Math.random();
                                if (roll < 0.3) { type = 'Actor'; word = getRandomAvoidRecent(LOCAL_LIBRARY.actors); }
                                else if (roll < 0.6) { type = 'Adjective'; word = getRandomAvoidRecent(LOCAL_LIBRARY.adjectives); }
                                else { type = 'Wildcard'; word = getRandomAvoidRecent(LOCAL_LIBRARY.nouns); }
                            }
                            newWords.push({ word, type });
                        }
                    }
                } else if (mode === 'triad') {
                    let actor = getRandomAvoidRecent(LOCAL_LIBRARY.actors);
                    let action = getRandomAvoidRecent(LOCAL_LIBRARY.verbs);
                    let setting = getRandomAvoidRecent(LOCAL_LIBRARY.settings);

                    // Narrative mode should stay coherent and cinematic by default.
                    // API enrichment is optional and only used if we can find clear verbs.
                    if (!offlineMode && contextInput.trim()) {
                        try {
                            const contextSeed = contextInput.trim().toLowerCase();
                            const relatedRaw = await fetchDatamuseRaw({ ml: contextSeed, md: 'p', max: 120 });
                            const contextVerbs = relatedRaw
                                .filter(item => item && item.word && Array.isArray(item.tags) && item.tags.includes('v'))
                                .map(item => String(item.word).toLowerCase())
                                .filter(word => /^[a-z-]{4,}$/.test(word));

                            if (contextVerbs.length > 0) {
                                action = getRandomAvoidRecent(contextVerbs);
                            }

                            const matchingSetting = LOCAL_LIBRARY.settings.find(s => s.toLowerCase().includes(contextSeed));
                            if (matchingSetting) {
                                setting = matchingSetting;
                            }
                        } catch (_) {
                            // Keep curated fallback if API enrichment fails.
                        }
                    }
                    newWords = [
                    { word: actor, type: 'The Actor' },
                    { word: action, type: 'The Action' },
                    { word: setting, type: 'The Setting' }
                    ];
                } else if (mode === 'context') {
                    if (!contextInput) {
                        const concepts = ["Time", "Space", "War", "Love", "Fear", "Nature"];
                        const seed = getRandom(concepts);
                        setContextInput(seed); 
                    }
                    
                    if (offlineMode) {
                        newWords = [
                        { word: getRandom(LOCAL_LIBRARY.nouns), type: 'Concept (Offline)' },
                        { word: getRandom(LOCAL_LIBRARY.adjectives), type: 'Concept (Offline)' },
                        { word: getRandom(LOCAL_LIBRARY.verbs), type: 'Concept (Offline)' },
                        { word: getRandom(LOCAL_LIBRARY.settings), type: 'Concept (Offline)' }
                        ];
                    } else {
                        const effectiveInput = contextInput || getRandom(["Time", "Space", "War", "Love", "Fear", "Nature"]);
                        
                        const adj = await fetchDatamuse({ rel_jjb: effectiveInput, max: 15 });
                        const nouns = await fetchDatamuse({ ml: effectiveInput, max: 15 });
                        const triggers = await fetchDatamuse({ rel_trg: effectiveInput, max: 15 });
            
                        const pool = [
                        ...adj.map(w => ({ word: w, type: 'Descriptor' })),
                        ...nouns.map(w => ({ word: w, type: 'Related' })),
                        ...triggers.map(w => ({ word: w, type: 'Association' }))
                        ];
                        newWords = pool.sort(() => 0.5 - Math.random()).slice(0, 6);
                        if (newWords.length < 3) throw new Error("Not enough words");
                    }
                } else if (mode === 'rhyme') {
                    if (!contextInput) {
                        setLoading(false);
                        return;
                    }
                    if (offlineMode) {
                        alert("Rhyme mode requires internet connection.");
                        setLoading(false);
                        return;
                    }
                    const perfect = await fetchDatamuse({ rel_rhy: contextInput, max: 20 });
                    const slant = await fetchDatamuse({ rel_nry: contextInput, max: 20 });
                    const pool = [
                    ...perfect.map(w => ({ word: w, type: 'Perfect Rhyme' })),
                    ...slant.map(w => ({ word: w, type: 'Near Rhyme' }))
                    ];
                    newWords = pool.sort(() => 0.5 - Math.random()).slice(0, 8);
                }
                } catch (err) {
                newWords = [
                    { word: getRandomAvoidRecent(LOCAL_LIBRARY.nouns), type: 'Noun (Offline)' },
                    { word: getRandomAvoidRecent(LOCAL_LIBRARY.verbs), type: 'Verb (Offline)' },
                    { word: getRandomAvoidRecent(LOCAL_LIBRARY.adjectives), type: 'Adjective (Offline)' },
                    { word: getRandomAvoidRecent(LOCAL_LIBRARY.nouns), type: 'Noun (Offline)' }
                ];
                }
                const finalSet = newWords.map((w, i) => ({ ...w, id: Date.now() + i }));
                addToHistory(finalSet);
                setLoading(false);
            }, [mode, contextInput, offlineMode, serendipityCount, publishContext]); 

            // Auto-Generate Effect
            useEffect(() => {
                let interval;
                if (autoGen) {
                    interval = setInterval(() => {
                        if (!loading) {
                            generate();
                        }
                    }, autoGenInterval * 1000);
                }
                return () => clearInterval(interval);
            }, [autoGen, autoGenInterval, generate, loading]);

            const generateSpark = useCallback(() => {
                const adj = getRandomAvoidRecent(LOCAL_LIBRARY.adjectives);
                const actor = getRandomAvoidRecent(LOCAL_LIBRARY.actors);
                const verb = getRandomAvoidRecent(LOCAL_LIBRARY.verbs);
                const setting = getRandomAvoidRecent(LOCAL_LIBRARY.settings);
                const sentence = `The ${adj} ${actor} ${verb}s in the ${setting}.`;
                // Track these words
                setRecentWords(prev => [...prev, adj.toLowerCase(), actor.toLowerCase(), verb.toLowerCase(), setting.toLowerCase()].slice(-REPETITION_COOLDOWN * 4));
                setEditorContent(prev => prev + (prev ? '\n' : '') + sentence);
                setShowCanvas(true);
                setTimeout(() => {
                    if(textareaRef.current) {
                        textareaRef.current.scrollTop = textareaRef.current.scrollHeight;
                    }
                }, 100);
            }, [REPETITION_COOLDOWN]);

            const handlePin = useCallback((word, type) => {
                if (!pinned.some(p => p.word === word)) {
                setPinned([...pinned, { word, type, id: Date.now() }]);
                } else {
                setPinned(pinned.filter(p => p.word !== word));
                }
            }, [pinned]);

            const fetchDefinition = useCallback(async (word) => {
                const cleanWord = word.replace(/^The\s+/i, '').trim();
                if (!cleanWord) return;
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(`${cleanWord} definition`)}`;
                window.open(searchUrl, '_blank', 'noopener,noreferrer');
            }, []);

            const clearHistory = useCallback(() => {
                setHistory([]);
                setWords([]);
            }, []);

            const clearCanvas = useCallback(() => {
                if(window.confirm("Clear your writing canvas?")) {
                    setEditorContent('');
                }
            }, []);

            const downloadEditorMarkdown = useCallback(() => {
                const blob = new Blob([editorContent], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'synax-idea.md';
                a.click();
                URL.revokeObjectURL(url);
            }, [editorContent]);

            const sendToBeatHive = useCallback(() => {
                const topTopic = contextInput.trim() || (words[0]?.word || '').trim();
                const constraints = words
                    .slice(0, 6)
                    .map((w) => `${w.type}: ${w.word}`)
                    .join(' | ');
                publishContext({ topic: topTopic, constraints });
                window.open('BeatHive.html', '_blank', 'noopener');
            }, [contextInput, words, publishContext]);

            useEffect(() => {
                window.WTToolActions = {
                    exportPrimary: downloadEditorMarkdown,
                    handoffPrimary: sendToBeatHive
                };
                return () => {
                    try { delete window.WTToolActions; } catch (_) {}
                };
            }, [downloadEditorMarkdown, sendToBeatHive]);

            return (
                <div className={`min-h-screen transition-colors duration-700 ease-in-out ${darkMode ? 'bg-[#000000] text-slate-300' : 'bg-[#f8f5f0] text-slate-800'} font-sans overflow-hidden flex flex-col relative`}>
                
                {/* Background Ambience (Hidden in Minimal Mode) */}
                {!minimalMode && (
                    <div className={`absolute top-0 left-0 right-0 h-[500px] pointer-events-none opacity-40 transition-opacity duration-1000 ${darkMode ? 'opacity-30' : 'opacity-60'}`}>
                    <div className="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-pink-500/20 blur-[100px]" />
                    <div className="absolute top-[10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-fuchsia-500/20 blur-[120px]" />
                    </div>
                )}

                {/* --- HEADER --- */}
                {minimalMode ? (
                    <div className="absolute top-4 right-4 z-50">
                    <button 
                        onClick={() => setShowSettings(true)}
                        className="p-3 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md text-slate-400 hover:text-white transition-colors shadow-lg"
                    >
                        <Settings size={20} />
                    </button>
                    </div>
                ) : (
                    <header className="flex-none px-6 py-4 border-b border-pink-100/50 dark:border-white/5 bg-white/40 dark:bg-[#000000]/60 backdrop-blur-xl z-20 flex justify-between items-center sticky top-0">
                        <div className="flex items-center gap-3">
                        <div className="w-9 h-9 bg-gradient-to-br from-pink-500 to-fuchsia-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-pink-500/20 ring-1 ring-white/20">
                            <Synapse size={18} />
                        </div>
                        <div>
                            <h1 className="text-xl font-black tracking-tight text-slate-900 dark:text-white font-serif leading-none">Synax</h1>
                            <span className="text-[10px] font-bold tracking-widest text-pink-500 dark:text-pink-400 uppercase">Creative Engine v3.2</span>
                            <div className="text-[9px] uppercase tracking-[0.14em] opacity-35 mt-1" title={contextMeta.topic || 'No topic set'}>
                                Context · {contextMeta.updatedAt ? new Date(contextMeta.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'idle'}
                            </div>
                        </div>
                        </div>

                        <div className="flex items-center gap-3">
                        <button 
                            onClick={() => setShowCanvas(!showCanvas)}
                            className={`hidden md:flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-full transition-all duration-300 ${showCanvas ? 'bg-pink-100 dark:bg-pink-900/30 text-pink-600 dark:text-pink-300 shadow-inner' : 'hover:bg-white/50 dark:hover:bg-white/5 text-slate-600 dark:text-slate-400'}`}
                        >
                            <Maximize2 size={16} /> {showCanvas ? 'Hide Canvas' : 'Canvas'}
                        </button>
                        <button 
                            onClick={() => setShowSettings(true)}
                            className="p-2.5 rounded-full hover:bg-white/50 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-400"
                        >
                            <Settings size={20} />
                        </button>
                        </div>
                    </header>
                )}

                <div className="flex-1 flex overflow-hidden relative z-10">
                    
                    {/* --- MAIN GENERATOR AREA --- */}
                    <main className={`flex-1 flex flex-col p-4 md:p-8 transition-all duration-500 ease-in-out ${showCanvas && !minimalMode ? 'md:w-[calc(100%-400px)] lg:w-[calc(100%-480px)]' : 'w-full'}`}>
                    
                    <div className="max-w-5xl mx-auto w-full flex flex-col h-full">
                        
                        {/* Controls */}
                        {!minimalMode && (
                            <div className="flex-none mb-6">
                            <ModeSelector activeMode={mode} setMode={setMode} />
                            
                            {(mode === 'context' || mode === 'rhyme') && (
                                <div className="mb-6 animate-in slide-in-from-top-4 fade-in duration-300">
                                <div className="relative group">
                                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-pink-500 transition-colors" size={20} />
                                    <input 
                                    type="text" 
                                    value={contextInput}
                                    onChange={(e) => setContextInput(e.target.value)}
                                    placeholder={mode === 'context' ? "Enter a topic (e.g., Space, Ocean)..." : "Enter a word to find rhymes..."}
                                    className="w-full bg-white/50 dark:bg-white/5 border border-pink-100 dark:border-white/10 rounded-2xl py-4 pl-12 pr-4 text-lg focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 shadow-sm transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600 text-slate-800 dark:text-slate-100"
                                    onKeyDown={(e) => e.key === 'Enter' && generate()}
                                    />
                                </div>
                                </div>
                            )}

                            {mode === 'random' && (
                                <div className="mb-6 animate-in slide-in-from-top-4 fade-in duration-300">
                                    <div className="flex items-center gap-4 bg-white/50 dark:bg-white/5 border border-pink-100 dark:border-white/10 rounded-2xl p-4">
                                         <div className="flex items-center gap-2 text-pink-500 dark:text-pink-400">
                                            <Layers size={18} />
                                            <span className="text-sm font-bold uppercase tracking-wider">Words: {serendipityCount}</span>
                                         </div>
                                         <div className="flex-1 flex items-center gap-4">
                                            <button onClick={() => setSerendipityCount(Math.max(1, serendipityCount - 1))} className="p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10"><Minus size={16} /></button>
                                            <input 
                                              type="range" 
                                              min="1" 
                                              max="12" 
                                              value={serendipityCount} 
                                              onChange={(e) => setSerendipityCount(parseInt(e.target.value))}
                                              className="flex-1 h-2 bg-slate-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer accent-pink-500"
                                            />
                                            <button onClick={() => setSerendipityCount(Math.min(12, serendipityCount + 1))} className="p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10"><Plus size={16} /></button>
                                         </div>
                                    </div>
                                </div>
                            )}
                            </div>
                        )}

                        {/* Action Bar */}
                        <div className={`flex-none flex flex-wrap items-center justify-center gap-3 mb-6 pb-6 border-b border-pink-100 dark:border-white/5 ${minimalMode ? 'pt-8' : ''}`}>
                            {history.length > 1 && (
                                <button 
                                    onClick={undoGeneration}
                                    className="px-4 py-3 rounded-xl border border-pink-100 dark:border-white/10 text-slate-500 hover:text-pink-500 dark:hover:text-white hover:bg-white dark:hover:bg-white/5 transition-colors flex items-center gap-2"
                                    title="Undo last generation"
                                >
                                    <Undo2 size={18} />
                                </button>
                            )}
                            
                            <button 
                                onClick={generate}
                                className="group relative flex-1 max-w-xs px-8 py-3 bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-500 hover:to-fuchsia-500 text-white rounded-xl font-bold shadow-lg shadow-pink-500/25 active:scale-95 transition-all flex items-center justify-center gap-2 overflow-hidden"
                            >
                                {autoGen ? (
                                    <div className="absolute inset-0 bg-white/10 flex items-center justify-center">
                                        <div className="w-full h-1 bg-white/30 absolute bottom-0 left-0">
                                            <div className="h-full bg-white animate-pulse" style={{ width: '100%' }} />
                                        </div>
                                    </div>
                                ) : (
                                    <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 rounded-xl" />
                                )}
                                
                                {autoGen ? (
                                    <span className="flex items-center gap-2 animate-pulse"><Timer size={18} /> Auto ({autoGenInterval}s)</span>
                                ) : (
                                    <>
                                        <RefreshCw size={20} className={loading ? "animate-spin" : "group-hover:rotate-180 transition-transform duration-500"} />
                                        <span className="relative">Generate</span>
                                    </>
                                )}
                            </button>

                            {!minimalMode && (
                                <button 
                                    onClick={generateSpark}
                                    className="px-6 py-3 rounded-xl border border-pink-200 dark:border-white/10 text-pink-500 dark:text-pink-300 hover:bg-pink-50 dark:hover:bg-pink-900/20 hover:border-pink-300 transition-colors flex items-center gap-2 font-bold"
                                    title="Generate a full sentence"
                                >
                                    <Flame size={18} className="fill-pink-200 dark:fill-pink-900/0" />
                                    Spark Idea
                                </button>
                            )}

                            {!minimalMode && (
                                <button
                                    onClick={sendToBeatHive}
                                    className="px-6 py-3 rounded-xl border border-pink-200 dark:border-white/10 text-slate-600 dark:text-slate-200 hover:bg-pink-50 dark:hover:bg-pink-900/20 hover:border-pink-300 transition-colors flex items-center gap-2 font-bold"
                                    title="Send current context to BeatHive"
                                >
                                    <Grid size={18} />
                                    Send to BeatHive
                                </button>
                            )}
                        </div>

                        {/* Output Grid */}
                        <div className="flex-1 overflow-y-auto min-h-[300px] mb-6 p-4 custom-scrollbar pb-20">
                        {loading ? (
                            <div className="h-full flex flex-col items-center justify-center opacity-70 space-y-6">
                            <div className="relative">
                                <div className="w-16 h-16 border-4 border-pink-500/30 border-t-pink-500 rounded-full animate-spin"></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <Sparkles size={20} className="text-pink-500 animate-pulse" />
                                </div>
                            </div>
                            <p className="font-mono text-xs tracking-[0.2em] uppercase text-pink-400 font-bold">Processing...</p>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {words.map((w) => (
                                    <Card 
                                    key={w.id} 
                                    id={w.id}
                                    word={w.word} 
                                    type={w.type} 
                                    onPin={handlePin} 
                                    isPinned={pinned.some(p => p.word === w.word)}
                                    onDefine={fetchDefinition}
                                    onSwap={handleSwap}
                                    onDelete={handleDelete}
                                    />
                                ))}
                                </div>
                            </div>
                        )}
                        </div>

                        {/* Footer Status */}
                        {!minimalMode && (
                            <div className="absolute bottom-4 left-4 right-4 flex justify-between items-center text-[10px] font-bold tracking-widest text-slate-400 uppercase">
                            <span className="flex items-center gap-2 px-3 py-1 rounded-full bg-white/50 dark:bg-white/5 backdrop-blur-sm">
                                {offlineMode ? <WifiOff size={12} className="text-slate-400"/> : <Wifi size={12} className="text-emerald-400"/>}
                                {offlineMode ? 'LOCAL' : 'API'}
                            </span>
                            <a href="index.html" className="opacity-30 hover:opacity-100 transition-opacity" style={{textDecoration: 'none', color: 'inherit'}}>Writing Tools Suite</a>
                            </div>
                        )}

                    </div>
                    </main>

                    {/* --- THE CANVAS (Writing Area) --- */}
                    {/* Hidden entirely in minimal mode */}
                    {!minimalMode && (
                        <aside className={`fixed inset-y-0 right-0 w-full md:w-[400px] lg:w-[480px] bg-white/90 dark:bg-[#12111a]/95 backdrop-blur-xl border-l border-pink-100 dark:border-white/5 shadow-2xl transform transition-transform duration-300 z-30 flex flex-col ${showCanvas ? 'translate-x-0' : 'translate-x-full'}`}>
                        
                        {/* Canvas Header */}
                        <div className="flex-none p-4 border-b border-pink-100 dark:border-white/5 flex justify-between items-center bg-pink-50/30 dark:bg-white/5">
                            <div className="flex items-center gap-2 text-pink-500 dark:text-pink-300 font-bold">
                            <Type size={18} />
                            <span>Canvas</span>
                            </div>
                            <button
                                onClick={() => setShowCanvas(false)}
                                className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-white/10 hover:bg-rose-100 dark:hover:bg-rose-900/30 text-slate-500 hover:text-rose-600 transition-colors font-bold text-xs"
                            >
                                <X size={16}/>
                                <span>Close</span>
                            </button>
                        </div>

                        {/* Pinned Words (The Palette) */}
                        <div className="flex-none p-5 space-y-4 bg-gradient-to-b from-pink-50/50 to-transparent dark:from-white/5 dark:to-transparent">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xs font-bold text-pink-400 uppercase tracking-widest flex items-center gap-2">
                                    <Synapse size={14}/> Pinned Concepts
                                </h3>
                                {pinned.length > 0 && (
                                    <button onClick={() => setPinned([])} className="text-[10px] text-rose-400 hover:text-rose-500 font-bold uppercase tracking-wider">Clear</button>
                                )}
                            </div>
                            
                            <div className="flex flex-wrap gap-2 max-h-[160px] overflow-y-auto custom-scrollbar p-1">
                            {pinned.length === 0 ? (
                                <div className="w-full text-center py-6 border-2 border-dashed border-pink-100 dark:border-white/5 rounded-xl">
                                    <Sparkles className="mx-auto text-pink-200 mb-2" size={20} />
                                    <p className="text-xs text-slate-400 font-medium">Pin words to save them</p>
                                </div>
                            ) : (
                                pinned.map(p => (
                                <div 
                                    key={p.id} 
                                    className="group flex items-center gap-0 bg-white dark:bg-[#1a1924] border border-pink-100 dark:border-white/10 rounded-full shadow-sm hover:shadow-md transition-all duration-200 animate-in zoom-in"
                                >
                                    <span 
                                        onClick={() => insertAtCursor(' ' + p.word)}
                                        className="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-200 cursor-pointer hover:text-pink-500 dark:hover:text-pink-300 transition-colors border-r border-pink-50 dark:border-white/5"
                                    >
                                    {p.word}
                                    </span>
                                    <button 
                                    onClick={(e) => { e.stopPropagation(); setPinned(pinned.filter(x => x.id !== p.id)); }}
                                    className="px-2 py-1.5 text-slate-300 hover:text-rose-500 transition-colors"
                                    >
                                    <X size={12} />
                                    </button>
                                </div>
                                ))
                            )}
                            </div>
                        </div>

                        {/* Text Editor */}
                        <div className="flex-1 p-5 pt-0 flex flex-col relative">
                            <div className="flex-1 relative rounded-2xl border border-pink-100 dark:border-white/5 bg-white/50 dark:bg-[#0f0e15] overflow-hidden focus-within:ring-2 focus-within:ring-pink-500/30 transition-shadow shadow-inner mt-2">
                            <textarea
                                ref={textareaRef}
                                value={editorContent}
                                onChange={(e) => setEditorContent(e.target.value)}
                                placeholder="Start writing..."
                                className="w-full h-full p-6 bg-transparent resize-none outline-none font-serif text-lg leading-loose text-slate-800 dark:text-slate-200 placeholder:text-slate-300 dark:placeholder:text-slate-700"
                            />
                            
                            {/* Editor Toolbar */}
                            <div className="absolute bottom-4 right-4 flex gap-2">
                                <button 
                                onClick={clearCanvas}
                                className="p-2 text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-colors" 
                                title="Clear Editor"
                                >
                                <Trash2 size={16} />
                                </button>
                                <button 
                                onClick={downloadEditorMarkdown}
                                className="p-2 text-slate-300 hover:text-pink-500 hover:bg-pink-50 dark:hover:bg-pink-900/20 rounded-lg transition-colors"
                                title="Download Markdown"
                                >
                                <Download size={16} />
                                </button>
                            </div>
                            </div>
                        </div>
                        </aside>
                    )}
                </div>

                {/* --- SETTINGS MODAL --- */}
                {showSettings && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-in fade-in duration-200">
                        <div className="bg-white dark:bg-[#16151f] rounded-2xl w-full max-w-sm p-6 shadow-2xl shadow-pink-900/20 border border-white/20 dark:border-white/10 space-y-6">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xl font-black text-slate-800 dark:text-white font-serif">Settings</h3>
                                <button onClick={() => setShowSettings(false)}><X className="text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors"/></button>
                            </div>
                            
                            <div className="space-y-3">
                                
                                {/* Dark Mode */}
                                <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-white/5">
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-lg ${darkMode ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/30' : 'bg-white text-slate-400 shadow-sm'}`}>
                                            <Sparkles size={18} />
                                        </div>
                                        <span className="font-bold text-sm dark:text-slate-200">Dark Mode</span>
                                    </div>
                                    <button 
                                        onClick={() => setDarkMode(!darkMode)}
                                        className={`w-12 h-6 rounded-full transition-colors relative ${darkMode ? 'bg-pink-500' : 'bg-slate-300'}`}
                                    >
                                        <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${darkMode ? 'translate-x-6' : ''}`} />
                                    </button>
                                </div>

                                {/* Minimal Mode */}
                                <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-white/5">
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-lg ${minimalMode ? 'bg-slate-700 text-white shadow-lg' : 'bg-white text-slate-400 shadow-sm'}`}>
                                            <Layout size={18} />
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm dark:text-slate-200">Minimal Mode</span>
                                            <span className="text-[10px] text-slate-400">Zen layout, no distractions</span>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setMinimalMode(!minimalMode)}
                                        className={`w-12 h-6 rounded-full transition-colors relative ${minimalMode ? 'bg-slate-700' : 'bg-slate-300'}`}
                                    >
                                        <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${minimalMode ? 'translate-x-6' : ''}`} />
                                    </button>
                                </div>

                                {/* API Enrichment */}
                                <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-white/5">
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-lg ${offlineMode ? 'bg-slate-400 text-white shadow-sm' : 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30'}`}>
                                            {offlineMode ? <WifiOff size={18} /> : <Wifi size={18} />}
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm dark:text-slate-200">Smart Suggestions</span>
                                            <span className="text-[10px] text-slate-400">External word database</span>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setOfflineMode(!offlineMode)}
                                        className={`w-12 h-6 rounded-full transition-colors relative ${offlineMode ? 'bg-slate-300' : 'bg-emerald-400'}`}
                                    >
                                        <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${offlineMode ? '' : 'translate-x-6'}`} />
                                    </button>
                                </div>

                                {/* Auto-Generate */}
                                <div className="p-3 rounded-xl bg-slate-50 dark:bg-white/5 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 rounded-lg ${autoGen ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/30' : 'bg-white text-slate-400 shadow-sm'}`}>
                                                <Timer size={18} />
                                            </div>
                                            <span className="font-bold text-sm dark:text-slate-200">Auto-Generate</span>
                                        </div>
                                        <button 
                                            onClick={() => setAutoGen(!autoGen)}
                                            className={`w-12 h-6 rounded-full transition-colors relative ${autoGen ? 'bg-amber-500' : 'bg-slate-300'}`}
                                        >
                                            <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${autoGen ? 'translate-x-6' : ''}`} />
                                        </button>
                                    </div>
                                    
                                    {autoGen && (
                                        <div className="pt-2 animate-in fade-in slide-in-from-top-2">
                                            <div className="flex justify-between text-xs font-medium text-slate-500 mb-1">
                                            <span>Interval</span>
                                            <span>{autoGenInterval}s</span>
                                            </div>
                                            <input 
                                            type="range" 
                                            min="2" 
                                            max="30" 
                                            value={autoGenInterval} 
                                            onChange={(e) => setAutoGenInterval(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer accent-amber-500"
                                            />
                                        </div>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-slate-100 dark:border-white/5">
                                    <button onClick={clearHistory} className="w-full py-3 text-sm font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl transition-colors">
                                        Clear Session History
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* --- DEFINITION MODAL --- */}
                {definition && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-in fade-in duration-200" onClick={() => setDefinition(null)}>
                    <div className="bg-white dark:bg-[#16151f] rounded-2xl max-w-lg w-full p-8 shadow-2xl border border-white/20 dark:border-white/10" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <h2 className="text-4xl font-serif font-black text-slate-900 dark:text-white capitalize tracking-tight mb-2">{definition.word}</h2>
                                {definition.phonetic && (
                                    <span className="text-pink-500 font-mono text-sm px-2 py-1 bg-pink-50 dark:bg-pink-900/20 rounded">{definition.phonetic}</span>
                                )}
                            </div>
                            <button onClick={() => setDefinition(null)} className="p-2 hover:bg-slate-100 dark:hover:bg-white/10 rounded-full text-slate-400 transition-colors"><X size={24}/></button>
                        </div>
                        
                        <div className="space-y-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
                            {definition.meanings?.map((m, i) => (
                            <div key={i}>
                                <span className="text-xs font-bold uppercase text-slate-400 tracking-widest">{m.partOfSpeech}</span>
                                <ul className="mt-3 space-y-3">
                                {m.definitions.slice(0, 2).map((d, j) => (
                                    <li key={j} className="text-slate-700 dark:text-slate-300 leading-relaxed pl-4 border-l-2 border-pink-200 dark:border-violet-800">
                                    {d.definition}
                                    </li>
                                ))}
                                </ul>
                            </div>
                            ))}
                            {definition.meanings?.length === 0 && (
                            <div className="text-center py-8">
                                <BookOpen size={40} className="mx-auto text-slate-200 mb-4"/>
                                <p className="text-slate-500 italic">No definition found. It might be a rare or poetic word.</p>
                            </div>
                            )}
                        </div>
                        
                        <div className="mt-8 flex justify-end pt-4 border-t border-slate-100 dark:border-white/5">
                            <a 
                            href={`https://www.google.com/search?q=define+${definition.word}`} 
                            target="_blank" 
                            rel="noreferrer"
                            className="text-sm font-bold text-pink-500 hover:text-pink-500 flex items-center gap-1 group"
                            >
                            Full details <ChevronRight size={14} className="group-hover:translate-x-1 transition-transform" />
                            </a>
                        </div>
                    </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Synax />);
    </script>
</body>
</html>
